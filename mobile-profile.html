<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人中心 - 研发费管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .menu-item {
            transition: all 0.2s ease;
        }
        .menu-item:active {
            background-color: #f3f4f6;
        }
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto;
        }
        .avatar-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #667eea;
            border: 2px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
    </style>
</head>
<body class="pb-20">
    <div class="max-w-lg mx-auto px-4 py-6">
        <div class="glass-card p-6 mb-4 text-center">
            <div class="avatar-container mb-4">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="用户头像" class="w-24 h-24 rounded-full border-4 border-white">
                <div class="avatar-overlay">
                    <i class="fa fa-camera"></i>
                </div>
            </div>
            <h2 class="text-xl font-semibold text-gray-800">管理员</h2>
            <p class="text-gray-500 mb-4">研发费用业务部</p>
            <div class="flex justify-center space-x-6 mb-4">
                <div class="text-center">
                    <p class="text-purple-600 font-bold">120</p>
                    <p class="text-xs text-gray-500">总工时</p>
                </div>
                <div class="text-center">
                    <p class="text-green-600 font-bold">15</p>
                    <p class="text-xs text-gray-500">打卡天数</p>
                </div>
                <div class="text-center">
                    <p class="text-blue-600 font-bold">98%</p>
                    <p class="text-xs text-gray-500">出勤率</p>
                </div>
            </div>
            <button class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white py-3 rounded-xl font-semibold">
                编辑个人信息
            </button>
        </div>

        <div class="glass-card p-4 mb-4">
            <h3 class="text-sm font-medium text-gray-700 mb-4 px-2">工作管理</h3>
            <div class="space-y-2">
                <div class="menu-item flex items-center justify-between px-4 py-3 bg-gray-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center mr-3">
                            <i class="fa fa-calendar text-purple-600"></i>
                        </div>
                        <span class="text-gray-700">我的项目</span>
                    </div>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                </div>
                <div class="menu-item flex items-center justify-between px-4 py-3 bg-gray-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center mr-3">
                            <i class="fa fa-check-square-o text-blue-600"></i>
                        </div>
                        <span class="text-gray-700">我的任务</span>
                    </div>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                </div>
                <div class="menu-item flex items-center justify-between px-4 py-3 bg-gray-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center mr-3">
                            <i class="fa fa-bar-chart text-green-600"></i>
                        </div>
                        <span class="text-gray-700">工时统计</span>
                    </div>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                </div>
            </div>
        </div>

        <div class="glass-card p-4 mb-4">
            <h3 class="text-sm font-medium text-gray-700 mb-4 px-2">系统设置</h3>
            <div class="space-y-2">
                <div class="menu-item flex items-center justify-between px-4 py-3 bg-gray-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-yellow-100 flex items-center justify-center mr-3">
                            <i class="fa fa-bell text-yellow-600"></i>
                        </div>
                        <span class="text-gray-700">通知设置</span>
                    </div>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                </div>
                <div class="menu-item flex items-center justify-between px-4 py-3 bg-gray-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center mr-3">
                            <i class="fa fa-lock text-red-600"></i>
                        </div>
                        <span class="text-gray-700">账号安全</span>
                    </div>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                </div>
                <div class="menu-item flex items-center justify-between px-4 py-3 bg-gray-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center mr-3">
                            <i class="fa fa-cog text-indigo-600"></i>
                        </div>
                        <span class="text-gray-700">系统设置</span>
                    </div>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                </div>
            </div>
        </div>

        <div class="glass-card p-4">
            <h3 class="text-sm font-medium text-gray-700 mb-4 px-2">关于</h3>
            <div class="space-y-2">
                <div class="menu-item flex items-center justify-between px-4 py-3 bg-gray-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center mr-3">
                            <i class="fa fa-info text-gray-600"></i>
                        </div>
                        <span class="text-gray-700">关于系统</span>
                    </div>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                </div>
                <div class="menu-item flex items-center justify-between px-4 py-3 bg-gray-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center mr-3">
                            <i class="fa fa-question-circle text-gray-600"></i>
                        </div>
                        <span class="text-gray-700">帮助中心</span>
                    </div>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                </div>
                <div class="menu-item flex items-center justify-between px-4 py-3 bg-gray-50 rounded-xl">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center mr-3">
                            <i class="fa fa-star text-gray-600"></i>
                        </div>
                        <span class="text-gray-700">意见反馈</span>
                    </div>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                </div>
            </div>
        </div>

        <div class="mt-6 text-center">
            <button class="w-full bg-red-500 text-white py-3 rounded-xl font-semibold">
                退出登录
            </button>
            <p class="text-white text-sm mt-4">版本 1.0.0</p>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-2 z-40">
        <div class="max-w-lg mx-auto flex justify-around">
            <a href="mobile-checkin.html" class="flex flex-col items-center text-gray-400">
                <i class="fa fa-map-marker text-xl mb-1"></i>
                <span class="text-xs">打卡</span>
            </a>
            <a href="mobile-records.html" class="flex flex-col items-center text-gray-400">
                <i class="fa fa-bar-chart text-xl mb-1"></i>
                <span class="text-xs">统计</span>
            </a>
            <a href="mobile-profile.html" class="flex flex-col items-center text-purple-600">
                <i class="fa fa-cog text-xl mb-1"></i>
                <span class="text-xs">我的</span>
            </a>
        </div>
    </nav>

    <script>
        function init() {
            // 初始化页面
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
