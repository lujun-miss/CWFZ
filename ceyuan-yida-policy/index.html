<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策源易答 - 政策智能匹配系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f1f5f9;
        }
        .mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            margin: 0 auto;
            background-color: #fff;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .content-frame {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
        }
        .bottom-nav {
            height: 65px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #64748b;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-item.active {
            color: #2563eb;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- 页面载入容器 -->
        <iframe id="mainFrame" name="mainFrame" src="home.html" class="content-frame"></iframe>

        <!-- 底部导航栏 -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchPage('home.html', this)">
                <i class="fa fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item" onclick="switchPage('match.html', this)">
                <i class="fa fa-bolt"></i>
                <span>智能匹配</span>
            </div>
            <div class="nav-item" onclick="switchPage('policy.html', this)">
                <i class="fa fa-search"></i>
                <span>政策检索</span>
            </div>
            <div class="nav-item" onclick="switchPage('me.html', this)">
                <i class="fa fa-user"></i>
                <span>我的</span>
            </div>
        </nav>
    </div>

    <script>
        function switchPage(url, el) {
            document.getElementById('mainFrame').src = url;
            
            // 更新导航状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            el.classList.add('active');
        }

        // 监听来自iframe的消息（用于页面跳转）
        window.addEventListener('message', function(event) {
            if (event.data.action === 'nav') {
                const target = event.data.target;
                const navItems = document.querySelectorAll('.nav-item');
                let targetEl;
                
                if (target === 'home.html') targetEl = navItems[0];
                if (target === 'match.html') targetEl = navItems[1];
                if (target === 'policy.html') targetEl = navItems[2];
                if (target === 'me.html') targetEl = navItems[3];
                
                if (targetEl) switchPage(target, targetEl);
            }
        });
    </script>
</body>
</html>
