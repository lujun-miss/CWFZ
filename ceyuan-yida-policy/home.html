<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .policy-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-10">
    <!-- 顶部 Header -->
    <header class="policy-gradient px-6 pt-10 pb-20 rounded-b-[40px] relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full -mr-10 -mt-10"></div>
        <div class="relative z-10">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-white/80 text-sm">欢迎回来，</h2>
                    <h1 class="text-white text-xl font-bold">某数智科技有限公司</h1>
                </div>
                <div class="relative">
                    <i class="fa fa-bell-o text-white text-xl"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-blue-600"></span>
                </div>
            </div>
            
            <!-- 搜索框 -->
            <div class="relative mb-6">
                <input type="text" placeholder="搜索政策、项目、指南..." class="w-full h-12 bg-white/20 backdrop-blur-md rounded-2xl px-12 text-white placeholder-white/60 focus:outline-none focus:bg-white/30 transition-all">
                <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-white/60"></i>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 p-1.5 rounded-lg">
                    <i class="fa fa-sliders text-white/60"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- 核心统计卡片 -->
    <div class="px-6 -mt-12 mb-8 relative z-20">
        <div class="bg-white rounded-3xl shadow-xl p-6 grid grid-cols-3 gap-4">
            <div class="text-center">
                <div class="text-2xl font-bold text-blue-600">24</div>
                <div class="text-[10px] text-slate-500 uppercase tracking-wider">匹配政策</div>
            </div>
            <div class="text-center border-x border-slate-100">
                <div class="text-2xl font-bold text-green-500">¥120w</div>
                <div class="text-[10px] text-slate-500 uppercase tracking-wider">预估奖补</div>
            </div>
            <div class="text-center">
                <div class="text-2xl font-bold text-orange-400">3</div>
                <div class="text-[10px] text-slate-500 uppercase tracking-wider">即将截止</div>
            </div>
        </div>
    </div>

    <!-- 快捷功能 -->
    <div class="px-6 mb-8">
        <div class="grid grid-cols-4 gap-4 text-center">
            <div class="flex flex-col items-center">
                <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 mb-2">
                    <i class="fa fa-bolt text-lg"></i>
                </div>
                <span class="text-xs font-medium">快速匹配</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-12 h-12 bg-green-50 rounded-2xl flex items-center justify-center text-green-600 mb-2">
                    <i class="fa fa-file-text text-lg"></i>
                </div>
                <span class="text-xs font-medium">申报指南</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-12 h-12 bg-orange-50 rounded-2xl flex items-center justify-center text-orange-600 mb-2">
                    <i class="fa fa-pie-chart text-lg"></i>
                </div>
                <span class="text-xs font-medium">竞争力分析</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-12 h-12 bg-purple-50 rounded-2xl flex items-center justify-center text-purple-600 mb-2">
                    <i class="fa fa-calendar-check-o text-lg"></i>
                </div>
                <span class="text-xs font-medium">年度计划</span>
            </div>
        </div>
    </div>

    <!-- 匹配推荐列表 -->
    <div class="px-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-slate-800">高匹配度政策</h3>
            <span class="text-xs text-blue-600 font-medium">查看更多</span>
        </div>
        
        <!-- 政策卡片 1 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-4 border border-slate-50">
            <div class="flex justify-between items-start mb-2">
                <span class="bg-blue-100 text-blue-600 text-[10px] px-2 py-0.5 rounded-full font-bold">匹配度 95%</span>
                <span class="text-[10px] text-slate-400">剩余 12 天</span>
            </div>
            <h4 class="font-bold text-slate-800 mb-2 leading-snug">2026年度省级专精特新“小巨人”企业认定申报指南</h4>
            <div class="flex items-center text-[11px] text-slate-500 mb-3">
                <i class="fa fa-map-marker mr-1"></i> 省工信厅
                <span class="mx-2">|</span>
                <i class="fa fa-money mr-1"></i> 最高 ¥50w
            </div>
            <div class="flex justify-between items-center pt-3 border-t border-slate-50">
                <div class="flex -space-x-2">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop" class="w-6 h-6 rounded-full border-2 border-white">
                    <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?w=100&h=100&fit=crop" class="w-6 h-6 rounded-full border-2 border-white">
                    <div class="w-6 h-6 rounded-full bg-slate-100 border-2 border-white flex items-center justify-center text-[8px] text-slate-500">+12</div>
                </div>
                <button class="bg-blue-600 text-white text-xs px-4 py-1.5 rounded-xl font-medium">立即诊断</button>
            </div>
        </div>

        <!-- 政策卡片 2 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-4 border border-slate-50">
            <div class="flex justify-between items-start mb-2">
                <span class="bg-green-100 text-green-600 text-[10px] px-2 py-0.5 rounded-full font-bold">匹配度 88%</span>
                <span class="text-[10px] text-slate-400">长期有效</span>
            </div>
            <h4 class="font-bold text-slate-800 mb-2 leading-snug">2026年上半年研发费用加计扣除政策申报说明</h4>
            <div class="flex items-center text-[11px] text-slate-500 mb-3">
                <i class="fa fa-map-marker mr-1"></i> 国家税务总局
                <span class="mx-2">|</span>
                <i class="fa fa-percent mr-1"></i> 100% 扣除
            </div>
            <div class="flex justify-between items-center pt-3 border-t border-slate-50">
                <div class="flex items-center text-[10px] text-slate-400">
                    已有 1,240 家企业完成申报
                </div>
                <button class="bg-blue-600 text-white text-xs px-4 py-1.5 rounded-xl font-medium">查看详情</button>
            </div>
        </div>
    </div>
</body>
</html>
