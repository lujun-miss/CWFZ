<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据字典管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- 左侧菜单 -->
        <div id="sidebar" class="w-64 bg-white shadow-lg flex-shrink-0">
            <!-- 侧边栏内容 -->
        </div>

        <!-- 右侧主内容区域 -->
        <div class="flex-1 flex flex-col">
            <!-- 顶部信息栏 -->
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6">
                <div class="flex items-center">
                    <h2 id="page-title" class="text-lg font-medium text-gray-800">数据字典管理</h2>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-bell-o text-xl"></i>
                    </button>
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center text-white text-sm">
                            <i class="fa fa-user"></i>
                        </div>
                        <span class="text-sm text-gray-600">管理员</span>
                    </div>
                </div>
            </header>

            <!-- 主内容区 -->
            <main class="flex-1 p-6 overflow-y-auto">
                <!-- 面包屑 -->
                <div class="mb-4 text-sm text-gray-500">
                    <span>系统设置</span> / <span class="text-gray-700">数据字典管理</span>
                </div>

                <!-- 操作栏 -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center space-x-4">
                        <select id="dictCategory" class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" onchange="loadDictionaryData()">
                            <option value="">全部类别</option>
                            <option value="expense_type">费用类型</option>
                            <option value="sub_expense_type">子费用类型</option>
                            <option value="asset_type">资产类型</option>
                            <option value="personnel_type">人员类型</option>
                            <option value="project_status">项目状态</option>
                        </select>
                        <div class="relative">
                            <input type="text" id="searchKeyword" placeholder="搜索字典项..." class="border border-gray-300 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary w-64">
                            <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>
                    <button onclick="openAddModal()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-600 flex items-center space-x-2">
                        <i class="fa fa-plus"></i>
                        <span>新增字典项</span>
                    </button>
                </div>

                <!-- 数据表格 -->
                <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">字典编码</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">字典名称</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">字典类别</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">上级字典</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">排序</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">备注</th>
                                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="dictTableBody" class="divide-y divide-gray-200">
                            <!-- 数据由 JavaScript 动态加载 -->
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <div class="flex items-center justify-between mt-4">
                    <span class="text-sm text-gray-500">共 <span id="totalCount">0</span> 条记录</span>
                    <div class="flex items-center space-x-2">
                        <button onclick="prevPage()" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50 disabled:opacity-50" id="prevBtn">
                            <i class="fa fa-chevron-left"></i>
                        </button>
                        <span class="text-sm text-gray-600">第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页</span>
                        <button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50 disabled:opacity-50" id="nextBtn">
                            <i class="fa fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 新增/编辑弹窗 -->
    <div id="dictModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl w-full max-w-lg mx-4 shadow-xl">
            <div class="flex items-center justify-between p-4 border-b">
                <h3 id="modalTitle" class="text-lg font-medium text-gray-800">新增字典项</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">字典编码 <span class="text-red-500">*</span></label>
                    <input type="text" id="dictCode" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="请输入字典编码">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">字典名称 <span class="text-red-500">*</span></label>
                    <input type="text" id="dictName" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="请输入字典名称">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">字典类别 <span class="text-red-500">*</span></label>
                    <select id="dictCategoryModal" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" onchange="loadParentOptions()">
                        <option value="">请选择类别</option>
                        <option value="expense_type">费用类型</option>
                        <option value="sub_expense_type">子费用类型</option>
                        <option value="asset_type">资产类型</option>
                        <option value="personnel_type">人员类型</option>
                        <option value="project_status">项目状态</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">上级字典</label>
                    <select id="parentDict" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="">无上级</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">排序</label>
                    <input type="number" id="dictSort" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="0" value="0">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                    <div class="flex items-center space-x-4">
                        <label class="flex items-center">
                            <input type="radio" name="dictStatus" value="1" checked class="w-4 h-4 text-primary">
                            <span class="ml-2 text-sm text-gray-600">启用</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="dictStatus" value="0" class="w-4 h-4 text-primary">
                            <span class="ml-2 text-sm text-gray-600">禁用</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                    <textarea id="dictRemark" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="请输入备注信息"></textarea>
                </div>
            </div>
            <div class="flex justify-end space-x-3 p-4 border-t bg-gray-50">
                <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">取消</button>
                <button onclick="saveDict()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-600">保存</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl w-full max-w-md mx-4 shadow-xl">
            <div class="p-6 text-center">
                <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa fa-exclamation-triangle text-red-500 text-xl"></i>
                </div>
                <h3 class="text-lg font-medium text-gray-800 mb-2">确认删除</h3>
                <p class="text-gray-500 text-sm mb-4">确定要删除该字典项吗？此操作不可撤销。</p>
                <div class="flex justify-center space-x-3">
                    <button onclick="closeDeleteModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">取消</button>
                    <button onclick="confirmDelete()" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">删除</button>
                </div>
            </div>
        </div>
    </div>

            { id: 52, code: 'patent', name: '专利', category: 'asset_type', parentCode: '', sort: 1, status: 1, remark: '发明、实用新型、外观设计专利' },
            { id: 53, code: 'software', name: '软件', category: 'asset_type', parentCode: '', sort: 2, status: 1, remark: '计算机软件著作权' },
            { id: 54, code: 'non_patent_tech', name: '非专利技术', category: 'asset_type', parentCode: '', sort: 3, status: 1, remark: '专有技术、技术秘密等' },
            { id: 55, code: 'trademark', name: '商标权', category: 'asset_type', parentCode: '', sort: 4, status: 0, remark: '商标权不计入加计扣除' },
            { id: 56, code: 'copyright', name: '著作权', category: 'asset_type', parentCode: '', sort: 5, status: 0, remark: '著作权不计入加计扣除' },
            { id: 57, code: 'land_use_right', name: '土地使用权', category: 'asset_type', parentCode: '', sort: 6, status: 0, remark: '土地使用权不计入加计扣除' }
        ];

        let currentPage = 1;
        let pageSize = 10;
        let totalRecords = 0;
        let currentEditId = null;
        let currentDeleteId = null;

        const CATEGORY_NAMES = {
            'expense_type': '费用类型',
            'sub_expense_type': '子费用类型',
            'asset_type': '资产类型',
            'personnel_type': '人员类型',
            'project_status': '项目状态'
        };

        function loadDictionaryData() {
            const category = document.getElementById('dictCategory').value;
            const keyword = document.getElementById('searchKeyword').value.toLowerCase();

            let filteredData = dictionaryData;

            if (category) {
                filteredData = filteredData.filter(item => item.category === category);
            }

            if (keyword) {
                filteredData = filteredData.filter(item =>
                    item.code.toLowerCase().includes(keyword) ||
                    item.name.toLowerCase().includes(keyword) ||
                    item.remark.toLowerCase().includes(keyword)
                );
            }

            totalRecords = filteredData.length;
            const totalPages = Math.ceil(totalRecords / pageSize);
            document.getElementById('totalPages').textContent = totalPages || 1;

            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const pageData = filteredData.slice(startIndex, endIndex);

            renderTable(pageData);
            updatePagination();
        }

        function renderTable(data) {
            const tbody = document.getElementById('dictTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="px-4 py-8 text-center text-gray-500">
                            <i class="fa fa-inbox text-4xl mb-2"></i>
                            <p>暂无数据</p>
                        </td>
                    </tr>
                `;
                return;
            }

            data.forEach(item => {
                const parentItem = dictionaryData.find(d => d.code === item.parentCode);
                const parentName = parentItem ? parentItem.name : '-';

                const row = `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 text-sm text-gray-800 font-mono">${item.code}</td>
                        <td class="px-4 py-3 text-sm text-gray-800">${item.name}</td>
                        <td class="px-4 py-3 text-sm text-gray-600">${CATEGORY_NAMES[item.category] || item.category}</td>
                        <td class="px-4 py-3 text-sm text-gray-600">${parentName}</td>
                        <td class="px-4 py-3 text-sm text-gray-600">${item.sort}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 text-xs rounded-full ${item.status === 1 ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-600'}">
                                ${item.status === 1 ? '启用' : '禁用'}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-500 max-w-xs truncate">${item.remark || '-'}</td>
                        <td class="px-4 py-3 text-center">
                            <button onclick="editDict(${item.id})" class="text-blue-500 hover:text-blue-700 mr-3">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button onclick="deleteDict(${item.id})" class="text-red-500 hover:text-red-700">
                                <i class="fa fa-trash-o"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            document.getElementById('totalCount').textContent = totalRecords;
        }

        function updatePagination() {
            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= Math.ceil(totalRecords / pageSize);
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadDictionaryData();
            }
        }

        function nextPage() {
            if (currentPage < Math.ceil(totalRecords / pageSize)) {
                currentPage++;
                loadDictionaryData();
            }
        }

        function openAddModal() {
            currentEditId = null;
            document.getElementById('modalTitle').textContent = '新增字典项';
            document.getElementById('dictCode').value = '';
            document.getElementById('dictCode').disabled = false;
            document.getElementById('dictName').value = '';
            document.getElementById('dictCategoryModal').value = '';
            document.getElementById('parentDict').innerHTML = '<option value="">无上级</option>';
            document.getElementById('dictSort').value = '0';
            document.querySelector('input[name="dictStatus"][value="1"]').checked = true;
            document.getElementById('dictRemark').value = '';
            document.getElementById('dictModal').classList.remove('hidden');
        }

        function editDict(id) {
            currentEditId = id;
            const item = dictionaryData.find(d => d.id === id);
            if (!item) return;

            document.getElementById('modalTitle').textContent = '编辑字典项';
            document.getElementById('dictCode').value = item.code;
            document.getElementById('dictCode').disabled = true;
            document.getElementById('dictName').value = item.name;
            document.getElementById('dictCategoryModal').value = item.category;
            loadParentOptions(item.parentCode);
            document.getElementById('dictSort').value = item.sort;
            document.querySelector(`input[name="dictStatus"][value="${item.status}"]`).checked = true;
            document.getElementById('dictRemark').value = item.remark || '';
            document.getElementById('dictModal').classList.remove('hidden');
        }

        function loadParentOptions(selectedParent) {
            const category = document.getElementById('dictCategoryModal').value;
            const parentSelect = document.getElementById('parentDict');
            parentSelect.innerHTML = '<option value="">无上级</option>';

            if (!category || category === 'expense_type') {
                return;
            }

            const parentItems = dictionaryData.filter(d => d.category === 'expense_type');
            parentItems.forEach(parent => {
                const option = document.createElement('option');
                option.value = parent.code;
                option.textContent = parent.name;
                if (parent.code === selectedParent) {
                    option.selected = true;
                }
                parentSelect.appendChild(option);
            });
        }

        function closeModal() {
            document.getElementById('dictModal').classList.add('hidden');
        }

        function saveDict() {
            const code = document.getElementById('dictCode').value.trim();
            const name = document.getElementById('dictName').value.trim();
            const category = document.getElementById('dictCategoryModal').value;
            const parentCode = document.getElementById('parentDict').value;
            const sort = parseInt(document.getElementById('dictSort').value) || 0;
            const status = document.querySelector('input[name="dictStatus"]:checked').value;
            const remark = document.getElementById('dictRemark').value.trim();

            if (!code || !name || !category) {
                alert('请填写必填项');
                return;
            }

            if (currentEditId) {
                const index = dictionaryData.findIndex(d => d.id === currentEditId);
                if (index !== -1) {
                    dictionaryData[index] = {
                        ...dictionaryData[index],
                        name,
                        category,
                        parentCode,
                        sort,
                        status: parseInt(status),
                        remark
                    };
                }
            } else {
                const newId = Math.max(...dictionaryData.map(d => d.id)) + 1;
                dictionaryData.push({
                    id: newId,
                    code,
                    name,
                    category,
                    parentCode,
                    sort,
                    status: parseInt(status),
                    remark
                });
            }

            closeModal();
            loadDictionaryData();
            alert('保存成功');
        }

        function deleteDict(id) {
            currentDeleteId = id;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            currentDeleteId = null;
        }

        function confirmDelete() {
            if (currentDeleteId) {
                dictionaryData = dictionaryData.filter(d => d.id !== currentDeleteId);
                loadDictionaryData();
            }
            closeDeleteModal();
            alert('删除成功');
        }

        document.getElementById('searchKeyword').addEventListener('input', debounce(loadDictionaryData, 300));

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        loadDictionaryData();
    </script>
</body>
</html>
