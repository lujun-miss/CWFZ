        }

        document.addEventListener('change', function(event) {
            if (event.target.id === 'editType') {
                renderEditCategories(event.target.value, categoryMap[event.target.value][0].id);
                togglePolicyFields();
            }
        });

        function togglePolicyFields() {
            const isPolicy = document.getElementById('editType').value === 'policy';
            document.getElementById('policyFields').classList.toggle('hidden', !isPolicy);
            document.getElementById('editSummaryField').classList.toggle('hidden', isPolicy);
            document.getElementById('editContentField').classList.toggle('hidden', isPolicy);
            document.getElementById('genericAttachmentField').classList.toggle('hidden', isPolicy);
            document.getElementById('editContentLabel').textContent = isPolicy ? '核心条款摘要' : '正文内容';
        }

        function closeEditorDrawer() {
            document.getElementById('editorDrawer').classList.add('hidden');
        }

        function openPreviewDrawer() {
            const items = contentData.filter(item => item.type === currentType && item.status === 'published');
            const active = contentData.find(item => item.id === activeContentId) || items[0];
            document.getElementById('previewDrawer').classList.remove('hidden');
            
            if (currentType === 'operation') {
                const item = contentData.find(data => data.id === activeContentId);
                if (item) {
                    document.getElementById('previewList').innerHTML = generateToc(item.content);
                    // 滚动到第一个H2标题（如果有）
                    const firstH2 = item.content.match(/<h2 id="([^"]+)">/);
                    if (firstH2 && firstH2[1]) {
                        // 确保先渲染内容再尝试滚动
                        previewContent(activeContentId, firstH2[1]);
                    } else {
                        previewContent(activeContentId);
                    }
                }
            } else {
                document.getElementById('previewList').innerHTML = items.map(item => `
                    <button onclick="previewContent(${item.id})" class="w-full text-left p-4 rounded-2xl border ${item.id === active?.id ? 'bg-white border-blue-200 shadow-sm' : 'border-transparent hover:bg-white'}">
                        <div class="text-sm font-black ${item.id === active?.id ? 'text-primary' : 'text-slate-800'}">${item.title}</div>
                        <div class="text-xs text-slate-500 mt-1">${item.summary}</div>
                    </button>
                `).join('');
                previewContent(active?.id);
            }
        }

        function previewContent(id) {
            const item = contentData.find(data => data.id === id);
            if (!item) return;
            document.getElementById('previewContent').innerHTML = `
                <div class="text-xs text-slate-400 mb-1">${item.type === 'operation' ? '操作说明书' : '政策法规库'}</div>
                <h3 class="text-2xl font-black text-slate-900 mb-3">${item.title}</h3>
                ${item.type === 'policy' ? `<p class="text-sm text-slate-500 mb-5">${item.summary}</p>` : ''}
                ${item.type === 'policy' ? `
                <div class="grid grid-cols-2 gap-3 mb-5 text-xs">
                    <div class="p-3 rounded-xl bg-slate-50 border"><span class="text-slate-400">发文机关：</span>${item.agency || '-'}</div>
                    <div class="p-3 rounded-xl bg-slate-50 border"><span class="text-slate-400">文号：</span>${item.docNo || '-'}</div>
                    <div class="p-3 rounded-xl bg-slate-50 border col-span-2"><span class="text-slate-400">政策原文：</span>${item.attachments?.length || 0} 个附件，可在线预览或下载</div>
                </div>
                <div class="mb-5 space-y-2">${renderAttachmentCards(item.attachments)}</div>
                ` : ''}
                <div class="p-5 rounded-2xl border bg-white leading-relaxed">${item.content}</div>
            `;
        }

        function generateToc(contentHtml) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(contentHtml, 'text/html');
            const headings = doc.querySelectorAll('h2[id], h3[id]');
            let tocHtml = '<div class="p-4 space-y-2">\n';
            headings.forEach(heading => {
                const level = heading.tagName.toLowerCase();
                const id = heading.id;
                const text = heading.textContent;
                if (level === 'h2') {
                    tocHtml += `<button onclick="scrollToSection('${id}')" class="w-full text-left p-2 rounded-lg hover:bg-slate-100 font-bold text-slate-700"><i class="fa fa-angle-right mr-2"></i>${text}</button>\n`;
                } else if (level === 'h3') {
                    tocHtml += `<button onclick="scrollToSection('${id}')" class="w-full text-left pl-6 pr-2 py-1 rounded-lg hover:bg-slate-100 text-slate-600 text-sm">${text}</button>\n`;
                }
            });
            tocHtml += '</div>';
            return tocHtml;
        }

        function scrollToSection(sectionId) {
            const previewContentEl = document.getElementById('previewContent');
            const targetElement = previewContentEl.querySelector(`#${sectionId}`);
            if (targetElement) {
                previewContentEl.scrollTo({
                    top: targetElement.offsetTop - 20, // Add some padding
                    behavior: 'smooth'
                });
            }
        }

        function previewContent(id, scrollToId = null) {
            const item = contentData.find(data => data.id === id);
            if (!item) return;
            const previewContentEl = document.getElementById('previewContent');
            previewContentEl.innerHTML = `
                <div class="text-xs text-slate-400 mb-1">${item.type === 'operation' ? '操作说明书' : '政策法规库'}</div>
                <h3 class="text-2xl font-black text-slate-900 mb-3">${item.title}</h3>
                ${item.type === 'policy' ? `
                <div class="grid grid-cols-2 gap-3 mb-5 text-xs">
                    <div class="p-3 rounded-xl bg-slate-50 border"><span class="text-slate-400">知识库类型：</span>政策法规库</div>
                    <div class="p-3 rounded-xl bg-slate-50 border"><span class="text-slate-400">分类：</span>${getCategoryNameById(item.category)}</div>
                    <div class="p-3 rounded-xl bg-slate-50 border"><span class="text-slate-400">状态：</span>${statusText(item.status)}</div>
                    <div class="p-3 rounded-xl bg-slate-50 border"><span class="text-slate-400">发文机关：</span>${item.agency || '-'}</div>
                    <div class="p-3 rounded-xl bg-slate-50 border"><span class="text-slate-400">文号：</span>${item.docNo || '-'}</div>
                    <div class="p-3 rounded-xl bg-slate-50 border"><span class="text-slate-400">发布日期：</span>${item.publishDate || '-'}</div>
                    <div class="p-3 rounded-xl bg-slate-50 border"><span class="text-slate-400">生效日期：</span>${item.effectiveDate || '-'}</div>
                    <div class="p-3 rounded-xl bg-slate-50 border"><span class="text-slate-400">来源链接：</span>${item.sourceUrl ? '已填写' : '-'}</div>
                </div>
                <div class="mb-5 space-y-2">${renderAttachmentCards(item.attachments)}</div>
                ` : ''}
                ${item.type === 'policy' ? '' : `<div class="p-5 rounded-2xl border bg-white leading-relaxed">${item.content}</div>`}
            `;

            if (scrollToId) {
                // Ensure content is rendered before attempting to scroll
                // Using a small timeout to ensure DOM update
                setTimeout(() => scrollToSection(scrollToId), 100);
            }
        }

        function closePreviewDrawer() {
            document.getElementById('previewDrawer').classList.add('hidden');
        }

        function formatDoc(command, value) {
            document.execCommand(command, false, value);
            document.getElementById('editContent').focus();
        }

        function insertImage() {
            const url = prompt('请输入图片URL:');
            if (url) {
                document.execCommand('insertImage', false, url);
                document.getElementById('editContent').focus();
            }
        }

        function insertVideo() {
            // 检查是否已经有视频对话框，如果有则删除
            let dialog = document.getElementById('videoInsertDialog');
            if (dialog) {
                dialog.remove();
            }

            // 创建视频插入对话框
            dialog = document.createElement('div');
            dialog.id = 'videoInsertDialog';
            dialog.className = 'fixed inset-0 z-[60] flex items-center justify-center';
            dialog.innerHTML = `
                <div class="absolute inset-0 bg-black/50" onclick="closeVideoDialog()"></div>
                <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4">
                    <div class="px-6 py-4 border-b flex items-center justify-between">
                        <h3 class="text-lg font-bold text-slate-800">插入视频</h3>
                        <button onclick="closeVideoDialog()" class="w-8 h-8 rounded-full hover:bg-slate-100 text-slate-500">
                            <i class="fa fa-times"></i>
                        </button>
                    </div>
                    <div class="p-6 space-y-4">
                        <!-- 视频URL输入 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">视频链接 (支持MP4、WebM、YouTube、Bilibili等)</label>
                            <div class="flex gap-2">
                                <input type="text" id="videoUrlInput" class="flex-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="例如: https://example.com/video.mp4 或 YouTube链接">
                                <button onclick="insertVideoFromUrl()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 text-sm">插入</button>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-3 text-sm text-slate-500">
                            <div class="flex-1 h-px bg-slate-200"></div>
                            <span>或</span>
                            <div class="flex-1 h-px bg-slate-200"></div>
                        </div>
                        
                        <!-- 视频文件上传 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">上传视频文件</label>
                            <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-blue-400 transition-colors cursor-pointer" onclick="document.getElementById('videoFileInput').click()">
                                <input type="file" id="videoFileInput" accept="video/*" class="hidden" onchange="handleVideoUpload(this)">
                                <i class="fa fa-upload text-4xl text-slate-400 mb-3"></i>
                                <p class="text-sm text-slate-600 font-medium">点击选择视频文件或拖拽到此处</p>
                                <p class="text-xs text-slate-400 mt-1">支持 MP4、WebM、OGG 格式</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(dialog);
        }

        function closeVideoDialog() {
            const dialog = document.getElementById('videoInsertDialog');
            if (dialog) {
                dialog.remove();
            }
        }

        function insertVideoFromUrl() {
            const url = document.getElementById('videoUrlInput').value.trim();
            if (!url) {
                alert('请输入视频链接');
                return;
            }

            let videoHtml = '';
            
            // 检查是否是 YouTube 链接
            const youtubeMatch = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            if (youtubeMatch) {
                const videoId = youtubeMatch[1];
                videoHtml = `<div class="relative" style="padding-bottom: 56.25%; height: 0; overflow: hidden; margin: 1rem 0;">
                    <iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe>
                </div>`;
            }
            // 检查是否是 Bilibili 链接
            else if (url.includes('bilibili.com') || url.includes('b23.tv')) {
                const bvMatch = url.match(/BV[a-zA-Z0-9]+/);
                if (bvMatch) {
                    videoHtml = `<div class="relative" style="padding-bottom: 56.25%; height: 0; overflow: hidden; margin: 1rem 0;">
                        <iframe src="https://player.bilibili.com/player.html?bvid=${bvMatch[0]}&high_quality=1" frameborder="0" allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe>
                    </div>`;
                }
            }
            // 普通视频文件
            else {
                videoHtml = `<div style="margin: 1rem 0;">
                    <video controls style="max-width: 100%; height: auto; border-radius: 8px;">
                        <source src="${url}" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                </div>`;
            }

            // 插入到编辑器
            const editor = document.getElementById('editContent');
            editor.focus();
            document.execCommand('insertHTML', false, videoHtml);
            closeVideoDialog();
        }

        function handleVideoUpload(input) {
            const file = input.files[0];
            if (!file) return;

            // 检查文件类型
            if (!file.type.startsWith('video/')) {
                alert('请选择视频文件');
                return;
            }

            // 使用 FileReader 读取文件
            const reader = new FileReader();
            reader.onload = function(e) {
                const videoUrl = e.target.result;
                const videoHtml = `<div style="margin: 1rem 0;">
                    <video controls style="max-width: 100%; height: auto; border-radius: 8px;">
                        <source src="${videoUrl}" type="${file.type}">
                        您的浏览器不支持视频播放
                    </video>
                </div>`;

                // 插入到编辑器
                const editor = document.getElementById('editContent');
                editor.focus();
                document.execCommand('insertHTML', false, videoHtml);
                closeVideoDialog();
            };
            reader.readAsDataURL(file);
        }

        function saveContent() {
            const content = document.getElementById('editContent').innerHTML;
            alert('原型演示：内容已保存为草稿。实际保存内容为：\n' + content);
            // In a real application, you would send 'content' to the backend
            closeEditorDrawer();
        }

        function publishContent() {
            alert('原型演示：内容已发布到前台知识库。');
            closeEditorDrawer();
        }

        function deleteContent(id) {
            if (confirm(`确定要删除ID为 ${id} 的内容吗？`)) {
                alert(`原型演示：内容ID ${id} 已删除。`);
                // In a real application, you would remove the item from contentData
                // and re-render the list.
                // For now, just re-render to simulate deletion.
                renderAll();
            }
        }

        function openCategoryDialog() {
            alert('原型演示：这里可新增分类、设置排序、绑定前台展示范围。');
        }

        applyEmbeddedMode();
        renderAll();
    </script>
</body>
</html>
