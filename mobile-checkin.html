<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>移动打卡 - 研发费管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        accent: '#6366f1',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        info: '#3b82f6',
                        light: '#f3f4f6',
                        dark: '#1f2937'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .checkin-btn {
            transition: all 0.3s ease;
        }
        .checkin-btn:active {
            transform: scale(0.95);
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="flex items-center justify-between px-4 py-3">
            <button class="text-gray-600" onclick="goBack()">
                <i class="fa fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-lg font-medium text-gray-800">移动打卡</h1>
            <div class="w-6"></div> <!-- 占位元素 -->
        </div>
    </header>
    
    <!-- 主内容 -->
    <main class="px-4 py-6">
        <!-- 打卡状态卡片 -->
        <div class="bg-white card p-6 mb-6">
            <div class="text-center">
                <h2 class="text-xl font-bold text-gray-800 mb-2">今日打卡</h2>
                <p class="text-gray-500 mb-4" id="currentDate">2026年4月20日</p>
                <div class="flex justify-center items-center mb-6">
                    <div class="w-32 h-32 rounded-full bg-blue-100 flex items-center justify-center">
                        <span class="text-4xl font-bold text-primary" id="currentTime">12:30</span>
                    </div>
                </div>
                
                <!-- 打卡按钮 -->
                <button id="checkinBtn" class="checkin-btn bg-primary text-white w-full py-4 rounded-lg font-medium text-lg flex items-center justify-center" onclick="checkin()">
                    <i class="fa fa-clock-o mr-2"></i>
                    <span>开始打卡</span>
                </button>
            </div>
        </div>
        
        <!-- 打卡记录 -->
        <div class="bg-white card p-4 mb-6">
            <h3 class="text-lg font-medium text-gray-800 mb-4">今日记录</h3>
            <div class="space-y-4">
                <div class="flex justify-between items-center pb-3 border-b border-gray-100">
                    <div>
                        <p class="text-gray-800 font-medium">上班打卡</p>
                        <p class="text-gray-500 text-sm">09:00</p>
                    </div>
                    <span class="text-green-600 text-sm">
                        <i class="fa fa-check-circle mr-1"></i>已打卡
                    </span>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-800 font-medium">下班打卡</p>
                        <p class="text-gray-500 text-sm">未打卡</p>
                    </div>
                    <span class="text-gray-400 text-sm">
                        <i class="fa fa-clock-o mr-1"></i>待打卡
                    </span>
                </div>
            </div>
        </div>
        
        <!-- 最近打卡记录 -->
        <div class="bg-white card p-4">
            <h3 class="text-lg font-medium text-gray-800 mb-4">最近记录</h3>
            <div class="space-y-4">
                <div class="flex justify-between items-center pb-3 border-b border-gray-100">
                    <div>
                        <p class="text-gray-800 font-medium">2026-04-19</p>
                        <p class="text-gray-500 text-sm">上班: 09:00 | 下班: 18:00</p>
                    </div>
                    <span class="text-green-600 text-sm">
                        <i class="fa fa-check-circle"></i>
                    </span>
                </div>
                <div class="flex justify-between items-center pb-3 border-b border-gray-100">
                    <div>
                        <p class="text-gray-800 font-medium">2026-04-18</p>
                        <p class="text-gray-500 text-sm">上班: 09:05 | 下班: 18:00</p>
                    </div>
                    <span class="text-green-600 text-sm">
                        <i class="fa fa-check-circle"></i>
                    </span>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-800 font-medium">2026-04-17</p>
                        <p class="text-gray-500 text-sm">上班: 09:00 | 下班: 18:05</p>
                    </div>
                    <span class="text-green-600 text-sm">
                        <i class="fa fa-check-circle"></i>
                    </span>
                </div>
            </div>
        </div>
    </main>
    
    <!-- 底部导航 -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white shadow-lg">
        <div class="flex justify-around py-3">
            <a href="mobile-records.html" class="flex flex-col items-center text-gray-500">
                <i class="fa fa-list text-lg mb-1"></i>
                <span class="text-xs">记录</span>
            </a>
            <a href="mobile-checkin.html" class="flex flex-col items-center text-primary">
                <i class="fa fa-clock-o text-lg mb-1"></i>
                <span class="text-xs">打卡</span>
            </a>
            <a href="mobile-profile.html" class="flex flex-col items-center text-gray-500">
                <i class="fa fa-user text-lg mb-1"></i>
                <span class="text-xs">我的</span>
            </a>
        </div>
    </footer>
    
    <script>
        // 更新当前日期和时间
        function updateDateTime() {
            const now = new Date();
            
            // 更新日期
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', options);
            
            // 更新时间
            const timeOptions = { hour: '2-digit', minute: '2-digit' };
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN', timeOptions);
        }
        
        // 初始化
        function init() {
            updateDateTime();
            setInterval(updateDateTime, 60000); // 每分钟更新一次
        }
        
        // 打卡功能
        function checkin() {
            const checkinBtn = document.getElementById('checkinBtn');
            const now = new Date();
            const hour = now.getHours();
            
            if (hour < 12) {
                // 上班打卡
                alert('上班打卡成功！时间：' + now.toLocaleTimeString('zh-CN'));
                checkinBtn.textContent = '开始打卡';
            } else {
                // 下班打卡
                alert('下班打卡成功！时间：' + now.toLocaleTimeString('zh-CN'));
                checkinBtn.textContent = '开始打卡';
            }
        }
        
        // 返回上一页
        function goBack() {
            window.history.back();
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
