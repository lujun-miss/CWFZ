<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建领料单 - 研知π</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        accent: '#6366f1',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        info: '#3b82f6',
                        light: '#f3f4f6',
                        dark: '#1f2937'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-item-active {
                @apply bg-primary text-white;
            }
            .nav-item-hover {
                @apply hover:bg-blue-100 transition-colors duration-200;
            }
        }
    </style>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .btn-primary {
            @apply bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-600 transition-colors;
        }
        .btn-secondary {
            @apply bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition-colors;
        }
        .btn-danger {
            @apply bg-danger text-white px-4 py-2 rounded-md hover:bg-red-600 transition-colors;
        }
        /* Iframe 适配 */
        .parent-iframe .left-sidebar,
        .parent-iframe .page-header,
        .parent-iframe header {
            display: none !important;
        }
        .parent-iframe body {
            padding: 0 !important;
            background-color: transparent !important;
        }
        .parent-iframe .bg-white.rounded-lg.shadow-md {
            box-shadow: none !important;
            border-radius: 0 !important;
        }
    </style>
</head>
<body class="bg-gray-50 p-6">
    <div class="bg-white rounded-lg shadow-md p-6">
        <!-- 页面标题 -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold text-gray-800">新建领料单</h2>
            <div class="flex space-x-2">
                <button class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition-colors" onclick="goBack()">
                    <i class="fa fa-arrow-left mr-1"></i>返回
                </button>
                <button class="bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-600 transition-colors" onclick="saveRequisition()">
                    <i class="fa fa-save mr-1"></i>保存
                </button>
                <button class="bg-secondary text-white px-4 py-2 rounded-md hover:bg-green-600 transition-colors" onclick="submitRequisition()">
                    <i class="fa fa-paper-plane mr-1"></i>提交
                </button>
            </div>
        </div>

        <!-- 领料单基本信息 -->
        <div class="bg-gray-50 rounded-lg p-6 mb-6">
            <h3 class="text-lg font-medium text-gray-800 mb-4">领料单信息</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">领料单号</label>
                    <input type="text" class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-100" value="LLD-2026-0427-001" readonly>
                    <p class="text-xs text-gray-500 mt-1">
                        <i class="fa fa-info-circle"></i> 
                        编码规则：LLD-年份-日期-流水号<br>
                        示例：LLD-2026-0427-001（LLD=领料单，2026=年份，0427=4月27日，001=当日第1单）
                    </p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">领料日期 <span class="text-red-500">*</span></label>
                    <input type="date" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">申请人 <span class="text-red-500">*</span></label>
                    <select class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="">请选择申请人</option>
                        <option value="1">张三</option>
                        <option value="2">李四</option>
                        <option value="3">王五</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">项目名称 <span class="text-red-500">*</span></label>
                    <select class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="">请选择项目</option>
                        <option value="proj1">智能传感器研发</option>
                        <option value="proj2">工业机器人控制系统</option>
                        <option value="proj3">新能源材料研究</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">使用部门</label>
                    <select class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="">请选择部门</option>
                        <option value="rd">研发部</option>
                        <option value="prod">生产部</option>
                        <option value="quality">质量部</option>
                    </select>
                </div>
            </div>
            <div class="mt-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">备注说明</label>
                <textarea class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" rows="2" placeholder="请输入备注信息"></textarea>
            </div>
        </div>

        <!-- 领料明细 -->
        <div class="bg-gray-50 rounded-lg p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium text-gray-800">领料明细</h3>
                <button class="bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-600 transition-colors" onclick="addMaterialRow()">
                    <i class="fa fa-plus mr-1"></i>添加物料
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">物料编码</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">物料名称</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">规格型号</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">单位</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">领料数量 <span class="text-red-500">*</span></th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">单价(元)</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">金额(元)</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="materialTableBody">
                        <tr>
                            <td class="px-4 py-3">
                                <input type="text" class="w-full border border-gray-300 rounded px-2 py-1 text-sm bg-gray-100" readonly placeholder="物料编码" id="code-0">
                            </td>
                            <td class="px-4 py-3">
                                <select class="w-full border border-gray-300 rounded px-2 py-1 text-sm" onchange="selectMaterial(this, 0)">
                                    <option value="">请选择物料</option>
                                    <option value="m001" data-code="BM001" data-name="传感器芯片" data-spec="SMD-0805" data-unit="个" data-price="120">传感器芯片</option>
                                    <option value="m002" data-code="BM002" data-name="电阻器" data-spec="10kΩ" data-unit="个" data-price="85">电阻器</option>
                                    <option value="m003" data-code="BM003" data-name="电容器" data-spec="10μF" data-unit="个" data-price="230">电容器</option>
                                    <option value="m004" data-code="BM004" data-name="焊锡丝" data-spec="0.8mm" data-unit="卷" data-price="15">焊锡丝</option>
                                </select>
                            </td>
                            <td class="px-4 py-3">
                                <input type="text" class="w-full border border-gray-300 rounded px-2 py-1 text-sm bg-gray-100" readonly placeholder="规格型号" id="spec-0">
                            </td>
                            <td class="px-4 py-3">
                                <input type="text" class="w-full border border-gray-300 rounded px-2 py-1 text-sm bg-gray-100" readonly placeholder="单位" id="unit-0">
                            </td>
                            <td class="px-4 py-3">
                                <input type="number" class="w-full border border-gray-300 rounded px-2 py-1 text-sm" placeholder="0" min="0" onchange="calculateAmount(this)">
                            </td>
                            <td class="px-4 py-3">
                                <input type="number" class="w-full border border-gray-300 rounded px-2 py-1 text-sm bg-gray-100" readonly placeholder="0.00" id="price-0">
                            </td>
                            <td class="px-4 py-3">
                                <input type="number" class="w-full border border-gray-300 rounded px-2 py-1 text-sm bg-gray-100" readonly placeholder="0.00" id="amount-0">
                            </td>
                            <td class="px-4 py-3">
                                <button class="text-danger hover:text-red-700" onclick="removeMaterialRow(this)">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 合计信息 -->
        <div class="bg-gray-50 rounded-lg p-6">
            <div class="flex justify-end">
                <div class="w-64">
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">物料种类：</span>
                        <span class="font-medium" id="materialCount">0</span>
                    </div>
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">总数量：</span>
                        <span class="font-medium" id="totalQuantity">0</span>
                    </div>
                    <div class="flex justify-between text-lg">
                        <span class="text-gray-800 font-medium">总金额：</span>
                        <span class="font-bold text-primary" id="totalAmount">¥0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 检测是否在 iframe 中
        if (window.self !== window.parent) {
            document.body.classList.add('parent-iframe');
        }

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // 如果没有历史记录，根据是否在 iframe 中决定跳转目标
                if (window.self !== window.parent) {
                    window.location.href = 'project-material-content.html';
                } else {
                    window.location.href = 'project-material.html';
                }
            }
        }

        function saveRequisition() {
            alert('领料单已保存！');
        }

        function submitRequisition() {
            alert('领料单已提交！');
        }

        function addMaterialRow() {
            const tableBody = document.getElementById('materialTableBody');
            const rowCount = tableBody.querySelectorAll('tr').length;
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td class="px-4 py-3">
                    <input type="text" class="w-full border border-gray-300 rounded px-2 py-1 text-sm bg-gray-100" readonly placeholder="物料编码" id="code-${rowCount}">
                </td>
                <td class="px-4 py-3">
                    <select class="w-full border border-gray-300 rounded px-2 py-1 text-sm" onchange="selectMaterial(this, ${rowCount})">
                        <option value="">请选择物料</option>
                        <option value="m001" data-code="BM001" data-name="传感器芯片" data-spec="SMD-0805" data-unit="个" data-price="120">传感器芯片</option>
                        <option value="m002" data-code="BM002" data-name="电阻器" data-spec="10kΩ" data-unit="个" data-price="85">电阻器</option>
                        <option value="m003" data-code="BM003" data-name="电容器" data-spec="10μF" data-unit="个" data-price="230">电容器</option>
                        <option value="m004" data-code="BM004" data-name="焊锡丝" data-spec="0.8mm" data-unit="卷" data-price="15">焊锡丝</option>
                    </select>
                </td>
                <td class="px-4 py-3">
                    <input type="text" class="w-full border border-gray-300 rounded px-2 py-1 text-sm bg-gray-100" readonly placeholder="规格型号" id="spec-${rowCount}">
                </td>
                <td class="px-4 py-3">
                    <input type="text" class="w-full border border-gray-300 rounded px-2 py-1 text-sm bg-gray-100" readonly placeholder="单位" id="unit-${rowCount}">
                </td>
                <td class="px-4 py-3">
                    <input type="number" class="w-full border border-gray-300 rounded px-2 py-1 text-sm" placeholder="0" min="0" onchange="calculateAmount(this)">
                </td>
                <td class="px-4 py-3">
                    <input type="number" class="w-full border border-gray-300 rounded px-2 py-1 text-sm bg-gray-100" readonly placeholder="0.00" id="price-${rowCount}">
                </td>
                <td class="px-4 py-3">
                    <input type="number" class="w-full border border-gray-300 rounded px-2 py-1 text-sm bg-gray-100" readonly placeholder="0.00" id="amount-${rowCount}">
                </td>
                <td class="px-4 py-3">
                    <button class="text-danger hover:text-red-700" onclick="removeMaterialRow(this)">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            `;
            tableBody.appendChild(newRow);
            updateTotals();
        }

        function removeMaterialRow(button) {
            const row = button.parentElement.parentElement;
            row.remove();
            updateTotals();
        }

        function selectMaterial(select, rowIndex) {
            const option = select.options[select.selectedIndex];
            const code = option.getAttribute('data-code');
            const spec = option.getAttribute('data-spec');
            const unit = option.getAttribute('data-unit');
            const price = option.getAttribute('data-price');
            
            const row = select.parentElement.parentElement;
            
            row.querySelector('td:nth-child(1) input').value = code || '';
            row.querySelector('td:nth-child(3) input').value = spec || '';
            row.querySelector('td:nth-child(4) input').value = unit || '';
            row.querySelector('td:nth-child(6) input').value = price || '';
            
            if (price) {
                calculateAmount(row.querySelector('td:nth-child(6) input'));
            } else {
                row.querySelector('td:nth-child(7) input').value = '';
                updateTotals();
            }
        }

        function calculateAmount(input) {
            const row = input.parentElement.parentElement;
            const quantity = parseFloat(row.querySelector('td:nth-child(5) input').value) || 0;
            const price = parseFloat(row.querySelector('td:nth-child(6) input').value) || 0;
            const amount = quantity * price;
            row.querySelector('td:nth-child(7) input').value = amount.toFixed(2);
            updateTotals();
        }

        function updateTotals() {
            const rows = document.querySelectorAll('#materialTableBody tr');
            let count = 0;
            let totalQuantity = 0;
            let totalAmount = 0;

            rows.forEach(row => {
                const quantity = parseFloat(row.querySelector('td:nth-child(5) input').value) || 0;
                const amount = parseFloat(row.querySelector('td:nth-child(7) input').value) || 0;
                
                if (quantity > 0 || amount > 0) {
                    count++;
                }
                totalQuantity += quantity;
                totalAmount += amount;
            });

            document.getElementById('materialCount').textContent = count;
            document.getElementById('totalQuantity').textContent = totalQuantity;
            document.getElementById('totalAmount').textContent = '¥' + totalAmount.toFixed(2);
        }

        updateTotals();
    </script>
</body>
</html>
