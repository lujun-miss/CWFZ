<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>统计 - 研知π</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .miniprogram-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
            max-width: 414px;
            margin: 0 auto;
            overflow: hidden;
        }
        
        .miniprogram-status-bar {
            height: env(safe-area-inset-top);
            background: #1890ff;
            flex-shrink: 0;
        }
        
        .miniprogram-nav-bar {
            height: 44px;
            background: #1890ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        
        .miniprogram-nav-bar .nav-title {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
        }
        
        .miniprogram-nav-bar .nav-back {
            position: absolute;
            left: 16px;
            font-size: 16px;
            color: #fff;
        }
        
        .miniprogram-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
        }
        
        .stat-value {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        
        .chart-container {
            height: 200px;
            margin: 16px 0;
        }
        
        .tab-bar {
            height: 50px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            flex-shrink: 0;
        }
        
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999;
        }
        
        .tab-item.active {
            color: #1890ff;
        }
        
        .tab-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="miniprogram-container">
        <!-- 状态栏 -->
        <div class="miniprogram-status-bar"></div>
        
        <!-- 导航栏 -->
        <div class="miniprogram-nav-bar">
            <a href="mobile-records.html" class="nav-back">
                <i class="fa fa-chevron-left"></i>
            </a>
            <div class="nav-title">统计</div>
        </div>
        
        <!-- 内容区 -->
        <div class="miniprogram-content">
            <!-- 月度统计 -->
            <div class="card">
                <div class="card-title">月度统计</div>
                <div class="stat-item">
                    <span class="stat-label">总工时</span>
                    <span class="stat-value">80 小时</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">项目工时</span>
                    <span class="stat-value">72 小时</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">非项目工时</span>
                    <span class="stat-value">8 小时</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">平均每日工时</span>
                    <span class="stat-value">2.7 小时</span>
                </div>
            </div>
            
            <!-- 项目分布 -->
            <div class="card">
                <div class="card-title">项目分布</div>
                <div class="chart-container">
                    <!-- 这里可以添加图表 -->
                    <div class="flex flex-col items-center justify-center h-full">
                        <i class="fa fa-pie-chart text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-400 text-sm">图表加载中...</p>
                    </div>
                </div>
                <div class="space-y-2 mt-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">智能研发管理系统</span>
                        <span class="text-sm font-medium text-gray-900">40 小时</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">企业数据分析平台</span>
                        <span class="text-sm font-medium text-gray-900">24 小时</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-600">移动应用开发</span>
                        <span class="text-sm font-medium text-gray-900">8 小时</span>
                    </div>
                </div>
            </div>
            
            <!-- 工时趋势 -->
            <div class="card">
                <div class="card-title">工时趋势</div>
                <div class="chart-container">
                    <!-- 这里可以添加图表 -->
                    <div class="flex flex-col items-center justify-center h-full">
                        <i class="fa fa-line-chart text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-400 text-sm">图表加载中...</p>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-4">
                    <button class="text-sm text-primary">周视图</button>
                    <button class="text-sm text-gray-500">月视图</button>
                    <button class="text-sm text-gray-500">年视图</button>
                </div>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="tab-bar">
            <a href="mobile-checkin.html" class="tab-item">
                <i class="fa fa-clock-o tab-icon"></i>
                <span>打卡</span>
            </a>
            <a href="mobile-records.html" class="tab-item">
                <i class="fa fa-list tab-icon"></i>
                <span>记录</span>
            </a>
            <a href="statistics.html" class="tab-item active">
                <i class="fa fa-bar-chart tab-icon"></i>
                <span>统计</span>
            </a>
            <a href="mobile-profile.html" class="tab-item">
                <i class="fa fa-user tab-icon"></i>
                <span>我的</span>
            </a>
        </div>
    </div>
    
    <script>
        // 模拟图表加载
        setTimeout(function() {
            const chartContainers = document.querySelectorAll('.chart-container');
            chartContainers.forEach(container => {
                container.innerHTML = '<div class="flex flex-col items-center justify-center h-full"><i class="fa fa-check-circle text-4xl text-green-500 mb-4"></i><p class="text-gray-400 text-sm">图表加载完成</p></div>';
            });
        }, 1000);
    </script>
</body>
</html>
