<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增工资</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        danger: '#ef4444',
                        success: '#22c55e',
                        warning: '#f59e0b',
                    },
                },
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans p-6">
    <!-- 页面标题 -->
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800">新增工资</h1>
    </div>
    
    <!-- 表单卡片 -->
    <div class="bg-white rounded-lg shadow p-6">
        <form id="salaryForm" class="space-y-6">
            <!-- 基本信息 -->
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">所属年月份 <span class="text-red-500">*</span></label>
                    <input type="month" id="salaryMonth" name="salaryMonth" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">姓名 <span class="text-red-500">*</span></label>
                    <select id="personnelName" name="personnelName" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                        <option value="">请选择人员</option>
                        <option value="张三">张三</option>
                        <option value="李四">李四</option>
                        <option value="王五">王五</option>
                        <option value="赵六">赵六</option>
                        <option value="钱七">钱七</option>
                    </select>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">人员类型 <span class="text-red-500">*</span></label>
                    <select id="personnelType" name="personnelType" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                        <option value="">请选择人员类型</option>
                        <option value="正式员工">正式员工</option>
                        <option value="劳务派遣">劳务派遣</option>
                        <option value="实习生">实习生</option>
                        <option value="外包人员">外包人员</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">应发工资 <span class="text-red-500">*</span></label>
                    <input type="number" id="grossSalary" name="grossSalary" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入应发工资" required>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">奖金</label>
                    <input type="number" id="bonus" name="bonus" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入奖金" value="0">
                </div>
            </div>
            
            <!-- 社保信息 -->
            <div class="border-t border-gray-200 pt-6">
                <h3 class="text-sm font-medium text-gray-700 mb-4">社会保险（单位缴纳）</h3>
                <div class="grid grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">养老保险</label>
                        <input type="number" id="pensionInsurance" name="pensionInsurance" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">医疗保险</label>
                        <input type="number" id="medicalInsurance" name="medicalInsurance" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">失业保险</label>
                        <input type="number" id="unemploymentInsurance" name="unemploymentInsurance" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">工伤保险</label>
                        <input type="number" id="workInjuryInsurance" name="workInjuryInsurance" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">生育保险</label>
                        <input type="number" id="maternityInsurance" name="maternityInsurance" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">住房公积金</label>
                        <input type="number" id="housingFund" name="housingFund" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="0.00">
                    </div>
                </div>
            </div>
            
            <!-- 操作按钮 -->
            <div class="flex justify-end space-x-4 pt-6">
                <button type="button" class="px-6 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors" onclick="window.history.back()">
                    取消
                </button>
                <button type="submit" class="px-6 py-2 bg-primary text-white rounded-md hover:bg-blue-600 transition-colors">
                    保存
                </button>
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('salaryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('工资信息保存成功！');
            window.history.back();
        });
    </script>
</body>
</html>
