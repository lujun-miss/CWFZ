<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
</head>
<body>
    <h1>测试页面</h1>
    <button onclick="testLoadPage()">测试跳转到dashboard</button>
    <button onclick="testLoadPage2()">测试跳转到project-management</button>
    
    <script>
        function testLoadPage() {
            try {
                console.log('尝试跳转到dashboard.html');
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('跳转失败:', error);
                alert('跳转失败: ' + error.message);
            }
        }
        
        function testLoadPage2() {
            try {
                console.log('尝试跳转到project-management.html');
                window.location.href = 'project-management.html';
            } catch (error) {
                console.error('跳转失败:', error);
                alert('跳转失败: ' + error.message);
            }
        }
    </script>
</body>
</html>
