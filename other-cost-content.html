<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>其他费用管理 - 研发费用管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        danger: '#ef4444',
                        success: '#22c55e',
                        warning: '#f59e0b',
                        purple: '#8b5cf6',
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .table-row-hover:hover { background-color: #f9fafb; }
        }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-7xl mx-auto">
        <!-- 操作栏 -->
        <div class="bg-white rounded-lg shadow p-4 mb-6">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-700">关联项目：</span>
                    <select id="filterProject" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm">
                        <option value="">全部项目</option>
                        <option value="智能传感器研发">智能传感器研发</option>
                        <option value="工业机器人控制系统">工业机器人控制系统</option>
                        <option value="新能源材料研究">新能源材料研究</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-700">归集状态：</span>
                    <select id="filterAllocation" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm">
                        <option value="">全部状态</option>
                        <option value="1">已归集</option>
                        <option value="0">未归集</option>
                    </select>
                </div>
                <button onclick="searchRecords()" class="bg-primary text-white px-4 py-1.5 rounded-md text-sm hover:bg-blue-600">
                    <i class="fa fa-search mr-1"></i>查询
                </button>
                <button onclick="resetFilter()" class="bg-gray-300 text-gray-700 px-4 py-1.5 rounded-md text-sm hover:bg-gray-400">
                    <i class="fa fa-refresh mr-1"></i>重置
                </button>
                <button onclick="openAddModal()" class="bg-blue-500 text-white px-4 py-1.5 rounded-md text-sm hover:bg-blue-600">
                    <i class="fa fa-plus mr-1"></i>新增其他费用
                </button>
            </div>
        </div>

        <!-- 列表 -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800">其他费用类型列表</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">费用类型</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">关联项目</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">发生日期</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">费用金额</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">归集状态</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">备注</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">操作</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="costTableBody">
                    </tbody>
                </table>
            </div>
            <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                <div class="text-sm text-gray-700">显示 1 到 <span id="displayCount">0</span> 条，共 <span id="totalCount">0</span> 条记录</div>
                <div class="flex items-center space-x-2">
                    <button class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50 disabled:opacity-50" disabled>上一页</button>
                    <button class="px-3 py-1 bg-primary text-white rounded-md text-sm">1</button>
                    <button class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态框 -->
    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-semibold text-gray-900">新增其他费用</h3>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-500">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="space-y-4">
                <input type="hidden" id="editId">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">发生日期 <span class="text-red-500">*</span></label>
                    <input type="date" id="addDate" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">费用类型 <span class="text-gray-400 text-xs">(取数据字典值)</span> <span class="text-red-500">*</span></label>
                    <select id="addName" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                        <option value="">请选择费用类型</option>
                        <option value="资料翻译费">资料翻译费</option>
                        <option value="专家咨询费">专家咨询费</option>
                        <option value="知识产权申请费">知识产权申请费</option>
                        <option value="会议费">会议费</option>
                        <option value="差旅费">差旅费</option>
                        <option value="通讯费">通讯费</option>
                        <option value="技术图书资料费">技术图书资料费</option>
                        <option value="研发保险费">研发保险费</option>
                        <option value="其他杂费">其他杂费</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">费用金额 <span class="text-red-500">*</span></label>
                    <input type="number" id="addAmount" oninput="updateAllocationSummary()" class="w-full px-4 py-2 border border-gray-300 rounded-md" placeholder="请输入费用总金额" min="0" step="0.01">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">关联项目 <span class="text-red-500">*</span></label>
                    <div class="border border-gray-300 rounded-md px-3 py-2 min-h-[42px] bg-white flex items-center justify-between">
                        <div id="selectedProjectTags" class="flex flex-wrap gap-2 text-sm text-gray-500">请选择关联项目</div>
                        <i class="fa fa-angle-down text-gray-400 ml-2"></i>
                    </div>
                    <div id="addProject" class="mt-2 grid grid-cols-1 md:grid-cols-3 gap-2 rounded-md border border-gray-200 bg-gray-50 p-2">
                        <label class="flex items-center px-3 py-2 bg-white border border-gray-200 rounded-md text-sm hover:bg-blue-50 cursor-pointer">
                            <input type="checkbox" name="addProjectItem" value="智能传感器研发" class="mr-2" onchange="handleProjectSelectionChange()">
                            智能传感器研发
                        </label>
                        <label class="flex items-center px-3 py-2 bg-white border border-gray-200 rounded-md text-sm hover:bg-blue-50 cursor-pointer">
                            <input type="checkbox" name="addProjectItem" value="工业机器人控制系统" class="mr-2" onchange="handleProjectSelectionChange()">
                            工业机器人控制系统
                        </label>
                        <label class="flex items-center px-3 py-2 bg-white border border-gray-200 rounded-md text-sm hover:bg-blue-50 cursor-pointer">
                            <input type="checkbox" name="addProjectItem" value="新能源材料研究" class="mr-2" onchange="handleProjectSelectionChange()">
                            新能源材料研究
                        </label>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">可多选项目，选择后下方会自动生成对应项目的费用分配输入框。</p>
                </div>
                <div id="projectAllocationWrap" class="hidden">
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-medium text-gray-700">项目分摊金额 <span class="text-red-500">*</span></label>
                        <span id="allocationSummary" class="text-xs text-gray-500">已分摊 0.00 / 总金额 0.00</span>
                    </div>
                    <div id="projectAllocationList" class="space-y-2"></div>
                    <div id="allocationFooter" class="mt-3 border-t pt-3 text-sm text-gray-700 space-y-1"></div>
                    <p class="text-xs text-gray-500 mt-2">各项目分摊金额合计必须等于费用总金额。</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">备注说明</label>
                    <textarea id="addRemark" class="w-full px-4 py-2 border border-gray-300 rounded-md" rows="3" placeholder="请输入备注说明"></textarea>
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="closeAddModal()" class="px-6 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">取消</button>
                <button onclick="saveCostItem()" class="px-6 py-2 bg-primary text-white rounded-md hover:bg-blue-600">保存</button>
            </div>
        </div>
    </div>

    <script>
        let costItems = [
            { id: 101, project: '智能传感器研发', name: '专家咨询费', date: '2024-04-10', amount: '5000.00', isAllocated: 1, remark: '研发方案评审' },
            { id: 102, project: '工业机器人控制系统', name: '差旅费', date: '2024-04-15', amount: '2500.00', isAllocated: 1, remark: '现场技术交流' },
            { id: 103, project: '新能源材料研究', name: '知识产权申请费', date: '2024-05-01', amount: '8000.00', isAllocated: 1, remark: '专利申报' },
            { id: 104, project: '智能传感器研发、工业机器人控制系统', name: '其他杂费', date: '2024-05-05', amount: '1200.00', isAllocated: 0, remark: '日常研发杂费', allocations: [
                { project: '智能传感器研发', amount: 700 },
                { project: '工业机器人控制系统', amount: 500 }
            ] },
        ];

        function getItemAllocations(item) {
            if (item.allocations && item.allocations.length) {
                return item.allocations;
            }
            return [{ project: item.project, amount: parseFloat(item.amount || 0) }];
        }

        function renderProjectDisplay(item) {
            const allocations = getItemAllocations(item);
            if (allocations.length === 1) {
                return allocations[0].project;
            }
            return allocations.map(allocation => `
                <div class="flex justify-between gap-3 text-xs leading-5">
                    <span class="text-gray-700">${allocation.project}</span>
                    <span class="font-medium text-gray-900">¥${parseFloat(allocation.amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                </div>
            `).join('');
        }

        function getSelectedProjects() {
            return Array.from(document.querySelectorAll('input[name="addProjectItem"]:checked')).map(input => input.value);
        }

        function renderSelectedProjectTags() {
            const selectedProjects = getSelectedProjects();
            const tagWrap = document.getElementById('selectedProjectTags');
            if (!selectedProjects.length) {
                tagWrap.innerHTML = '请选择关联项目';
                tagWrap.className = 'flex flex-wrap gap-2 text-sm text-gray-500';
                return;
            }

            tagWrap.className = 'flex flex-wrap gap-2 text-sm text-gray-700';
            tagWrap.innerHTML = selectedProjects.map(project => `
                <span class="inline-flex items-center bg-gray-100 text-gray-600 px-2 py-1 rounded">
                    ${project}
                    <button type="button" onclick="removeSelectedProject('${project}')" class="ml-1 text-gray-400 hover:text-gray-600">×</button>
                </span>
            `).join('');
        }

        function removeSelectedProject(project) {
            const input = Array.from(document.querySelectorAll('input[name="addProjectItem"]')).find(item => item.value === project);
            if (input) input.checked = false;
            handleProjectSelectionChange();
        }

        function handleProjectSelectionChange() {
            renderSelectedProjectTags();
            renderProjectAllocationInputs();
        }

        function renderProjectAllocationInputs(existingAllocations = []) {
            if (!existingAllocations.length) {
                existingAllocations = getProjectAllocations();
            }
            const selectedProjects = getSelectedProjects();
            const wrap = document.getElementById('projectAllocationWrap');
            const list = document.getElementById('projectAllocationList');

            if (!selectedProjects.length) {
                wrap.classList.add('hidden');
                list.innerHTML = '';
                document.getElementById('allocationFooter').innerHTML = '';
                updateAllocationSummary();
                return;
            }

            wrap.classList.remove('hidden');
            list.innerHTML = selectedProjects.map(project => {
                const existing = existingAllocations.find(item => item.project === project);
                const value = existing ? existing.amount : '';
                return `
                    <div class="space-y-2">
                        <div class="text-sm font-semibold text-gray-800">${project}</div>
                        <input type="number" min="0" step="0.01" value="${value}" data-project="${project}" oninput="updateAllocationSummary()" class="project-allocation-amount w-full px-3 py-2 border border-gray-300 rounded-md text-sm text-center" placeholder="0.00">
                    </div>
                `;
            }).join('');
            updateAllocationSummary();
        }

        function getProjectAllocations() {
            return Array.from(document.querySelectorAll('.project-allocation-amount')).map(input => ({
                project: input.dataset.project,
                amount: parseFloat(input.value || 0)
            }));
        }

        function updateAllocationSummary() {
            const totalAmount = parseFloat(document.getElementById('addAmount').value || 0);
            const allocatedAmount = getProjectAllocations().reduce((sum, item) => sum + item.amount, 0);
            const summary = document.getElementById('allocationSummary');
            if (summary) {
                const diff = allocatedAmount - totalAmount;
                summary.textContent = `已分摊 ${allocatedAmount.toFixed(2)} / 总金额 ${totalAmount.toFixed(2)}`;
                summary.className = Math.abs(diff) < 0.01 ? 'text-xs text-green-600' : 'text-xs text-orange-600';
            }

            const footer = document.getElementById('allocationFooter');
            if (footer) {
                const remainingAmount = totalAmount - allocatedAmount;
                footer.innerHTML = `
                    <div class="flex justify-between">
                        <span>已分配金额：</span>
                        <span class="font-bold text-gray-900">${allocatedAmount.toFixed(2)} 元</span>
                    </div>
                    <div class="flex justify-between">
                        <span>剩余金额：</span>
                        <span class="font-bold ${Math.abs(remainingAmount) < 0.01 ? 'text-green-600' : 'text-red-600'}">${remainingAmount.toFixed(2)} 元</span>
                    </div>
                `;
            }
        }

        function renderTable(data = costItems) {
            const tbody = document.getElementById('costTableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'table-row-hover';
                
                const allocatedTag = item.isAllocated 
                    ? '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-xs">已归集</span>' 
                    : '<span class="bg-gray-100 text-gray-600 px-2 py-1 rounded-full text-xs">未归集</span>';

                const actionButtons = item.isAllocated
                    ? `<button class="text-gray-400 cursor-not-allowed mr-2" title="已归集费用不可修改" disabled>编辑</button>
                       <button class="text-gray-400 cursor-not-allowed" title="已归集费用不可删除" disabled>删除</button>`
                    : `<button onclick="editItem(${item.id})" class="text-primary hover:text-blue-700 mr-2">编辑</button>
                       <button onclick="deleteItem(${item.id})" class="text-danger hover:text-red-700">删除</button>`;

                row.innerHTML = `
                    <td class="px-6 py-4 text-sm text-gray-900">${item.name}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${renderProjectDisplay(item)}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${item.date}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">¥${parseFloat(item.amount).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    <td class="px-6 py-4 text-sm">${allocatedTag}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${item.remark || '-'}</td>
                    <td class="px-6 py-4 text-sm">${actionButtons}</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('totalCount').textContent = data.length;
            document.getElementById('displayCount').textContent = data.length;
        }

        function searchRecords() {
            const project = document.getElementById('filterProject').value;
            const allocation = document.getElementById('filterAllocation').value;
            let filtered = costItems;
            if (project) filtered = filtered.filter(r => getItemAllocations(r).some(item => item.project === project));
            if (allocation !== '') filtered = filtered.filter(r => r.isAllocated == allocation);
            renderTable(filtered);
        }

        function resetFilter() {
            document.getElementById('filterProject').value = '';
            document.getElementById('filterAllocation').value = '';
            renderTable();
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('addModal').classList.add('flex');
            document.getElementById('editId').value = '';
            document.querySelectorAll('input[name="addProjectItem"]').forEach(input => input.checked = false);
            document.getElementById('addDate').value = '';
            document.getElementById('addName').value = '';
            document.getElementById('addAmount').value = '';
            document.getElementById('addRemark').value = '';
            renderSelectedProjectTags();
            renderProjectAllocationInputs();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('addModal').classList.remove('flex');
        }

        function editItem(id) {
            const item = costItems.find(i => i.id === id);
            if (item) {
                if (item.isAllocated) {
                    alert('该费用已归集，不可编辑');
                    return;
                }
                document.getElementById('editId').value = item.id;
                const allocations = getItemAllocations(item);
                document.querySelectorAll('input[name="addProjectItem"]').forEach(input => {
                    input.checked = allocations.some(allocation => allocation.project === input.value);
                });
                document.getElementById('addDate').value = item.date;
                document.getElementById('addName').value = item.name;
                document.getElementById('addAmount').value = item.amount;
                document.getElementById('addRemark').value = item.remark;
                renderSelectedProjectTags();
                renderProjectAllocationInputs(allocations);
                document.getElementById('addModal').classList.remove('hidden');
                document.getElementById('addModal').classList.add('flex');
            }
        }

        function deleteItem(id) {
            const index = costItems.findIndex(i => i.id === id);
            if (index !== -1) {
                const item = costItems[index];
                if (item.isAllocated) {
                    alert('该费用已归集，不可删除');
                    return;
                }
                if (confirm(`确定要删除费用类型“${item.name}”吗？`)) {
                    costItems.splice(index, 1);
                    renderTable();
                    alert('已成功删除');
                }
            }
        }

        function saveCostItem() {
            const id = document.getElementById('editId').value;
            const selectedProjects = getSelectedProjects();
            const allocations = getProjectAllocations();
            const date = document.getElementById('addDate').value;
            const name = document.getElementById('addName').value;
            const amount = document.getElementById('addAmount').value;
            const totalAmount = parseFloat(amount || 0);
            const allocatedAmount = allocations.reduce((sum, item) => sum + item.amount, 0);
            const project = selectedProjects.join('、');
            
            if (!selectedProjects.length) {
                alert('请选择关联项目');
                return;
            }
            if (!date) {
                alert('请选择发生日期');
                return;
            }
            if (!name) {
                alert('请选择费用类型');
                return;
            }
            if (!amount || totalAmount <= 0) {
                alert('请输入有效的费用金额');
                return;
            }
            if (allocations.some(item => !item.amount || item.amount <= 0)) {
                alert('请为每个已选项目填写有效的分摊金额');
                return;
            }
            if (Math.abs(allocatedAmount - totalAmount) >= 0.01) {
                alert(`项目分摊金额合计需等于费用总金额。当前已分摊 ${allocatedAmount.toFixed(2)}，总金额 ${totalAmount.toFixed(2)}`);
                return;
            }

            if (id) {
                const item = costItems.find(i => i.id === parseInt(id));
                if (item) {
                    if (item.isAllocated) {
                        alert('该费用已归集，不可修改');
                        return;
                    }
                    item.project = project;
                    item.date = date;
                    item.name = name;
                    item.amount = amount;
                    item.allocations = allocations;
                    item.remark = document.getElementById('addRemark').value;
                }
            } else {
                const newId = costItems.length > 0 ? Math.max(...costItems.map(i => i.id)) + 1 : 1;
                costItems.push({
                    id: newId,
                    project: project,
                    date: date,
                    name: name,
                    amount: amount,
                    allocations: allocations,
                    remark: document.getElementById('addRemark').value,
                    isAllocated: 0
                });
            }

            closeAddModal();
            renderTable();
        }

        renderTable();
    </script>
</body>
</html>
