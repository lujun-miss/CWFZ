<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时报工</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f3f4f6;
            padding: 20px;
        }
        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-group label {
            width: 80px;
            margin-right: 10px;
            font-size: 0.875rem; /* text-sm */
            color: #4b5563; /* text-gray-700 */
        }
        .input-group input, .input-group select {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db; /* border-gray-300 */
            border-radius: 0.375rem; /* rounded-md */
            font-size: 0.875rem; /* text-sm */
        }
    </style>
</head>
<body>
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">实时报工</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="input-group">
                <label for="reportDate">报工日期:</label>
                <input type="date" id="reportDate" class="w-full">
            </div>
            <div class="input-group">
                <label for="projectSelect">选择项目:</label>
                <select id="projectSelect" class="w-full">
                    <option value="">-- 请选择项目 --</option>
                    <option value="proj1">智能传感器研发</option>
                    <option value="proj2">工业机器人控制系统</option>
                    <option value="proj3">新能源材料研究</option>
                </select>
            </div>
        </div>

        <h3 class="text-lg font-semibold text-gray-800 mt-6 mb-3">人员工时录入</h3>
        <div id="personnelHoursContainer" class="space-y-4">
            <!-- 人员工时输入行将动态添加 -->
            <div class="flex items-center space-x-2">
                <select class="person-select px-3 py-2 border border-gray-300 rounded-md text-sm flex-1">
                    <option value="">-- 选择人员 --</option>
                    <option value="person1">张三</option>
                    <option value="person2">李四</option>
                    <option value="person3">王五</option>
                </select>
                <input type="number" placeholder="工时 (小时)" class="person-hours-input px-3 py-2 border border-gray-300 rounded-md text-sm w-32">
                <button onclick="addPersonnelRow()" class="px-3 py-2 bg-green-500 text-white rounded-md text-sm hover:bg-green-600"><i class="fa fa-plus"></i></button>
            </div>
        </div>
        <p class="text-sm text-gray-500 mt-2">人员工时为选填项，可单独填写设备工时。</p>

        <h3 class="text-lg font-semibold text-gray-800 mt-6 mb-3">设备工时录入</h3>
        <div id="equipmentHoursContainer" class="space-y-4">
            <!-- 设备工时输入行将动态添加 -->
            <div class="flex items-center space-x-2">
                <select class="equipment-select px-3 py-2 border border-gray-300 rounded-md text-sm flex-1">
                    <option value="">-- 选择设备 --</option>
                    <option value="equip1">高精度测试仪</option>
                    <option value="equip2">自动化装配线</option>
                </select>
                <input type="number" placeholder="工时 (小时)" class="equipment-hours-input px-3 py-2 border border-gray-300 rounded-md text-sm w-32">
                <button onclick="addEquipmentRow()" class="px-3 py-2 bg-green-500 text-white rounded-md text-sm hover:bg-green-600"><i class="fa fa-plus"></i></button>
            </div>
        </div>
        <p class="text-sm text-gray-500 mt-2">设备工时为选填项，可单独填写人员工时。</p>

        <div class="mt-8 text-right">
            <button onclick="submitWorkReport()" class="px-6 py-3 bg-blue-600 text-white rounded-md text-lg hover:bg-blue-700">
                <i class="fa fa-paper-plane mr-2"></i>提交报工
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('reportDate').value = `${year}-${month}-${day}`;
        });

        function addPersonnelRow() {
            const container = document.getElementById('personnelHoursContainer');
            const newRow = document.createElement('div');
            newRow.className = 'flex items-center space-x-2 mt-2';
            newRow.innerHTML = `
                <select class="person-select px-3 py-2 border border-gray-300 rounded-md text-sm flex-1">
                    <option value="">-- 选择人员 --</option>
                    <option value="person1">张三</option>
                    <option value="person2">李四</option>
                    <option value="person3">王五</option>
                </select>
                <input type="number" placeholder="工时 (小时)" class="person-hours-input px-3 py-2 border border-gray-300 rounded-md text-sm w-32">
                <button onclick="removeRow(this)" class="px-3 py-2 bg-red-500 text-white rounded-md text-sm hover:bg-red-600"><i class="fa fa-minus"></i></button>
            `;
            container.appendChild(newRow);
        }

        function addEquipmentRow() {
            const container = document.getElementById('equipmentHoursContainer');
            const newRow = document.createElement('div');
            newRow.className = 'flex items-center space-x-2 mt-2';
            newRow.innerHTML = `
                <select class="equipment-select px-3 py-2 border border-gray-300 rounded-md text-sm flex-1">
                    <option value="">-- 选择设备 --</option>
                    <option value="equip1">高精度测试仪</option>
                    <option value="equip2">自动化装配线</option>
                </select>
                <input type="number" placeholder="工时 (小时)" class="equipment-hours-input px-3 py-2 border border-gray-300 rounded-md text-sm w-32">
                <button onclick="removeRow(this)" class="px-3 py-2 bg-red-500 text-white rounded-md text-sm hover:bg-red-600"><i class="fa fa-minus"></i></button>
            `;
            container.appendChild(newRow);
        }

        function removeRow(buttonElement) {
            buttonElement.parentNode.remove();
        }

        function submitWorkReport() {
            const reportDate = document.getElementById('reportDate').value;
            const project = document.getElementById('projectSelect').value;

            if (!reportDate) {
                alert('请选择报工日期！');
                return;
            }
            if (!project) {
                alert('请选择报工项目！');
                return;
            }

            const personnelReports = [];
            let hasPersonnelReport = false;
            document.querySelectorAll('#personnelHoursContainer > div').forEach(row => {
                const personId = row.querySelector('.person-select').value;
                const hours = parseFloat(row.querySelector('.person-hours-input').value);
                if (personId && !isNaN(hours) && hours > 0) {
                    personnelReports.push({ personId, hours });
                    hasPersonnelReport = true;
                }
            });

            const equipmentReports = [];
            let hasEquipmentReport = false;
            document.querySelectorAll('#equipmentHoursContainer > div').forEach(row => {
                const equipmentId = row.querySelector('.equipment-select').value;
                const hours = parseFloat(row.querySelector('.equipment-hours-input').value);
                if (equipmentId && !isNaN(hours) && hours > 0) {
                    equipmentReports.push({ equipmentId, hours });
                    hasEquipmentReport = true;
                }
            });

            if (!hasPersonnelReport && !hasEquipmentReport) {
                alert('请至少录入一项人员工时或设备工时！');
                return;
            }

            console.log('提交报工数据:', {
                reportDate,
                project,
                personnelReports,
                equipmentReports
            });
            alert('报工数据已提交 (请查看控制台输出)。');
            // 实际应用中，这里会发送数据到后端
        }
    </script>
</body>
</html>
