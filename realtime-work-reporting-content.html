<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时报工</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f3f4f6;
            padding: 20px;
        }
        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-group label {
            width: 80px;
            margin-right: 10px;
            font-size: 0.875rem; /* text-sm */
            color: #4b5563; /* text-gray-700 */
        }
        .input-group input, .input-group select {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db; /* border-gray-300 */
            border-radius: 0.375rem; /* rounded-md */
            font-size: 0.875rem; /* text-sm */
        }
    </style>
</head>
<body>
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">实时报工</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="input-group">
                <label for="projectSelect">项目名称:</label>
                <select id="projectSelect" class="w-full">
                    <option value="">-- 请选择项目 --</option>
                    <option value="proj1">智能传感器研发</option>
                    <option value="proj2">工业机器人控制系统</option>
                    <option value="proj3">新能源材料研究</option>
                </select>
            </div>
            <div class="input-group">
                <label for="reportDate">填报日期:</label>
                <input type="date" id="reportDate" class="w-full">
            </div>
        </div>

        <div class="mt-6 border-b border-gray-200 flex">
            <button id="btnRealtimeManual" class="flex-1 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600" onclick="selectRealtimeType('manual')">
                <i class="fa fa-user mr-1"></i>人工工时
            </button>
            <button id="btnRealtimeEquipment" class="flex-1 py-2 text-sm font-medium text-gray-500 hover:text-gray-700" onclick="selectRealtimeType('equipment')">
                <i class="fa fa-microchip mr-1"></i>设备工时
            </button>
        </div>

        <div id="manualRealtimeSection" class="mt-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="input-group">
                    <label for="personSelect">选择人员:</label>
                    <select id="personSelect" class="w-full">
                        <option value="">-- 请选择人员 --</option>
                        <option value="person1">张三</option>
                        <option value="person2">李四</option>
                        <option value="person3">王五</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="manualHoursInput">人工工时:</label>
                    <input id="manualHoursInput" type="number" min="0" max="24" step="0.5" value="2" class="w-full" placeholder="请输入工时">
                </div>
            </div>
        </div>

        <div id="equipmentRealtimeSection" class="mt-5 hidden">
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">设备组</label>
                <select id="realtimeDeviceGroupSelect" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    <option value="">不使用设备组</option>
                    <option value="group1">开发设备组</option>
                    <option value="group2">测试设备组</option>
                    <option value="group3">设计设备组</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">选择设备（支持多选）</label>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <label class="flex items-center p-2 border border-gray-300 rounded-lg bg-white cursor-pointer hover:bg-gray-50"><input type="checkbox" class="realtime-equipment-checkbox mr-2" value="台式电脑"><span class="text-xs text-gray-700">台式电脑</span></label>
                    <label class="flex items-center p-2 border border-gray-300 rounded-lg bg-white cursor-pointer hover:bg-gray-50"><input type="checkbox" class="realtime-equipment-checkbox mr-2" value="笔记本"><span class="text-xs text-gray-700">笔记本</span></label>
                    <label class="flex items-center p-2 border border-gray-300 rounded-lg bg-white cursor-pointer hover:bg-gray-50"><input type="checkbox" class="realtime-equipment-checkbox mr-2" value="服务器"><span class="text-xs text-gray-700">服务器</span></label>
                    <label class="flex items-center p-2 border border-gray-300 rounded-lg bg-white cursor-pointer hover:bg-gray-50"><input type="checkbox" class="realtime-equipment-checkbox mr-2" value="测试设备"><span class="text-xs text-gray-700">测试设备</span></label>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="input-group">
                    <label for="equipmentUsageHours">设备运行时长:</label>
                    <input id="equipmentUsageHours" type="number" min="0" max="24" step="0.5" value="2" class="w-full" oninput="updateRealtimeEquipmentSummary()">
                </div>
                <div class="input-group">
                    <label for="equipmentRdHours">研发时长:</label>
                    <input id="equipmentRdHours" type="number" min="0" max="24" step="0.5" value="1" class="w-full" oninput="updateRealtimeEquipmentSummary()">
                </div>
            </div>
            <div class="mt-3 p-3 bg-gray-50 rounded-md text-sm text-gray-700">
                <div class="flex justify-between"><span>设备运行时长:</span><span id="equipmentTotalHoursDisplay">2小时</span></div>
                <div class="flex justify-between"><span>研发时长:</span><span id="equipmentRdHoursDisplay">1小时</span></div>
                <div class="flex justify-between"><span>生产工时:</span><span id="equipmentProdHoursDisplay">1小时</span></div>
            </div>
        </div>

        <div class="mt-8 text-right">
            <button onclick="submitWorkReport()" class="px-6 py-3 bg-blue-600 text-white rounded-md text-lg hover:bg-blue-700">
                <i class="fa fa-paper-plane mr-2"></i>提交报工
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('reportDate').value = `${year}-${month}-${day}`;
            updateRealtimeEquipmentSummary();
        });

        let realtimeWorkType = 'manual';

        function selectRealtimeType(type) {
            realtimeWorkType = type;
            document.getElementById('manualRealtimeSection').classList.toggle('hidden', type !== 'manual');
            document.getElementById('equipmentRealtimeSection').classList.toggle('hidden', type !== 'equipment');
            document.getElementById('btnRealtimeManual').className = type === 'manual'
                ? 'flex-1 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600'
                : 'flex-1 py-2 text-sm font-medium text-gray-500 hover:text-gray-700';
            document.getElementById('btnRealtimeEquipment').className = type === 'equipment'
                ? 'flex-1 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600'
                : 'flex-1 py-2 text-sm font-medium text-gray-500 hover:text-gray-700';
        }

        function updateRealtimeEquipmentSummary() {
            const totalHours = parseFloat(document.getElementById('equipmentUsageHours')?.value) || 0;
            let rdHours = parseFloat(document.getElementById('equipmentRdHours')?.value) || 0;
            if (rdHours > totalHours) {
                rdHours = totalHours;
                document.getElementById('equipmentRdHours').value = rdHours;
            }
            const prodHours = Math.max(totalHours - rdHours, 0);
            document.getElementById('equipmentTotalHoursDisplay').textContent = `${totalHours.toFixed(1)}小时`;
            document.getElementById('equipmentRdHoursDisplay').textContent = `${rdHours.toFixed(1)}小时`;
            document.getElementById('equipmentProdHoursDisplay').textContent = `${prodHours.toFixed(1)}小时`;
        }

        function addPersonnelRow() {
            const container = document.getElementById('personnelHoursContainer');
            const newRow = document.createElement('div');
            newRow.className = 'flex items-center space-x-2 mt-2';
            newRow.innerHTML = `
                <select class="person-select px-3 py-2 border border-gray-300 rounded-md text-sm flex-1">
                    <option value="">-- 选择人员 --</option>
                    <option value="person1">张三</option>
                    <option value="person2">李四</option>
                    <option value="person3">王五</option>
                </select>
                <input type="number" placeholder="工时 (小时)" class="person-hours-input px-3 py-2 border border-gray-300 rounded-md text-sm w-32">
                <button onclick="removeRow(this)" class="px-3 py-2 bg-red-500 text-white rounded-md text-sm hover:bg-red-600"><i class="fa fa-minus"></i></button>
            `;
            container.appendChild(newRow);
        }

        function addEquipmentRow() {
            const container = document.getElementById('equipmentHoursContainer');
            const newRow = document.createElement('div');
            newRow.className = 'flex items-center space-x-2 mt-2';
            newRow.innerHTML = `
                <select class="equipment-select px-3 py-2 border border-gray-300 rounded-md text-sm flex-1">
                    <option value="">-- 选择设备 --</option>
                    <option value="equip1">高精度测试仪</option>
                    <option value="equip2">自动化装配线</option>
                </select>
                <input type="number" placeholder="工时 (小时)" class="equipment-hours-input px-3 py-2 border border-gray-300 rounded-md text-sm w-32">
                <button onclick="removeRow(this)" class="px-3 py-2 bg-red-500 text-white rounded-md text-sm hover:bg-red-600"><i class="fa fa-minus"></i></button>
            `;
            container.appendChild(newRow);
        }

        function removeRow(buttonElement) {
            buttonElement.parentNode.remove();
        }

        function submitWorkReport() {
            const reportDate = document.getElementById('reportDate').value;
            const project = document.getElementById('projectSelect').value;

            if (!reportDate) {
                alert('请选择报工日期！');
                return;
            }
            if (!project) {
                alert('请选择报工项目！');
                return;
            }

            if (realtimeWorkType === 'manual') {
                const person = document.getElementById('personSelect').value;
                const hours = parseFloat(document.getElementById('manualHoursInput').value) || 0;
                if (!person) {
                    alert('请选择人员！');
                    return;
                }
                if (hours <= 0) {
                    alert('请填写人工工时！');
                    return;
                }
            } else {
                const deviceGroup = document.getElementById('realtimeDeviceGroupSelect').value;
                const selectedDevices = document.querySelectorAll('.realtime-equipment-checkbox:checked');
                const totalHours = parseFloat(document.getElementById('equipmentUsageHours').value) || 0;
                const rdHours = parseFloat(document.getElementById('equipmentRdHours').value) || 0;
                if (!deviceGroup && selectedDevices.length === 0) {
                    alert('请选择设备组或至少一台设备！');
                    return;
                }
                if (totalHours <= 0) {
                    alert('请填写设备运行时长！');
                    return;
                }
                if (rdHours > totalHours) {
                    alert('研发时长不能大于设备运行时长！');
                    return;
                }
            }

            console.log('提交报工数据:', {
                reportDate,
                project,
                type: realtimeWorkType
            });
            alert('报工数据已提交 (请查看控制台输出)。');
            // 实际应用中，这里会发送数据到后端
        }
    </script>
</body>
</html>
