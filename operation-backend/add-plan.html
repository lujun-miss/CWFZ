<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增套餐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 p-6">
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <!-- 表单头部 -->
        <div class="bg-gradient-to-r from-blue-500 to-blue-600 px-6 py-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-semibold text-white">新增套餐</h1>
                    <p class="text-blue-100 text-sm">创建新的套餐配置</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button class="px-4 py-2 bg-white bg-opacity-20 text-white rounded-lg hover:bg-opacity-30 transition-opacity" onclick="location.href='plans.html'">
                        <i class="fa-solid fa-arrow-left mr-2"></i>返回列表
                    </button>
                </div>
            </div>
        </div>
        
        <form class="p-6">
            <!-- 套餐基本信息 -->
            <div class="mb-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <i class="fa-solid fa-info-circle text-blue-500 mr-2"></i>基本信息
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">套餐名称</label>
                        <input type="text" id="planName" placeholder="如：版本A" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">套餐编码</label>
                        <input type="text" id="planCode" placeholder="如：SAAS-A" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">套餐类型</label>
                        <div class="mt-2 flex space-x-4">
                            <label class="inline-flex items-center">
                                <input type="radio" name="planType" value="normal" class="form-radio" checked onchange="togglePlanTypeOptions()">
                                <span class="ml-2">正常版本套餐</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="planType" value="gift" class="form-radio" onchange="togglePlanTypeOptions()">
                                <span class="ml-2">赠送套餐</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 正常版本套餐专属字段 -->
                <div id="normalPlanFields">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">部署形式</label>
                            <select id="deployType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="toggleDeploymentOptions()">
                                <option value="saas">SaaS订阅版（按年订阅）</option>
                                <option value="private">私有化专属版（一次性买断）</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">所属系统</label>
                            <select id="systemId" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">请选择所属系统</option>
                                <option value="system_rd">研知π研发费用管理系统</option>
                                <option value="system_workhour">盯一下研发费用报工系统</option>
                                <option value="system_openrd">openRD研发费用管理服务系统</option>
                                <option value="system_intangible">研知π无形资产管理系统</option>
                                <option value="system_policy">策源易答政策匹配系统</option>
                                <option value="system_other">其他系统接口</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                            <select id="status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="enabled">启用</option>
                                <option value="disabled">禁用</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">研发费用限额（万元）</label>
                            <input type="text" id="feeLimit" placeholder="如：300以内、300-500、不限制" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">售价（元）</label>
                            <input type="number" id="price" placeholder="请输入套餐价格" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">关联赠送套餐</label>
                            <select id="associatedGiftPlan" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">不关联赠送套餐</option>
                                <!-- Gift plans will be dynamically loaded here -->
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 赠送套餐专属字段 -->
                <div id="giftPlanFields" class="hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">赠送月数</label>
                            <input type="number" id="giftBonusMonths" placeholder="请输入赠送月数" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 套餐配置 -->
            <div class="mb-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <i class="fa-solid fa-sliders-h text-green-500 mr-2"></i>套餐配置
                </h2>
                
                <!-- SaaS版专属 -->
                <div id="saasOptions" class="mt-4 p-4 bg-blue-50 rounded-lg">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-sm font-medium text-blue-700">SaaS版配置</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">报价周期</label>
                            <div class="px-3 py-2 bg-white border border-blue-200 rounded-lg">按年订阅</div>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">用户数量限制</label>
                            <input type="number" placeholder="不限制请留空" class="w-full px-3 py-2 border border-blue-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>
                
                <!-- 私有化版专属 -->
                <div id="privateOptions" class="mt-4 p-4 bg-purple-50 rounded-lg hidden">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-sm font-medium text-purple-700">私有化版配置</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">授权类型</label>
                            <select class="w-full px-3 py-2 border border-purple-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                                <option>永久授权</option>
                                <option>年限授权</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">授权年限</label>
                            <input type="number" placeholder="永久授权请留空" class="w-full px-3 py-2 border border-purple-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">技术支持年限</label>
                            <input type="number" placeholder="0" class="w-full px-3 py-2 border border-purple-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 套餐描述 -->
            <div class="mb-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <i class="fa-solid fa-file-text text-gray-500 mr-2"></i>套餐描述
                </h2>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">详细说明</label>
                    <textarea rows="4" placeholder="请输入套餐详细说明..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
            </div>
            
            <!-- 提交按钮 -->
            <div class="flex justify-end space-x-3 pt-6 border-t border-gray-100">
                <button type="button" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                    保存草稿
                </button>
                <button type="button" class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">
                    <i class="fa-solid fa-eye mr-2"></i>预览
                </button>
                <button type="button" class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600" onclick="savePlan()">
                    <i class="fa-solid fa-save mr-2"></i>保存并发布
                </button>
            </div>
        </form>
    </div>

    <script>
        const giftPlansData = [
            { id: 'gift_2months', name: '赠送2个月', bonusMonths: 2 },
            { id: 'gift_3months', name: '赠送3个月', bonusMonths: 3 }
        ];

        function populateGiftPlans() {
            const associatedGiftPlanSelect = document.getElementById('associatedGiftPlan');
            giftPlansData.forEach(giftPlan => {
                const option = document.createElement('option');
                option.value = giftPlan.id;
                option.textContent = giftPlan.name;
                associatedGiftPlanSelect.appendChild(option);
            });
        }

        function togglePlanTypeOptions() {
            const planType = document.querySelector('input[name="planType"]:checked').value;
            const normalPlanFields = document.getElementById('normalPlanFields');
            const giftPlanFields = document.getElementById('giftPlanFields');

            if (planType === 'normal') {
                normalPlanFields.classList.remove('hidden');
                giftPlanFields.classList.add('hidden');
                toggleDeploymentOptions(); // Re-run to set correct deployment options visibility
            } else {
                normalPlanFields.classList.add('hidden');
                giftPlanFields.classList.remove('hidden');
            }
        }

        function toggleDeploymentOptions() {
            const select = document.getElementById('deployType');
            const type = select.value;
            
            if (type === 'saas') {
                document.getElementById('saasOptions').classList.remove('hidden');
                document.getElementById('privateOptions').classList.add('hidden');
            } else {
                document.getElementById('privateOptions').classList.remove('hidden');
                document.getElementById('saasOptions').classList.add('hidden');
            }
        }
        
        // 页面加载时初始化显示SaaS选项
        document.addEventListener('DOMContentLoaded', function() {
                toggleDeploymentOptions();
                populateGiftPlans(); // Populate gift plans on load
                togglePlanTypeOptions(); // Set initial visibility based on default radio button
            });

            function savePlan() {
                const planType = document.querySelector('input[name="planType"]:checked').value;
                const planName = document.getElementById('planName').value;
                const planCode = document.getElementById('planCode').value;
                const description = document.querySelector('textarea').value;

                let planData = {
                    planName: planName,
                    planCode: planCode,
                    planType: planType,
                    description: description
                };

                // Basic validation for planName and planCode
                if (!planName.trim()) {
                    alert('请输入套餐名称！');
                    return;
                }
                if (!planCode.trim()) {
                    alert('请输入套餐编码！');
                    return;
                }

                if (planType === 'normal') {
                    const deployType = document.getElementById('deployType').value;
                    const systemId = document.getElementById('systemId').value;
                    const status = document.getElementById('status').value;
                    const feeLimit = document.getElementById('feeLimit').value;
                    const price = document.getElementById('price').value;
                    const associatedGiftPlan = document.getElementById('associatedGiftPlan').value;
                    const associatedBonusMonths = document.getElementById('associatedBonusMonths').value;

                    // Validation for normal plan fields
                    if (!deployType) {
                        alert('请选择部署形式！');
                        return;
                    }
                    if (!systemId) {
                        alert('请选择所属系统！');
                        return;
                    }
                    if (!price.trim() || isNaN(price)) {
                        alert('请输入有效的套餐价格！');
                        return;
                    }

                    planData = {
                        ...planData,
                        deployType: deployType,
                        systemId: systemId,
                        status: status,
                        feeLimit: feeLimit,
                        price: parseFloat(price),
                        associatedGiftPlan: associatedGiftPlan || null
                    };
                } else { // gift plan
                    const giftBonusMonths = document.getElementById('giftBonusMonths').value;

                    // Validation for gift plan fields
                    if (!giftBonusMonths.trim() || isNaN(giftBonusMonths) || parseInt(giftBonusMonths) <= 0) {
                        alert('请输入有效的赠送月数！');
                        return;
                    }

                    planData = {
                        ...planData,
                        bonusMonths: parseInt(giftBonusMonths)
                    };
                }

                console.log('准备保存的套餐数据:', planData);
                alert('套餐数据已收集，请查看控制台输出。(实际提交逻辑在此处实现)');
                // 在这里可以添加实际的API调用来保存数据
            }
        </script>
    </body>
</html>
