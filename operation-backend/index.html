<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营端管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .nav-item.active {
            background-color: #3b82f6;
            color: white;
        }
        .nav-item.active i, .nav-item.active span {
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- 左侧导航栏 -->
        <div class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-4 border-b border-gray-700 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="flex items-center">
                    <i class="fa-solid fa-building text-blue-400 text-2xl mr-3"></i>
                    <span class="text-xl font-bold">运营管理系统</span>
                </div>
            </div>
            
            <nav class="flex-1 p-3">
                <ul class="space-y-1">
                    <li>
                        <div class="nav-item flex items-center px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" data-page="home.html" onclick="loadPage('home.html')">
                            <i class="fa-solid fa-chart-pie mr-3"></i>
                            <span>仪表盘</span>
                        </div>
                    </li>
                    <li>
                        <div class="nav-item flex items-center px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" data-page="tenants.html" onclick="loadPage('tenants.html')">
                            <i class="fa-solid fa-users mr-3"></i>
                            <span>租户管理</span>
                        </div>
                    </li>
                    <li>
                        <div class="nav-item flex items-center px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" data-page="subscriptions.html" onclick="loadPage('subscriptions.html')">
                            <i class="fa-solid fa-receipt mr-3"></i>
                            <span>订单管理</span>
                        </div>
                    </li>
                    <li>
                        <div class="nav-item flex items-center px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" data-page="plans.html" onclick="loadPage('plans.html')">
                            <i class="fa-solid fa-layer-group mr-3"></i>
                            <span>套餐配置</span>
                        </div>
                    </li>
                    <li>
                        <div class="nav-item flex items-center px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" data-page="reminders.html" onclick="loadPage('reminders.html')">
                            <i class="fa-solid fa-bell mr-3"></i>
                            <span>到期提醒</span>
                        </div>
                    </li>
                    <li>
                        <div class="flex items-center justify-between px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" onclick="toggleKnowledgeMenu()">
                            <div class="flex items-center">
                                <i class="fa-solid fa-book-open mr-3"></i>
                                <span>知识库维护</span>
                            </div>
                            <i id="knowledgeMenuIcon" class="fa-solid fa-angle-down text-xs text-gray-300"></i>
                        </div>
                        <ul id="knowledgeSubMenu" class="mt-1 ml-7 space-y-1">
                            <li>
                                <div class="nav-item flex items-center px-4 py-2 rounded-lg cursor-pointer text-sm text-gray-300 hover:bg-gray-700 transition-colors" data-page="../help-content-management.html?embed=1&type=operation" onclick="loadPage('../help-content-management.html?embed=1&type=operation')">
                                    <i class="fa-solid fa-book mr-3 text-xs"></i>
                                    <span>操作说明书</span>
                                </div>
                            </li>
                            <li>
                                <div class="nav-item flex items-center px-4 py-2 rounded-lg cursor-pointer text-sm text-gray-300 hover:bg-gray-700 transition-colors" data-page="../help-content-management.html?embed=1&type=policy" onclick="loadPage('../help-content-management.html?embed=1&type=policy')">
                                    <i class="fa-solid fa-gavel mr-3 text-xs"></i>
                                    <span>政策法规库</span>
                                </div>
                            </li>
                        </ul>
                    </li>
                </ul>
            </nav>
            
            <div class="p-4 border-t border-gray-700">
                <div class="flex items-center">
                    <img src="https://picsum.photos/40/40" alt="用户头像" class="w-8 h-8 rounded-full mr-3">
                    <div>
                        <p class="text-sm font-medium">管理员</p>
                        <p class="text-xs text-gray-400">admin@company.com</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 主内容区域 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部工具栏 -->
            <div class="bg-white shadow-sm px-6 py-4">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 id="pageTitle" class="text-xl font-semibold text-gray-800">仪表盘</h1>
                        <p id="pageSubtitle" class="text-sm text-gray-500">欢迎使用运营管理系统</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <input type="text" placeholder="搜索租户..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                        <button class="relative p-2 text-gray-500 hover:text-gray-700">
                            <i class="fa-solid fa-bell text-lg"></i>
                            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                        <div class="relative">
                            <button onclick="toggleSystemSwitcher(event)" class="flex items-center gap-2 px-3 py-2 rounded-lg border border-gray-200 bg-white text-sm text-gray-700 hover:bg-gray-50">
                                <span class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold">OP</span>
                                <span>运营管理端</span>
                                <i id="systemSwitcherIcon" class="fa-solid fa-angle-down text-gray-400 text-xs"></i>
                            </button>
                            <div id="systemSwitcherMenu" class="hidden absolute right-0 top-11 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50">
                                <button class="w-full px-4 py-2 text-left text-sm text-gray-700 bg-blue-50 font-medium">
                                    <i class="fa-solid fa-check w-5 text-blue-600"></i>运营管理端
                                </button>
                                <button onclick="switchSystem('../dashboard.html')" class="w-full px-4 py-2 text-left text-sm text-gray-600 hover:bg-gray-50">
                                    <i class="fa-solid fa-building w-5 text-gray-400"></i>企业端
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 页面内容 -->
            <div class="flex-1 overflow-hidden">
                <iframe id="contentFrame" src="home.html" class="w-full h-full border-0"></iframe>
            </div>
        </div>
    </div>

    <script>
        function loadPage(pageName) {
            const iframe = document.getElementById('contentFrame');
            iframe.src = pageName;
            
            // 更新导航状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            const activeItem = document.querySelector(`.nav-item[data-page="${pageName}"]`);
            if (activeItem) activeItem.classList.add('active');
            
            // 更新页面标题
            const titles = {
                'home.html': { title: '仪表盘', subtitle: '欢迎使用运营管理系统' },
                'tenants.html': { title: '租户管理', subtitle: '管理所有租户信息' },
                'subscriptions.html': { title: '订单管理', subtitle: '管理租户订阅套餐' },
                'plans.html': { title: '套餐配置', subtitle: '配置SaaS和订阅版套餐' },
                'add-plan.html': { title: '新增套餐', subtitle: '创建新的套餐配置' },
                'reminders.html': { title: '到期提醒', subtitle: '管理订阅到期提醒' },
                '../help-content-management.html?embed=1&type=operation': { title: '操作说明书', subtitle: '维护前台操作说明书内容' },
                '../help-content-management.html?embed=1&type=policy': { title: '政策法规库', subtitle: '维护政策法规分类、标题和附件' }
            };
            
            if (titles[pageName]) {
                document.getElementById('pageTitle').textContent = titles[pageName].title;
                document.getElementById('pageSubtitle').textContent = titles[pageName].subtitle;
            }
        }

        function toggleKnowledgeMenu() {
            const menu = document.getElementById('knowledgeSubMenu');
            const icon = document.getElementById('knowledgeMenuIcon');
            menu.classList.toggle('hidden');
            icon.classList.toggle('fa-angle-down');
            icon.classList.toggle('fa-angle-right');
        }

        function toggleSystemSwitcher(event) {
            event.stopPropagation();
            const menu = document.getElementById('systemSwitcherMenu');
            const icon = document.getElementById('systemSwitcherIcon');
            menu.classList.toggle('hidden');
            icon.classList.toggle('fa-angle-down');
            icon.classList.toggle('fa-angle-up');
        }

        function switchSystem(url) {
            window.location.href = url;
        }

        document.addEventListener('click', function() {
            const menu = document.getElementById('systemSwitcherMenu');
            const icon = document.getElementById('systemSwitcherIcon');
            if (!menu || menu.classList.contains('hidden')) return;
            menu.classList.add('hidden');
            icon.classList.add('fa-angle-down');
            icon.classList.remove('fa-angle-up');
        });
    </script>
</body>
</html>
