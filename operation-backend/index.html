<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营端管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .nav-item.active {
            background-color: #3b82f6;
            color: white;
        }
        .nav-item.active i, .nav-item.active span {
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- 左侧导航栏 -->
        <div class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-4 border-b border-gray-700 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="flex items-center">
                    <i class="fa-solid fa-building text-blue-400 text-2xl mr-3"></i>
                    <span class="text-xl font-bold">运营管理系统</span>
                </div>
            </div>
            
            <nav class="flex-1 p-3">
                <ul class="space-y-1">
                    <li>
                        <div class="nav-item flex items-center px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" onclick="loadPage('home.html')">
                            <i class="fa-solid fa-chart-pie mr-3"></i>
                            <span>仪表盘</span>
                        </div>
                    </li>
                    <li>
                        <div class="nav-item flex items-center px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" onclick="loadPage('tenants.html')">
                            <i class="fa-solid fa-users mr-3"></i>
                            <span>租户管理</span>
                        </div>
                    </li>
                    <li>
                        <div class="nav-item flex items-center px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" onclick="loadPage('subscriptions.html')">
                            <i class="fa-solid fa-receipt mr-3"></i>
                            <span>订单管理</span>
                        </div>
                    </li>
                    <li>
                        <div class="nav-item flex items-center px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" onclick="loadPage('plans.html')">
                            <i class="fa-solid fa-layer-group mr-3"></i>
                            <span>套餐配置</span>
                        </div>
                    </li>
                    <li>
                        <div class="nav-item flex items-center px-4 py-3 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors" onclick="loadPage('reminders.html')">
                            <i class="fa-solid fa-bell mr-3"></i>
                            <span>到期提醒</span>
                        </div>
                    </li>
                </ul>
            </nav>
            
            <div class="p-4 border-t border-gray-700">
                <div class="flex items-center">
                    <img src="https://picsum.photos/40/40" alt="用户头像" class="w-8 h-8 rounded-full mr-3">
                    <div>
                        <p class="text-sm font-medium">管理员</p>
                        <p class="text-xs text-gray-400">admin@company.com</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 主内容区域 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部工具栏 -->
            <div class="bg-white shadow-sm px-6 py-4">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 id="pageTitle" class="text-xl font-semibold text-gray-800">仪表盘</h1>
                        <p id="pageSubtitle" class="text-sm text-gray-500">欢迎使用运营管理系统</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <input type="text" placeholder="搜索租户..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                        <button class="relative p-2 text-gray-500 hover:text-gray-700">
                            <i class="fa-solid fa-bell text-lg"></i>
                            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 页面内容 -->
            <div class="flex-1 overflow-hidden">
                <iframe id="contentFrame" src="home.html" class="w-full h-full border-0"></iframe>
            </div>
        </div>
    </div>

    <script>
        function loadPage(pageName) {
            const iframe = document.getElementById('contentFrame');
            iframe.src = pageName;
            
            // 更新导航状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // 更新页面标题
            const titles = {
                'home.html': { title: '仪表盘', subtitle: '欢迎使用运营管理系统' },
                'tenants.html': { title: '租户管理', subtitle: '管理所有租户信息' },
                'subscriptions.html': { title: '订单管理', subtitle: '管理租户订阅套餐' },
                'plans.html': { title: '套餐配置', subtitle: '配置SaaS和订阅版套餐' },
                'add-plan.html': { title: '新增套餐', subtitle: '创建新的套餐配置' },
                'reminders.html': { title: '到期提醒', subtitle: '管理订阅到期提醒' }
            };
            
            if (titles[pageName]) {
                document.getElementById('pageTitle').textContent = titles[pageName].title;
                document.getElementById('pageSubtitle').textContent = titles[pageName].subtitle;
            }
        }
    </script>
</body>
</html>
