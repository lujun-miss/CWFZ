<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 p-6">
    <!-- 统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 mb-1">总租户数</p>
                    <p class="text-3xl font-bold text-gray-800">128</p>
                </div>
                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-users text-blue-600"></i>
                </div>
            </div>
            <p class="text-xs text-green-500 mt-3"><i class="fa-solid fa-trend-up mr-1"></i> 本月增长 12%</p>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 mb-1">活跃订阅</p>
                    <p class="text-3xl font-bold text-gray-800">96</p>
                </div>
                <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-receipt text-green-600"></i>
                </div>
            </div>
            <p class="text-xs text-green-500 mt-3"><i class="fa-solid fa-trend-up mr-1"></i> 本月增长 8%</p>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 mb-1">即将到期</p>
                    <p class="text-3xl font-bold text-gray-800">8</p>
                </div>
                <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-clock text-yellow-600"></i>
                </div>
            </div>
            <p class="text-xs text-yellow-500 mt-3"><i class="fa-solid fa-alert-circle mr-1"></i> 需要处理</p>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 mb-1">本月收入</p>
                    <p class="text-3xl font-bold text-gray-800">¥128,600</p>
                </div>
                <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-dollar-sign text-purple-600"></i>
                </div>
            </div>
            <p class="text-xs text-green-500 mt-3"><i class="fa-solid fa-trend-up mr-1"></i> 同比增长 24%</p>
        </div>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 租户增长趋势 -->
        <div class="lg:col-span-2 bg-white rounded-xl shadow-sm p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">租户增长趋势</h3>
            <div class="h-64 flex items-end justify-between px-4">
                <div class="flex flex-col items-center">
                    <div class="w-12 bg-blue-500 rounded-t-lg mb-2" style="height: 80px;"></div>
                    <span class="text-xs text-gray-500">1月</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-12 bg-blue-500 rounded-t-lg mb-2" style="height: 100px;"></div>
                    <span class="text-xs text-gray-500">2月</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-12 bg-blue-500 rounded-t-lg mb-2" style="height: 90px;"></div>
                    <span class="text-xs text-gray-500">3月</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-12 bg-blue-500 rounded-t-lg mb-2" style="height: 120px;"></div>
                    <span class="text-xs text-gray-500">4月</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-12 bg-blue-500 rounded-t-lg mb-2" style="height: 110px;"></div>
                    <span class="text-xs text-gray-500">5月</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-12 bg-green-500 rounded-t-lg mb-2" style="height: 140px;"></div>
                    <span class="text-xs text-gray-500">6月</span>
                </div>
            </div>
        </div>
        
        <!-- 套餐分布 -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">套餐分布</h3>
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-gray-600">SaaS版</span>
                        <span class="text-gray-800 font-medium">68%</span>
                    </div>
                    <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-blue-500 rounded-full" style="width: 68%;"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-gray-600">订阅版</span>
                        <span class="text-gray-800 font-medium">32%</span>
                    </div>
                    <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-green-500 rounded-full" style="width: 32%;"></div>
                    </div>
                </div>
            </div>
            
            <div class="mt-6 pt-6 border-t border-gray-100">
                <h4 class="text-sm font-medium text-gray-700 mb-3">快速操作</h4>
                <div class="space-y-2">
                    <button class="w-full flex items-center justify-center px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">
                        <i class="fa-solid fa-plus mr-2"></i>创建租户
                    </button>
                    <button class="w-full flex items-center justify-center px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                        <i class="fa-solid fa-file-text mr-2"></i>查看报表
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 最近租户 -->
    <div class="mt-6 bg-white rounded-xl shadow-sm p-6">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-gray-800">最近创建的租户</h3>
            <a href="tenants.html" class="text-sm text-blue-600 hover:text-blue-700">查看全部</a>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="border-b border-gray-200">
                        <th class="text-left py-3 px-4 text-sm font-medium text-gray-500">租户名称</th>
                        <th class="text-left py-3 px-4 text-sm font-medium text-gray-500">联系人</th>
                        <th class="text-left py-3 px-4 text-sm font-medium text-gray-500">套餐类型</th>
                        <th class="text-left py-3 px-4 text-sm font-medium text-gray-500">到期日期</th>
                        <th class="text-left py-3 px-4 text-sm font-medium text-gray-500">状态</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="py-3 px-4">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center mr-3">
                                    <i class="fa-solid fa-building text-blue-600"></i>
                                </div>
                                <span class="text-sm font-medium text-gray-800">科技创新有限公司</span>
                            </div>
                        </td>
                        <td class="py-3 px-4 text-sm text-gray-600">张明</td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-1 bg-blue-100 text-blue-600 text-xs rounded-full">SaaS版</span>
                        </td>
                        <td class="py-3 px-4 text-sm text-gray-600">2025-12-31</td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-1 bg-green-100 text-green-600 text-xs rounded-full">正常</span>
                        </td>
                    </tr>
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="py-3 px-4">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center mr-3">
                                    <i class="fa-solid fa-building text-green-600"></i>
                                </div>
                                <span class="text-sm font-medium text-gray-800">智能制造集团</span>
                            </div>
                        </td>
                        <td class="py-3 px-4 text-sm text-gray-600">李华</td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-1 bg-green-100 text-green-600 text-xs rounded-full">订阅版</span>
                        </td>
                        <td class="py-3 px-4 text-sm text-gray-600">2024-09-30</td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-1 bg-yellow-100 text-yellow-600 text-xs rounded-full">即将到期</span>
                        </td>
                    </tr>
                    <tr class="hover:bg-gray-50">
                        <td class="py-3 px-4">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-purple-100 rounded-full flex items-center justify-center mr-3">
                                    <i class="fa-solid fa-building text-purple-600"></i>
                                </div>
                                <span class="text-sm font-medium text-gray-800">生物科技研究院</span>
                            </div>
                        </td>
                        <td class="py-3 px-4 text-sm text-gray-600">王芳</td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-1 bg-blue-100 text-blue-600 text-xs rounded-full">SaaS版</span>
                        </td>
                        <td class="py-3 px-4 text-sm text-gray-600">2026-06-30</td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-1 bg-green-100 text-green-600 text-xs rounded-full">正常</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
