    <!-- 月度长期待摊整合弹窗 -->
    <div id="longTermIntegrateModal" class="modal">
        <div class="modal-content" style="max-width: 550px;">
            <div class="modal-header" style="background-color: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 16px; font-weight: 600; color: #333;">数据整合</h3>
                <button class="close-btn" onclick="closeLongTermIntegrateModal()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #999;">&times;</button>
            </div>
            <div class="modal-body" style="padding: 16px;">
                <div style="margin-bottom: 16px;">
                    <div style="font-size: 13px; color: #666; margin-bottom: 8px;">选择日期范围</div>
                    <input type="month" id="longTermIntegrateMonth" style="width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;" value="2026-04">
                </div>
                
                <div style="margin-bottom: 16px;">
                    <div style="font-size: 13px; color: #666; margin-bottom: 8px;">选择数据源</div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="display: flex; align-items: center; font-size: 13px; color: #333;">
                            <input type="checkbox" checked style="margin-right: 8px;">
                            长期待摊费用基础数据 (long-term-asset-content.html)
                        </label>
                        <label style="display: flex; align-items: center; font-size: 13px; color: #333;">
                            <input type="checkbox" checked style="margin-right: 8px;">
                            项目分配比例数据
                        </label>
                        <label style="display: flex; align-items: center; font-size: 13px; color: #333;">
                            <input type="checkbox" style="margin-right: 8px;">
                            历史分摊记录 (long-term-allocation-content.html)
                        </label>
                    </div>
                </div>
                
                <div style="margin-bottom: 16px;">
                    <div style="font-size: 13px; color: #666; margin-bottom: 8px;">整合选项</div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <label style="display: flex; align-items: center; font-size: 13px; color: #333;">
                            <input type="checkbox" checked style="margin-right: 8px;">
                            自动计算摊销比例
                        </label>
                        <label style="display: flex; align-items: center; font-size: 13px; color: #333;">
                            <input type="checkbox" checked style="margin-right: 8px;">
                            更新现有数据 <span style="color: #999; font-size: 12px;">(已归集数据不可更新)</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="padding: 12px 16px; background-color: #f8f9fa; border-top: 1px solid #dee2e6; display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="closeLongTermIntegrateModal()" style="padding: 6px 16px; border: 1px solid #ddd; border-radius: 4px; background: white; color: #333; cursor: pointer; font-size: 13px;">取消</button>
                <button onclick="executeLongTermIntegrate()" style="padding: 6px 16px; border: none; border-radius: 4px; background: #3b82f6; color: white; cursor: pointer; font-size: 13px;">执行整合</button>
            </div>
        </div>
    </div>
