                    <img src="https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=100&h=100&fit=crop" class="w-8 h-8 rounded-full object-cover ring-2 ring-slate-100 group-hover:ring-blue-100 transition-all">

    <script>
        function switchPage(url, el) {
            document.getElementById('contentFrame').src = url;
            
            // 更新标题
            const title = el.querySelector('span').innerText;
            document.getElementById('pageTitle').innerText = title;

            // 更新导航激活状态
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('active', 'bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-200');
            });
            el.classList.add('active');
        }
    </script>
