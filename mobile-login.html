<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>盯一下 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E88E5',
                        secondary: '#4CAF50',
                        warning: '#FFC107',
                        danger: '#F44336',
                    },
                }
            }
        }
    </script>
    <style>
        @media (max-width: 640px) {
            body {
                font-size: 14px;
            }
        }

        @media (min-width: 641px) {
            .mobile-container {
                width: 480px;
                max-width: 480px;
                margin: 0 auto;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            }
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .mobile-container {
            background-color: white;
            min-height: 100vh;
        }

        .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- 顶部品牌区域 -->
        <div class="bg-gradient-to-br from-blue-500 to-purple-600 px-6 py-12 text-white text-center">
            <div class="mb-6">
                <div class="w-20 h-20 bg-white rounded-2xl mx-auto flex items-center justify-center shadow-lg">
                    <i class="fa fa-clock-o text-4xl text-primary"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold mb-2"></h1>
            <p class="text-blue-100 text-sm">盯一下研发费用报工系统</p>
        </div>

        <!-- 登录表单 -->
        <div class="px-6 py-8">
            <!-- 租户ID选择 -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-medium text-gray-700">租户ID</label>
                    <button type="button" onclick="toggleTenantList()" class="text-sm text-primary hover:underline">
                        <i class="fa fa-exchange mr-1"></i>切换租户
                    </button>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa fa-building text-gray-400"></i>
                    </div>
                    <input
                        type="text"
                        id="tenantId"
                        name="tenantId"
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                        placeholder="请输入或选择租户ID"
                        required
                    >
                </div>
                <!-- 租户列表下拉 -->
                <div id="tenantList" class="hidden mt-2 border border-gray-200 rounded-lg max-h-48 overflow-y-auto">
                    <div class="p-2 hover:bg-gray-50 cursor-pointer text-sm" onclick="selectTenant('T001')">T001 - 好品易链</div>
                    <div class="p-2 hover:bg-gray-50 cursor-pointer text-sm" onclick="selectTenant('T002')">T002 - 测试租户</div>
                    <div class="p-2 hover:bg-gray-50 cursor-pointer text-sm" onclick="selectTenant('T003')">T003 - 开发环境</div>
                </div>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">账号</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa fa-user text-gray-400"></i>
                        </div>
                        <input
                            type="text"
                            id="phone"
                            name="phone"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                            placeholder="请输入账号"
                            required
                        >
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa fa-lock text-gray-400"></i>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                            placeholder="请输入密码"
                            required
                        >
                    </div>
                </div>

                <div class="flex items-center mb-6">
                    <label class="flex items-center">
                        <input type="checkbox" id="rememberPassword" class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                        <span class="ml-2 text-sm text-gray-600">记住密码</span>
                    </label>
                </div>

                <button
                    type="submit"
                    class="login-btn w-full py-3 text-white font-medium rounded-lg transition-all duration-200"
                >
                    登 录
                </button>
            </form>
        </div>
    </div>

    <script>
        // 切换租户列表显示
        function toggleTenantList() {
            const tenantList = document.getElementById('tenantList');
            tenantList.classList.toggle('hidden');
        }

        // 选择租户
        function selectTenant(tenantId) {
            document.getElementById('tenantId').value = tenantId;
            document.getElementById('tenantList').classList.add('hidden');
        }

        // 点击其他地方关闭租户列表
        document.addEventListener('click', function(e) {
            const tenantList = document.getElementById('tenantList');
            const tenantInput = document.getElementById('tenantId');
            if (!tenantInput.contains(e.target) && !tenantList.contains(e.target)) {
                tenantList.classList.add('hidden');
            }
        });

        function handleLogin(event) {
            event.preventDefault();

            const tenantId = document.getElementById('tenantId').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const rememberPassword = document.getElementById('rememberPassword').checked;

            if (!tenantId || !phone || !password) {
                alert('请输入租户ID、账号和密码');
                return;
            }

            // 保存登录信息
            if (rememberPassword) {
                localStorage.setItem('miniprogram_remember_password', 'true');
                localStorage.setItem('miniprogram_user_account', phone);
            } else {
                localStorage.removeItem('miniprogram_remember_password');
                localStorage.removeItem('miniprogram_user_account');
            }

            // 模拟登录
            const loginBtn = event.target.querySelector('button[type="submit"]');
            loginBtn.textContent = '登录中...';
            loginBtn.disabled = true;

            setTimeout(() => {
                // 登录成功，保存登录状态
                localStorage.setItem('miniprogram_logged_in', 'true');
                localStorage.setItem('miniprogram_user_tenant', tenantId);
                localStorage.setItem('miniprogram_user_account', phone);

                // 跳转到工时填报页面
                window.location.href = 'mobile-checkin.html';
            }, 1500);
        }

        // 检查是否已登录
        window.onload = function() {
            const isLoggedIn = localStorage.getItem('miniprogram_logged_in');
            if (isLoggedIn === 'true') {
                // 已登录，直接跳转
                window.location.href = 'mobile-checkin.html';
            }
        };
    </script>
</body>
</html>
