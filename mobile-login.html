<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>研知π - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E88E5',
                        secondary: '#4CAF50',
                        warning: '#FFC107',
                        danger: '#F44336',
                    },
                }
            }
        }
    </script>
    <style>
        @media (max-width: 640px) {
            body {
                font-size: 14px;
            }
        }
        
        @media (min-width: 641px) {
            .mobile-container {
                width: 480px;
                max-width: 480px;
                margin: 0 auto;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            }
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .mobile-container {
            background-color: white;
            min-height: 100vh;
        }
        
        .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- 顶部品牌区域 -->
        <div class="bg-gradient-to-br from-blue-500 to-purple-600 px-6 py-12 text-white text-center">
            <div class="mb-6">
                <div class="w-20 h-20 bg-white rounded-2xl mx-auto flex items-center justify-center shadow-lg">
                    <i class="fa fa-puzzle-piece text-4xl text-primary"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold mb-2">研知π</h1>
            <p class="text-blue-100 text-sm">研发费用管理系统</p>
        </div>
        
        <!-- 登录表单 -->
        <div class="px-6 py-8">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">手机号码</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa fa-mobile text-gray-400"></i>
                        </div>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                            placeholder="请输入手机号码"
                            pattern="^1[3-9]\d{9}$"
                            required
                        >
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa fa-lock text-gray-400"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                            placeholder="请输入密码"
                            required
                        >
                    </div>
                </div>
                
                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                        <span class="ml-2 text-sm text-gray-600">记住手机号</span>
                    </label>
                    <a href="#" class="text-sm text-primary hover:underline">忘记密码？</a>
                </div>
                
                <button 
                    type="submit" 
                    class="login-btn w-full py-3 text-white font-medium rounded-lg transition-all duration-200"
                >
                    登 录
                </button>
            </form>
            
            <!-- 第三方登录 -->
            <div class="mt-8">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-500">其他登录方式</span>
                    </div>
                </div>
                
                <div class="mt-6 flex justify-center space-x-8">
                    <button class="flex flex-col items-center text-gray-500 hover:text-green-500 transition-colors">
                        <div class="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center mb-2">
                            <i class="fa fa-weixin text-white text-xl"></i>
                        </div>
                        <span class="text-xs">微信</span>
                    </button>
                    <button class="flex flex-col items-center text-gray-500 hover:text-blue-500 transition-colors">
                        <div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center mb-2">
                            <i class="fa fa-dingding text-white text-xl"></i>
                        </div>
                        <span class="text-xs">钉钉</span>
                    </button>
                    <button class="flex flex-col items-center text-gray-500 hover:text-red-500 transition-colors">
                        <div class="w-12 h-12 bg-red-500 rounded-full flex items-center justify-center mb-2">
                            <i class="fa fa-mobile text-white text-xl"></i>
                        </div>
                        <span class="text-xs">企业微信</span>
                    </button>
                </div>
            </div>
            
            <!-- 注册链接 -->
            <div class="mt-8 text-center">
                <span class="text-sm text-gray-500">还没有账号？</span>
                <a href="#" class="text-sm text-primary hover:underline ml-1">立即注册</a>
            </div>
        </div>
    </div>
    
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            if (!phone || !password) {
                alert('请输入手机号码和密码');
                return;
            }
            
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert('请输入正确的手机号码');
                return;
            }
            
            // 模拟登录
            const loginBtn = event.target.querySelector('button[type="submit"]');
            loginBtn.textContent = '登录中...';
            loginBtn.disabled = true;
            
            setTimeout(() => {
                // 登录成功，保存登录状态
                localStorage.setItem('miniprogram_logged_in', 'true');
                localStorage.setItem('miniprogram_user_phone', phone);
                
                // 跳转到工时填报页面
                window.location.href = 'mobile-checkin.html';
            }, 1500);
        }
        
        // 检查是否已登录
        window.onload = function() {
            const isLoggedIn = localStorage.getItem('miniprogram_logged_in');
            if (isLoggedIn === 'true') {
                // 已登录，直接跳转
                window.location.href = 'mobile-checkin.html';
            }
        };
    </script>
</body>
</html>
