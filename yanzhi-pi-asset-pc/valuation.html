<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 p-6 min-h-screen">
    <div class="max-w-[1400px] mx-auto">
        <!-- 头部 -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-black text-slate-800">估值与投资回报</h1>
                <p class="text-sm text-slate-400 mt-1">看看您的宝贝资产现在值多少钱，为公司赚了多少钱</p>
            </div>
            <button class="px-6 py-3 bg-emerald-600 text-white rounded-2xl text-xs font-bold shadow-xl">
                重新测算价值
            </button>
        </div>

        <!-- 价值核心 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
            <div class="bg-white p-8 rounded-[32px] border border-slate-100 shadow-sm text-center">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">专家估值 (总身价)</p>
                <h3 class="text-4xl font-black text-slate-800">¥8,520 <span class="text-sm">万</span></h3>
                <p class="text-[10px] text-green-500 font-bold mt-4">比去年增长了 12.4%</p>
            </div>
            <div class="bg-blue-600 p-8 rounded-[32px] text-white shadow-xl text-center">
                <p class="text-[10px] font-bold text-white/60 uppercase mb-2">平均回报率 (ROI)</p>
                <h3 class="text-4xl font-black">240 <span class="text-sm">%</span></h3>
                <p class="text-[10px] text-white/60 mt-4">赚回来的钱是投入成本的 2.4 倍</p>
            </div>
            <div class="bg-white p-8 rounded-[32px] border border-slate-100 shadow-sm text-center">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">市场竞争力评分</p>
                <h3 class="text-4xl font-black text-slate-800">8.5 <span class="text-sm">/ 10</span></h3>
                <p class="text-[10px] text-blue-600 font-bold mt-4">超越了 92% 的同行企业</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- 赚钱能手排行榜 -->
            <div class="bg-white rounded-[32px] p-8 border border-slate-100 shadow-sm">
                <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-6">谁最能赚钱？(资产回报排行)</h3>
                <div class="space-y-6">
                    <div class="p-4 bg-slate-50 rounded-2xl">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-slate-800">智能控制算法软件</span>
                            <span class="text-xs font-black text-blue-600">420% 回报</span>
                        </div>
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full w-[85%]"></div>
                        </div>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-2xl">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-slate-800">边缘计算协议</span>
                            <span class="text-xs font-black text-blue-600">185% 回报</span>
                        </div>
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full w-[45%]"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 运营收益 -->
            <div class="bg-slate-900 rounded-[32px] p-8 text-white">
                <h3 class="text-sm font-black text-blue-400 uppercase tracking-widest mb-6">这些钱是怎么赚回来的？</h3>
                <div class="grid grid-cols-2 gap-8">
                    <div>
                        <p class="text-[10px] text-white/40 font-bold mb-1">技术授权收入</p>
                        <p class="text-xl font-black text-white">¥1,245 万</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-white/40 font-bold mb-1">产品溢价收入</p>
                        <p class="text-xl font-black text-white">¥3,520 万</p>
                    </div>
                    <div class="col-span-2 p-4 bg-white/5 rounded-2xl border border-white/10">
                        <p class="text-[10px] text-white/40 mb-2 font-bold">专家点评：</p>
                        <p class="text-[11px] leading-relaxed text-white/80">
                            您的资产主要通过“产品溢价”变现。建议加大对核心算法的保护，防止竞争对手模仿导致溢价空间缩小。
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
