<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-50 p-6 min-h-screen">
    <!-- 核心：我有多少宝贝 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-widest">我的证书总数</p>
            <div class="flex items-baseline space-x-2">
                <span class="text-3xl font-black text-slate-800">128</span>
                <span class="text-xs text-slate-400">个</span>
            </div>
            <div class="mt-4 flex items-center text-[10px] text-green-500 font-bold">
                <i class="fa fa-arrow-up mr-1"></i> 本月新增 3 个
            </div>
        </div>

        <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-widest">这些宝贝值多少钱</p>
            <div class="flex items-baseline space-x-2">
                <span class="text-3xl font-black text-blue-600">8,520</span>
                <span class="text-xs text-blue-600 font-bold">万元</span>
            </div>
            <div class="mt-4 text-[10px] text-slate-400">
                专家估值：相比成本溢价 198%
            </div>
        </div>

        <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-widest">本月帮我省了多少税</p>
            <div class="flex items-baseline space-x-2">
                <span class="text-3xl font-black text-emerald-600">45.2</span>
                <span class="text-xs text-emerald-600 font-bold">万元</span>
            </div>
            <div class="mt-4 text-[10px] text-slate-400">
                基于加计扣除政策自动测算
            </div>
        </div>

        <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 opacity-5 text-6xl text-orange-500"><i class="fa fa-bell"></i></div>
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-widest">待办小提醒</p>
            <div class="flex items-baseline space-x-2">
                <span class="text-3xl font-black text-orange-500">3</span>
                <span class="text-xs text-orange-500 font-bold">项年费待缴</span>
            </div>
            <div class="mt-4 text-[10px] text-blue-600 font-bold cursor-pointer hover:underline">
                立即处理 <i class="fa fa-chevron-right ml-1"></i>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- 资产价值成长曲线 -->
        <div class="lg:col-span-2 bg-white rounded-[32px] p-8 border border-slate-100 shadow-sm">
            <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-8">我的资产越来越值钱了</h3>
            <div class="h-80">
                <canvas id="growthChart"></canvas>
            </div>
        </div>

        <!-- 资产分类 -->
        <div class="bg-white rounded-[32px] p-8 border border-slate-100 shadow-sm">
            <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-8">资产分布情况</h3>
            <div class="h-64 flex items-center justify-center">
                <canvas id="distChart"></canvas>
            </div>
            <div class="mt-8 space-y-4">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400 font-bold">发明专利</span>
                    <span class="font-black text-slate-800">45%</span>
                </div>
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400 font-bold">软件著作权</span>
                    <span class="font-black text-slate-800">30%</span>
                </div>
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400 font-bold">品牌商标</span>
                    <span class="font-black text-slate-800">25%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const growthCtx = document.getElementById('growthChart').getContext('2d');
        new Chart(growthCtx, {
            type: 'line',
            data: {
                labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
                datasets: [{
                    label: '资产估值',
                    data: [2500, 3800, 5200, 6500, 7800, 8520],
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    fill: true, tension: 0.4, borderWidth: 4
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { display: false }, x: { grid: { display: false } } }
            }
        });

        const distCtx = document.getElementById('distChart').getContext('2d');
        new Chart(distCtx, {
            type: 'doughnut',
            data: {
                labels: ['专利', '软著', '商标'],
                datasets: [{
                    data: [45, 30, 25],
                    backgroundColor: ['#2563eb', '#6366f1', '#a855f7'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                cutout: '80%', plugins: { legend: { display: false } }
            }
        });
    </script>

    <!-- 快捷功能入口 -->
    <div class="mt-8">
        <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-6">快捷操作</h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <a href="archive.html" class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm hover:shadow-lg transition-all cursor-pointer">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-4 text-xl">
                    <i class="fa fa-file-text-o"></i>
                </div>
                <p class="text-sm font-bold text-slate-800">证书管理</p>
                <p class="text-[10px] text-slate-400 mt-1">查看和管理证书</p>
            </a>
            <a href="ownership-change.html" class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm hover:shadow-lg transition-all cursor-pointer">
                <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mb-4 text-xl">
                    <i class="fa fa-exchange"></i>
                </div>
                <p class="text-sm font-bold text-slate-800">权属变更</p>
                <p class="text-[10px] text-slate-400 mt-1">记录资产转让/受让</p>
            </a>
            <a href="asset-inventory.html" class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm hover:shadow-lg transition-all cursor-pointer">
                <div class="w-12 h-12 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center mb-4 text-xl">
                    <i class="fa fa-list-check"></i>
                </div>
                <p class="text-sm font-bold text-slate-800">资产盘点</p>
                <p class="text-[10px] text-slate-400 mt-1">定期盘点资产</p>
            </a>
            <a href="valuation.html" class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm hover:shadow-lg transition-all cursor-pointer">
                <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center mb-4 text-xl">
                    <i class="fa fa-line-chart"></i>
                </div>
                <p class="text-sm font-bold text-slate-800">价值评估</p>
                <p class="text-[10px] text-slate-400 mt-1">测算资产价值</p>
            </a>
            <a href="value-ledger.html" class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm hover:shadow-lg transition-all cursor-pointer">
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mb-4 text-xl">
                    <i class="fa fa-book"></i>
                </div>
                <p class="text-sm font-bold text-slate-800">价值台账</p>
                <p class="text-[10px] text-slate-400 mt-1">历史成本与公允价值</p>
            </a>
            <a href="expense-ledger.html" class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm hover:shadow-lg transition-all cursor-pointer">
                <div class="w-12 h-12 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center mb-4 text-xl">
                    <i class="fa fa-money"></i>
                </div>
                <p class="text-sm font-bold text-slate-800">费用台账</p>
                <p class="text-[10px] text-slate-400 mt-1">记录和统计费用支出</p>
            </a>
        </div>
    </div>
</body>
</html>
