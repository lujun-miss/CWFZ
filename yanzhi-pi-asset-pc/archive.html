<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 p-6 min-h-screen">
    <div class="max-w-[1400px] mx-auto">
        <!-- 头部 -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-black text-slate-800">证书与进度管理</h1>
                <p class="text-sm text-slate-400 mt-1">像管存折一样管理您的专利、商标和版权证书</p>
            </div>
            <div class="bg-orange-50 px-4 py-2 rounded-xl border border-orange-100 flex items-center">
                <i class="fa fa-clock-o text-orange-500 mr-2"></i>
                <span class="text-xs font-bold text-orange-600">有 3 个证书该交年费了，别忘了哦！</span>
            </div>
        </div>

        <!-- 第一部分：正在申请中的 -->
        <div class="bg-white rounded-[32px] p-8 border border-slate-100 shadow-sm mb-8">
            <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-6 flex items-center">
                <i class="fa fa-send-o mr-2 text-blue-600"></i> 正在申请中的宝贝 (进度跟踪)
            </h3>
            <div class="flex items-center justify-between px-10 relative">
                <div class="absolute top-1/2 left-20 right-20 h-0.5 bg-slate-100 -translate-y-1/2 -z-0"></div>
                <div class="absolute top-1/2 left-20 w-1/2 h-0.5 bg-blue-600 -translate-y-1/2 -z-0"></div>
                
                <div class="relative z-10 text-center">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg shadow-blue-100">
                        <i class="fa fa-pencil"></i>
                    </div>
                    <p class="text-[10px] font-bold text-slate-800">写交底书</p>
                </div>
                <div class="relative z-10 text-center">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg shadow-blue-100">
                        <i class="fa fa-send"></i>
                    </div>
                    <p class="text-[10px] font-bold text-slate-800">已经递交</p>
                </div>
                <div class="relative z-10 text-center">
                    <div class="w-10 h-10 bg-white border-4 border-blue-600 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg animate-pulse">
                        <i class="fa fa-search"></i>
                    </div>
                    <p class="text-[10px] font-bold text-blue-600 font-black">正在审查</p>
                </div>
                <div class="relative z-10 text-center opacity-40">
                    <div class="w-10 h-10 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fa fa-check"></i>
                    </div>
                    <p class="text-[10px] font-bold text-slate-400">成功拿证</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- 缴费提醒 -->
            <div class="bg-slate-900 rounded-[32px] p-8 text-white">
                <h3 class="text-xs font-bold uppercase tracking-widest text-orange-400 mb-6">年费提醒 (别让证书失效)</h3>
                <div class="space-y-4">
                    <div class="p-4 bg-white/5 border border-white/10 rounded-2xl flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold">智能控制算法专利</p>
                            <p class="text-[9px] text-red-400 font-bold mt-1">还有 15 天到期</p>
                        </div>
                        <button class="px-3 py-1 bg-blue-600 text-[10px] rounded-lg">去缴费</button>
                    </div>
                    <div class="p-4 bg-white/5 border border-white/10 rounded-2xl flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold">边缘计算协议</p>
                            <p class="text-[9px] text-orange-400 font-bold mt-1">还有 42 天到期</p>
                        </div>
                        <button class="px-3 py-1 bg-white/10 text-[10px] rounded-lg">设提醒</button>
                    </div>
                </div>
            </div>

            <!-- 已经拿到的证书 -->
            <div class="md:col-span-2 bg-white rounded-[32px] p-8 border border-slate-100 shadow-sm">
                <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-6">我已经拿到的证书 (最近更新)</h3>
                <div class="space-y-3">
                    <div class="flex items-center p-4 hover:bg-slate-50 rounded-2xl transition-all border border-transparent hover:border-slate-100">
                        <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mr-4 text-xl">
                            <i class="fa fa-file-text-o"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-bold text-slate-800">一种工业传感器控制算法</p>
                            <p class="text-[10px] text-slate-400">证书号：ZL20241000...</p>
                        </div>
                        <div class="text-right">
                            <span class="px-2 py-1 bg-green-50 text-green-600 text-[10px] font-bold rounded">有效中</span>
                        </div>
                    </div>
                    <div class="flex items-center p-4 hover:bg-slate-50 rounded-2xl transition-all border border-transparent hover:border-slate-100">
                        <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center mr-4 text-xl">
                            <i class="fa fa-code"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-bold text-slate-800">边缘计算网关软件 V2.0</p>
                            <p class="text-[10px] text-slate-400">登记号：2025SR012...</p>
                        </div>
                        <div class="text-right">
                            <span class="px-2 py-1 bg-green-50 text-green-600 text-[10px] font-bold rounded">有效中</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
