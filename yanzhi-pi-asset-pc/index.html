<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研知 π - 您的无形资产小管家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: #f8fafc; overflow: hidden; }
        .sidebar-item { cursor: pointer; transition: all 0.2s; }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .sidebar-item.active { background: #2563eb; color: #fff; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
        .main-container { height: calc(100vh - 64px); }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body class="flex h-screen">
    <!-- 侧边栏 -->
    <aside class="w-64 bg-slate-900 text-slate-400 flex flex-col z-30 shadow-2xl">
        <div class="p-6 flex items-center space-x-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                <i class="fa fa-diamond text-xl"></i>
            </div>
            <div class="flex flex-col">
                <span class="text-xl font-black text-white tracking-tighter">研知 π</span>
                <span class="text-[8px] text-slate-500 uppercase tracking-widest">让资产管理变简单</span>
            </div>
        </div>

        <nav class="flex-1 px-4 space-y-1 overflow-y-auto mt-4">
            <div class="text-[10px] font-bold text-slate-600 uppercase tracking-widest px-4 mb-3">资产管家</div>
            
            <div class="sidebar-item active flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('home.html', this)">
                <i class="fa fa-th-large w-6 text-lg mr-2"></i>
                <span>资产全景图</span>
            </div>
            
            <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('archive.html', this)">
                <i class="fa fa-shield w-6 text-lg mr-2 text-orange-400"></i>
                <span class="text-orange-400">证书与进度管理</span>
            </div>
            
            <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('capitalization.html', this)">
                <i class="fa fa-magic w-6 text-lg mr-2 text-blue-400"></i>
                <span class="text-blue-400">研发账变资产</span>
            </div>
            
            <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('amortization.html', this)">
                <i class="fa fa-calculator w-6 text-lg mr-2 text-indigo-400"></i>
                <span class="text-indigo-400">每月摊销与省税</span>
            </div>

            <div class="mt-8 text-[10px] font-bold text-slate-600 uppercase tracking-widest px-4 mb-3">赚钱与省心</div>
            
            <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('valuation.html', this)">
                <i class="fa fa-line-chart w-6 text-lg mr-2 text-emerald-400"></i>
                <span class="text-emerald-400">估值与投资回报</span>
            </div>
            
            <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('reports.html', this)">
                <i class="fa fa-file-text-o w-6 text-lg mr-2 text-rose-400"></i>
                <span class="text-rose-400">申报与审计助手</span>
            </div>

            <div class="mt-8 text-[10px] font-bold text-slate-600 uppercase tracking-widest px-4 mb-3">台账管理</div>

            <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('ownership-change.html', this)">
                <i class="fa fa-exchange w-6 text-lg mr-2 text-orange-400"></i>
                <span class="text-orange-400">权属变更管理</span>
            </div>

            <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('asset-inventory.html', this)">
                <i class="fa fa-list-check w-6 text-lg mr-2 text-green-400"></i>
                <span class="text-green-400">资产盘点管理</span>
            </div>

            <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('value-ledger.html', this)">
                <i class="fa fa-book w-6 text-lg mr-2 text-amber-400"></i>
                <span class="text-amber-400">价值台账</span>
            </div>

            <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('expense-ledger.html', this)">
                <i class="fa fa-money w-6 text-lg mr-2 text-red-400"></i>
                <span class="text-red-400">费用台账</span>
            </div>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <div class="bg-slate-800/50 rounded-2xl p-4">
                <div class="flex items-center space-x-3 mb-2">
                    <div class="w-8 h-8 bg-blue-600/20 rounded-lg flex items-center justify-center text-blue-500">
                        <i class="fa fa-user-circle-o"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-300">在线帮我操作</span>
                </div>
                <button class="w-full py-2 bg-blue-600 text-white rounded-lg text-[10px] font-bold">立即连线</button>
            </div>
        </div>
    </aside>

    <!-- 右侧内容 -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <h2 id="pageTitle" class="text-lg font-bold text-slate-800">资产全景图</h2>
                <span class="text-slate-300">/</span>
                <span id="breadcrumb" class="text-xs text-slate-400">首页</span>
            </div>
            <div class="flex items-center space-x-3">
                <div class="text-right">
                    <p class="text-sm font-bold text-slate-800">张主管</p>
                    <p class="text-[10px] text-slate-400">欢迎回来！</p>
                </div>
                <div class="w-10 h-10 bg-slate-100 rounded-xl overflow-hidden ring-2 ring-slate-100">
                    <img src="https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=100&h=100&fit=crop" class="w-full h-full object-cover">
                </div>
            </div>
        </header>

        <main class="main-container bg-slate-50 overflow-hidden">
            <iframe id="mainFrame" src="home.html"></iframe>
        </main>
    </div>

    <script>
        function loadPage(url, el) {
            document.getElementById('mainFrame').src = url;
            const title = el.querySelector('span').innerText;
            document.getElementById('pageTitle').innerText = title;
            document.getElementById('breadcrumb').innerText = title;
            document.querySelectorAll('.sidebar-item').forEach(item => { item.classList.remove('active'); });
            el.classList.add('active');
        }
    </script>
</body>
</html>
