<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据备份</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; padding: 24px; }
    </style>
</head>
<body>
    <!-- 操作栏 -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-slate-800">数据备份管理</h2>
            <p class="text-sm text-slate-500 mt-1">管理系统数据备份，支持手动备份和自动备份</p>
        </div>
        <div class="flex items-center space-x-3">
            <button class="bg-green-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-green-600 transition-colors">
                <i class="fa fa-download mr-2"></i> 手动备份
            </button>
            <button class="bg-blue-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-blue-600 transition-colors">
                <i class="fa fa-upload mr-2"></i> 恢复数据
            </button>
        </div>
    </div>

    <!-- 备份设置卡片 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 mb-6">
        <h3 class="font-bold text-slate-800 mb-4 flex items-center">
            <i class="fa fa-cog mr-2 text-blue-500"></i> 备份设置
        </h3>
        <div class="grid grid-cols-3 gap-6">
            <div>
                <label class="block text-sm text-slate-500 mb-2">自动备份频率</label>
                <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                    <option>每天备份</option>
                    <option>每周备份</option>
                    <option>每月备份</option>
                    <option>关闭自动备份</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-500 mb-2">备份时间</label>
                <input type="time" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm" value="02:00">
            </div>
            <div>
                <label class="block text-sm text-slate-500 mb-2">保留备份数量</label>
                <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                    <option>保留最近7份</option>
                    <option>保留最近14份</option>
                    <option>保留最近30份</option>
                    <option>保留所有备份</option>
                </select>
            </div>
        </div>
        <div class="mt-4 flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <input type="checkbox" id="auto-backup" checked class="w-4 h-4 text-blue-500 rounded">
                <label for="auto-backup" class="text-sm text-slate-600">启用自动备份</label>
            </div>
            <div class="flex items-center space-x-2">
                <input type="checkbox" id="backup-notify" checked class="w-4 h-4 text-blue-500 rounded">
                <label for="backup-notify" class="text-sm text-slate-600">备份完成通知</label>
            </div>
        </div>
    </div>

    <!-- 备份历史列表 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
        <div class="p-4 border-b border-slate-100">
            <h3 class="font-bold text-slate-800 flex items-center">
                <i class="fa fa-history mr-2 text-purple-500"></i> 备份历史记录
            </h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="bg-slate-50">
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">备份时间</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">备份类型</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">备份大小</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">状态</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-slate-800">2024-01-15 02:00:00</div>
                            <div class="text-xs text-slate-500">自动备份</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                完整备份
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">128.5 MB</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center">
                                <i class="fa fa-check-circle text-green-500 mr-1"></i>
                                <span class="text-sm text-green-600">成功</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <button class="text-blue-500 hover:text-blue-600 text-sm mr-3">下载</button>
                            <button class="text-slate-500 hover:text-slate-700 text-sm">删除</button>
                        </td>
                    </tr>
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-slate-800">2024-01-14 02:00:00</div>
                            <div class="text-xs text-slate-500">自动备份</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                完整备份
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">125.3 MB</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center">
                                <i class="fa fa-check-circle text-green-500 mr-1"></i>
                                <span class="text-sm text-green-600">成功</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <button class="text-blue-500 hover:text-blue-600 text-sm mr-3">下载</button>
                            <button class="text-slate-500 hover:text-slate-700 text-sm">删除</button>
                        </td>
                    </tr>
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-slate-800">2024-01-13 14:30:00</div>
                            <div class="text-xs text-slate-500">手动备份</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                增量备份
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">45.8 MB</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center">
                                <i class="fa fa-check-circle text-green-500 mr-1"></i>
                                <span class="text-sm text-green-600">成功</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <button class="text-blue-500 hover:text-blue-600 text-sm mr-3">下载</button>
                            <button class="text-slate-500 hover:text-slate-700 text-sm">删除</button>
                        </td>
                    </tr>
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-slate-800">2024-01-12 02:00:00</div>
                            <div class="text-xs text-slate-500">自动备份</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                完整备份
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">122.1 MB</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center">
                                <i class="fa fa-check-circle text-green-500 mr-1"></i>
                                <span class="text-sm text-green-600">成功</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <button class="text-blue-500 hover:text-blue-600 text-sm mr-3">下载</button>
                            <button class="text-red-500 hover:text-red-600 text-sm">删除</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
