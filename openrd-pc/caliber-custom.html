<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义口径</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; padding: 24px; }
    </style>
</head>
<body>
    <!-- 操作栏 -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-4">
            <button class="bg-blue-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-blue-600 transition-colors">
                <i class="fa fa-plus mr-2"></i> 新建自定义口径
            </button>
            <button class="bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-lg flex items-center hover:bg-slate-50 transition-colors">
                <i class="fa fa-save mr-2"></i> 保存配置
            </button>
        </div>
        <div class="flex items-center space-x-2">
            <input type="text" placeholder="搜索口径..." class="px-4 py-2 border border-slate-200 rounded-lg text-sm w-64">
            <button class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg hover:bg-slate-200 transition-colors">
                <i class="fa fa-search"></i>
            </button>
        </div>
    </div>

    <!-- 口径配置区域 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 mb-6">
        <h3 class="font-bold text-slate-800 mb-4">口径配置</h3>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm text-slate-500 mb-2">口径名称</label>
                <input type="text" placeholder="输入口径名称" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm" value="企业内部研发费用口径">
            </div>
            <div>
                <label class="block text-sm text-slate-500 mb-2">口径代码</label>
                <input type="text" placeholder="输入口径代码" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm" value="CUSTOM-001">
            </div>
        </div>

        <div>
            <label class="block text-sm text-slate-500 mb-3">费用类别配置</label>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="flex items-center space-x-3 p-3 bg-slate-50 rounded-lg">
                    <input type="checkbox" checked class="w-4 h-4 text-blue-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-slate-800">人工费用</p>
                        <p class="text-xs text-slate-400">工资、奖金、社保等</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-slate-50 rounded-lg">
                    <input type="checkbox" checked class="w-4 h-4 text-green-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-slate-800">材料费用</p>
                        <p class="text-xs text-slate-400">研发领用原材料</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-slate-50 rounded-lg">
                    <input type="checkbox" checked class="w-4 h-4 text-purple-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-slate-800">设备费用</p>
                        <p class="text-xs text-slate-400">折旧、使用费等</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-slate-50 rounded-lg">
                    <input type="checkbox" class="w-4 h-4 text-amber-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-slate-800">委托外部研发</p>
                        <p class="text-xs text-slate-400">委外研发费用</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-slate-50 rounded-lg">
                    <input type="checkbox" checked class="w-4 h-4 text-cyan-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-slate-800">差旅费</p>
                        <p class="text-xs text-slate-400">研发人员差旅费</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-slate-50 rounded-lg">
                    <input type="checkbox" checked class="w-4 h-4 text-rose-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-slate-800">会议费</p>
                        <p class="text-xs text-slate-400">研发会议费用</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-slate-50 rounded-lg">
                    <input type="checkbox" class="w-4 h-4 text-indigo-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-slate-800">折旧费</p>
                        <p class="text-xs text-slate-400">固定资产折旧</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-slate-50 rounded-lg">
                    <input type="checkbox" checked class="w-4 h-4 text-violet-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-slate-800">其他费用</p>
                        <p class="text-xs text-slate-400">专利申请费等</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-6">
            <label class="block text-sm text-slate-500 mb-3">费用比例限制</label>
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">委托外部研发比例</label>
                    <input type="number" placeholder="100" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm" value="80">
                    <span class="text-xs text-slate-400">%</span>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">其他费用比例</label>
                    <input type="number" placeholder="20" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm" value="10">
                    <span class="text-xs text-slate-400">%</span>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">研发人员比例</label>
                    <input type="number" placeholder="10" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm" value="10">
                    <span class="text-xs text-slate-400">%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 自定义口径列表 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
        <div class="p-4 border-b border-slate-100">
            <h3 class="font-bold text-slate-800">自定义口径列表</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="bg-slate-50">
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">口径名称</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">口径代码</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">包含类别</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">创建时间</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">状态</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4 text-slate-800 font-medium">企业内部研发费用口径</td>
                        <td class="px-6 py-4 text-slate-600">CUSTOM-001</td>
                        <td class="px-6 py-4 text-slate-600">5项</td>
                        <td class="px-6 py-4 text-slate-500 text-sm">2025-05-10</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-green-100 text-green-600 text-xs rounded-full">启用</span>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm mr-2">编辑</button>
                            <button class="text-red-500 hover:text-red-700 text-sm">删除</button>
                        </td>
                    </tr>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4 text-slate-800 font-medium">简化版研发费用口径</td>
                        <td class="px-6 py-4 text-slate-600">CUSTOM-002</td>
                        <td class="px-6 py-4 text-slate-600">3项</td>
                        <td class="px-6 py-4 text-slate-500 text-sm">2025-04-15</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-green-100 text-green-600 text-xs rounded-full">启用</span>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm mr-2">编辑</button>
                            <button class="text-red-500 hover:text-red-700 text-sm">删除</button>
                        </td>
                    </tr>
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 text-slate-800 font-medium">全费用口径</td>
                        <td class="px-6 py-4 text-slate-600">CUSTOM-003</td>
                        <td class="px-6 py-4 text-slate-600">8项</td>
                        <td class="px-6 py-4 text-slate-500 text-sm">2025-03-20</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-slate-100 text-slate-600 text-xs rounded-full">禁用</span>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm mr-2">编辑</button>
                            <button class="text-green-500 hover:text-green-700 text-sm">启用</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="p-4 border-t border-slate-100 flex items-center justify-between">
            <p class="text-sm text-slate-500">共 12 条记录</p>
            <div class="flex items-center space-x-2">
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">上一页</button>
                <button class="px-3 py-1 text-sm bg-blue-500 text-white rounded-lg">1</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">2</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">下一页</button>
            </div>
        </div>
    </div>
</body>
</html>
