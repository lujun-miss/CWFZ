<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研发费用目标规划与工时反算</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* 移除侧边栏相关样式，因为此页面将在iframe中加载 */
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <!-- 主内容区域 -->
    <div class="flex flex-col min-h-screen">
        <!-- 顶部导航栏 -->
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h2 class="text-xl font-semibold text-gray-800">研发费用目标规划与工时反算</h2>
            <div class="relative group">
                <div class="flex items-center cursor-pointer">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff" alt="用户头像" class="w-8 h-8 rounded-full">
                    <span class="ml-2 text-sm font-medium text-gray-700">管理员</span>
                    <i class="fa fa-chevron-down ml-1 text-xs text-gray-500 group-hover:rotate-180 transition-transform duration-200"></i>
                </div>
                <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-20 opacity-0 group-hover:opacity-100 group-hover:visible transition-all duration-200 invisible">
                    <a href="../operation-backend/index.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">运营管理端</a>
                    <a href="../intangible-asset.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">无形资产管理</a>
                    <a href="../openid-system/index.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">OpenID系统</a>
                </div>
            </div>
        </header>

        <!-- 页面内容 -->
        <main class="flex-1 p-6">
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">目标设定</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="targetRnDCost" class="block text-sm font-medium text-gray-700 mb-1">年度研发费用总额 (元)</label>
                        <input type="number" id="targetRnDCost" value="30000000" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">费用构成比例</label>
                        <div class="flex items-center space-x-4">
                            <label for="personnelCostRatio">人员成本:</label>
                            <input type="number" id="personnelCostRatio" value="70" min="0" max="100" class="w-20 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">%
                            <label for="equipmentCostRatio">设备成本:</label>
                            <input type="number" id="equipmentCostRatio" value="30" min="0" max="100" class="w-20 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">%
                        </div>
                        <p class="text-xs text-gray-500 mt-1">请确保人员与设备成本比例之和为 100%</p>
                    </div>
                </div>
                <div class="mt-6 text-right">
                    <button onclick="calculateRnDAllocation()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        <i class="fa fa-calculator mr-2"></i>开始计算与反算
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">项目费用分配策略</h3>
                <div class="mb-4">
                    <label for="projectAllocationMethod" class="block text-sm font-medium text-gray-700 mb-1">分配方式</label>
                    <select id="projectAllocationMethod" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="ratio">按比例分摊</option>
                        <option value="weight">按权重分摊</option>
                        <option value="manual">手动指定金额</option>
                    </select>
                </div>
                <div id="projectAllocationTableContainer" class="overflow-x-auto">
                    <!-- 项目分配表格将在这里动态生成 -->
                    <p class="text-gray-500">选择分配方式后，将在此处配置项目费用分摊。</p>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">工时反算结果与平衡</h3>
                <div id="personnelWorkHourResults" class="mb-6">
                    <h4 class="text-md font-medium text-gray-700 mb-2">人员工时明细</h4>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">员工姓名</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">小时成本</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">年度工时上限</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">项目工时 (反算)</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">总工时 (计算)</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td colspan="6" class="px-6 py-4 text-center text-gray-500">点击“开始计算”以查看结果</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="equipmentWorkHourResults">
                    <h4 class="text-md font-medium text-gray-700 mb-2">设备工时明细</h4>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">设备名称</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">小时成本</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">年度工时上限</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">项目工时 (反算)</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">总工时 (计算)</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td colspan="6" class="px-6 py-4 text-center text-gray-500">点击“开始计算”以查看结果</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="mt-6 text-right">
                    <button onclick="optimizeAllocation()" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                        <i class="fa fa-balance-scale mr-2"></i>优化与平衡工时
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 模拟数据 (实际应用中应从后端获取)
        const mockProjects = [
            { id: 'proj1', name: '智能传感器研发', budget: 10000000 },
            { id: 'proj2', name: '工业机器人控制系统', budget: 15000000 },
            { id: 'proj3', name: '新能源材料研究', budget: 5000000 }
        ];

        const mockPersonnel = [
            { id: 'p1', name: '张三', hourlyCost: 150, annualHourLimit: 1920 },
            { id: 'p2', name: '李四', hourlyCost: 120, annualHourLimit: 1920 },
            { id: 'p3', name: '王五', hourlyCost: 180, annualHourLimit: 1920 }
        ];

        const mockEquipment = [
            { id: 'e1', name: '高精度测试仪', hourlyCost: 80, annualHourLimit: 2000 },
            { id: 'e2', name: '自动化装配线', hourlyCost: 200, annualHourLimit: 3000 }
        ];

        // 动态生成项目分配表格
        function generateProjectAllocationTable() {
            const container = document.getElementById('projectAllocationTableContainer');
            const method = document.getElementById('projectAllocationMethod').value;
            let tableHtml = `
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">项目名称</th>
            `;
            if (method === 'ratio') {
                tableHtml += `
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">人员成本比例 (%)</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">设备成本比例 (%)</th>
                `;
            } else if (method === 'weight') {
                tableHtml += `
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">人员权重</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">设备权重</th>
                `;
            }
            tableHtml += `
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
            `;

            mockProjects.forEach(project => {
                tableHtml += `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${project.name}</td>
                `;
                if (method === 'ratio') {
                    tableHtml += `
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <input type="number" data-project-id="${project.id}" data-type="personnel" value="33.33" min="0" max="100" class="w-24 border border-gray-300 rounded-md p-1 project-ratio-input">%
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <input type="number" data-project-id="${project.id}" data-type="equipment" value="33.33" min="0" max="100" class="w-24 border border-gray-300 rounded-md p-1 project-ratio-input">%
                        </td>
                    `;
                } else if (method === 'weight') {
                    tableHtml += `
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <input type="number" data-project-id="${project.id}" data-type="personnel" value="1" min="0" class="w-24 border border-gray-300 rounded-md p-1 project-weight-input">
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <input type="number" data-project-id="${project.id}" data-type="equipment" value="1" min="0" class="w-24 border border-gray-300 rounded-md p-1 project-weight-input">
                        </td>
                    `;
                } else if (method === 'manual') {
                    tableHtml += `
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <input type="number" data-project-id="${project.id}" data-type="personnel" value="0" min="0" class="w-32 border border-gray-300 rounded-md p-1 project-manual-input">
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <input type="number" data-project-id="${project.id}" data-type="equipment" value="0" min="0" class="w-32 border border-gray-300 rounded-md p-1 project-manual-input">
                        </td>
                    `;
                }
                tableHtml += `
                    </tr>
                `;
            });
            tableHtml += `
                    </tbody>
                </table>
            `;
            container.innerHTML = tableHtml;
        }

        document.addEventListener('DOMContentLoaded', () => {
            generateProjectAllocationTable(); // 初始化项目分配表格
            document.getElementById('projectAllocationMethod').addEventListener('change', generateProjectAllocationTable);
            calculateRnDAllocation(); // 在页面加载时自动计算并显示结果
        });

        function calculateRnDAllocation() {
            const targetRnDCost = parseFloat(document.getElementById('targetRnDCost').value);
            const personnelCostRatio = parseFloat(document.getElementById('personnelCostRatio').value) / 100;
            const equipmentCostRatio = parseFloat(document.getElementById('equipmentCostRatio').value) / 100;

            if (isNaN(targetRnDCost) || targetRnDCost <= 0) {
                return;
            }
            if (isNaN(personnelCostRatio) || isNaN(equipmentCostRatio) || Math.abs(personnelCostRatio + equipmentCostRatio - 1) > 0.001) { // 增加浮点数容错
                return;
            }

            const targetPersonnelCost = targetRnDCost * personnelCostRatio;
            const targetEquipmentCost = targetRnDCost * equipmentCostRatio;

            // 获取项目分配策略和数据
            const projectAllocationMethod = document.getElementById('projectAllocationMethod').value;
            let projectPersonnelCosts = {};
            let projectEquipmentCosts = {};

            if (projectAllocationMethod === 'ratio') {
                let totalPersonnelRatio = 0;
                let totalEquipmentRatio = 0;
                document.querySelectorAll('.project-ratio-input[data-type="personnel"]').forEach(input => totalPersonnelRatio += parseFloat(input.value) || 0);
                document.querySelectorAll('.project-ratio-input[data-type="equipment"]').forEach(input => totalEquipmentRatio += parseFloat(input.value) || 0);

                if (Math.abs(totalPersonnelRatio - 100) > 0.01 || Math.abs(totalEquipmentRatio - 100) > 0.01) {
                    return;
                }

                mockProjects.forEach(project => {
                    const personnelRatio = parseFloat(document.querySelector(`.project-ratio-input[data-project-id="${project.id}"][data-type="personnel"]`).value) / 100 || 0;
                    const equipmentRatio = parseFloat(document.querySelector(`.project-ratio-input[data-project-id="${project.id}"][data-type="equipment"]`).value) / 100 || 0;
                    projectPersonnelCosts[project.id] = targetPersonnelCost * personnelRatio;
                    projectEquipmentCosts[project.id] = targetEquipmentCost * equipmentRatio;
                });
            } else if (projectAllocationMethod === 'weight') {
                let totalPersonnelWeight = 0;
                let totalEquipmentWeight = 0;
                document.querySelectorAll('.project-weight-input[data-type="personnel"]').forEach(input => totalPersonnelWeight += parseFloat(input.value) || 0);
                document.querySelectorAll('.project-weight-input[data-type="equipment"]').forEach(input => totalEquipmentWeight += parseFloat(input.value) || 0);

                mockProjects.forEach(project => {
                    const personnelWeight = parseFloat(document.querySelector(`.project-weight-input[data-project-id="${project.id}"][data-type="personnel"]`).value) || 0;
                    const equipmentWeight = parseFloat(document.querySelector(`.project-weight-input[data-project-id="${project.id}"][data-type="equipment"]`).value) || 0;
                    projectPersonnelCosts[project.id] = totalPersonnelWeight > 0 ? (targetPersonnelCost * (personnelWeight / totalPersonnelWeight)) : 0;
                    projectEquipmentCosts[project.id] = totalEquipmentWeight > 0 ? (targetEquipmentCost * (equipmentWeight / totalEquipmentWeight)) : 0;
                });
            } else if (projectAllocationMethod === 'manual') {
                mockProjects.forEach(project => {
                    projectPersonnelCosts[project.id] = parseFloat(document.querySelector(`.project-manual-input[data-project-id="${project.id}"][data-type="personnel"]`).value) || 0;
                    projectEquipmentCosts[project.id] = parseFloat(document.querySelector(`.project-manual-input[data-project-id="${project.id}"][data-type="equipment"]`).value) || 0;
                });
                // 验证手动输入的总额是否与目标一致 (简化处理，实际需要更复杂的校验和提示)
                const sumManualPersonnelCost = Object.values(projectPersonnelCosts).reduce((sum, cost) => sum + cost, 0);
                const sumManualEquipmentCost = Object.values(projectEquipmentCosts).reduce((sum, cost) => sum + cost, 0);
                if (Math.abs(sumManualPersonnelCost - targetPersonnelCost) > 1 || Math.abs(sumManualEquipmentCost - targetEquipmentCost) > 1) {
                    return;
                }
            }

            // 反算人员工时
            let personnelWorkHourDetails = {}; // { pId: { totalHours: X, projects: { projId: hours } } }
            mockPersonnel.forEach(person => {
                personnelWorkHourDetails[person.id] = { totalHours: 0, projects: {} };
                mockProjects.forEach(project => {
                    personnelWorkHourDetails[person.id].projects[project.id] = 0; // Initialize project hours
                });
            });

            // 计算所有人员的总小时成本（用于按比例分配项目人员成本）
            const totalPersonnelHourlyCost = mockPersonnel.reduce((sum, person) => sum + person.hourlyCost, 0);

            // 分配每个项目的总人员成本到具体人员
            mockProjects.forEach(project => {
                const projectCost = projectPersonnelCosts[project.id];
                if (projectCost > 0 && totalPersonnelHourlyCost > 0) {
                    mockPersonnel.forEach(person => {
                        if (person.hourlyCost > 0) {
                            // 按人员的小时成本比例分摊该项目的总人员成本
                            const personShareOfProjectCost = projectCost * (person.hourlyCost / totalPersonnelHourlyCost);
                            const hoursForProject = personShareOfProjectCost / person.hourlyCost;
                            personnelWorkHourDetails[person.id].projects[project.id] += hoursForProject;
                        }
                    });
                }
            });

            // 计算每个人员的总工时
            mockPersonnel.forEach(person => {
                let totalHoursForPerson = 0;
                for (const projId in personnelWorkHourDetails[person.id].projects) {
                    totalHoursForPerson += personnelWorkHourDetails[person.id].projects[projId];
                }
                personnelWorkHourDetails[person.id].totalHours = totalHoursForPerson;
            });


            // 反算设备工时
            let equipmentWorkHourDetails = {}; // { eId: { totalHours: X, projects: { projId: hours } } }
            mockEquipment.forEach(equipment => {
                equipmentWorkHourDetails[equipment.id] = { totalHours: 0, projects: {} };
                mockProjects.forEach(project => {
                    equipmentWorkHourDetails[equipment.id].projects[project.id] = 0; // Initialize project hours
                });
            });

            // 计算所有设备的总小时成本（用于按比例分配项目设备成本）
            const totalEquipmentHourlyCost = mockEquipment.reduce((sum, equipment) => sum + equipment.hourlyCost, 0);

            // 分配每个项目的总设备成本到具体设备
            mockProjects.forEach(project => {
                const projectCost = projectEquipmentCosts[project.id];
                if (projectCost > 0 && totalEquipmentHourlyCost > 0) {
                    mockEquipment.forEach(equipment => {
                        if (equipment.hourlyCost > 0) {
                            // 按设备的小时成本比例分摊该项目的总设备成本
                            const equipmentShareOfProjectCost = projectCost * (equipment.hourlyCost / totalEquipmentHourlyCost);
                            const hoursForProject = equipmentShareOfProjectCost / equipment.hourlyCost;
                            equipmentWorkHourDetails[equipment.id].projects[project.id] += hoursForProject;
                        }
                    });
                }
            });

            // 计算每个设备的总工时
            mockEquipment.forEach(equipment => {
                let totalHoursForEquipment = 0;
                for (const projId in equipmentWorkHourDetails[equipment.id].projects) {
                    totalHoursForEquipment += equipmentWorkHourDetails[equipment.id].projects[projId];
                }
                equipmentWorkHourDetails[equipment.id].totalHours = totalHoursForEquipment;
            });

            renderPersonnelWorkHourResults(personnelWorkHourDetails);
            renderEquipmentWorkHourResults(equipmentWorkHourDetails);
        }

        function renderPersonnelWorkHourResults(details) {
            const tbody = document.querySelector('#personnelWorkHourResults tbody');
            let allRowsHtml = ''; // 用于累积所有行HTML

            if (Object.keys(details).length === 0) {
                allRowsHtml = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">暂无人员工时数据</td></tr>';
            } else {
                mockPersonnel.forEach(person => {
                    const totalHours = details[person.id].totalHours;
                    const status = totalHours > person.annualHourLimit ? '<span class="text-red-600">超额</span>' : '<span class="text-green-600">正常</span>';
                    let projectHoursHtml = '';
                    mockProjects.forEach(project => {
                        projectHoursHtml += `
                            <div class="flex justify-between items-center text-xs">
                                <span>${project.name}:</span>
                                <input type="number" value="${(details[person.id].projects[project.id] || 0).toFixed(2)}" class="w-20 border border-gray-300 rounded-md p-0.5 text-right project-hour-input" data-person-id="${person.id}" data-project-id="${project.id}">小时
                            </div>
                        `;
                    });

                    allRowsHtml += `
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${person.name}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${person.hourlyCost} 元/小时</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${person.annualHourLimit} 小时</td>
                            <td class="px-6 py-4 text-sm text-gray-500">
                                ${projectHoursHtml}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-bold total-person-hours" data-person-id="${person.id}">${totalHours.toFixed(2)} 小时</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${status}</td>
                        </tr>
                    `;
                });
            }
            tbody.innerHTML = allRowsHtml; // 一次性更新 tbody
            addHourInputListeners('person');
        }

        function renderEquipmentWorkHourResults(details) {
            const tbody = document.querySelector('#equipmentWorkHourResults tbody');
            let allRowsHtml = ''; // 用于累积所有行HTML

            if (Object.keys(details).length === 0) {
                allRowsHtml = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">暂无设备工时数据</td></tr>';
            } else {
                mockEquipment.forEach(equipment => {
                    const totalHours = details[equipment.id].totalHours;
                    const status = totalHours > equipment.annualHourLimit ? '<span class="text-red-600">超额</span>' : '<span class="text-green-600">正常</span>';
                    let projectHoursHtml = '';
                    mockProjects.forEach(project => {
                        projectHoursHtml += `
                            <div class="flex justify-between items-center text-xs">
                                <span>${project.name}:</span>
                                <input type="number" value="${(details[equipment.id].projects[project.id] || 0).toFixed(2)}" class="w-20 border border-gray-300 rounded-md p-0.5 text-right project-hour-input" data-equipment-id="${equipment.id}" data-project-id="${project.id}">小时
                            </div>
                        `;
                    });

                    allRowsHtml += `
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${equipment.name}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${equipment.hourlyCost} 元/小时</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${equipment.annualHourLimit} 小时</td>
                            <td class="px-6 py-4 text-sm text-gray-500">
                                ${projectHoursHtml}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-bold total-equipment-hours" data-equipment-id="${equipment.id}">${totalHours.toFixed(2)} 小时</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${status}</td>
                        </tr>
                    `;
                });
            }
            tbody.innerHTML = allRowsHtml; // 一次性更新 tbody
            addHourInputListeners('equipment');
        }

        // 监听工时输入框的变化，实时更新总工时和状态
        function addHourInputListeners(type) {
            document.querySelectorAll(`.project-hour-input[data-${type}-id]`).forEach(input => {
                input.addEventListener('change', (event) => {
                    const id = event.target.dataset[`${type}Id`];
                    let total = 0;
                    document.querySelectorAll(`.project-hour-input[data-${type}-id="${id}"]`).forEach(hourInput => {
                        total += parseFloat(hourInput.value) || 0;
                    });
                    
                    const totalHoursSpan = document.querySelector(`.total-${type}-hours[data-${type}-id="${id}"]`);
                    totalHoursSpan.textContent = `${total.toFixed(2)} 小时`;

                    // 获取并更新状态
                    let limit;
                    if (type === 'person') {
                        limit = mockPersonnel.find(p => p.id === id).annualHourLimit;
                    } else if (type === 'equipment') {
                        limit = mockEquipment.find(e => e.id === id).annualHourLimit;
                    }
                    
                    const statusCell = totalHoursSpan.closest('tr').querySelector('td:last-child');
                    if (total > limit) {
                        statusCell.innerHTML = '<span class="text-red-600">超额</span>';
                    } else {
                        statusCell.innerHTML = '<span class="text-green-600">正常</span>';
                    }
                });
            });
        }

        function optimizeAllocation() {
            let optimized = false;

            // 优化人员工时
            mockPersonnel.forEach(person => {
                const totalHoursSpan = document.querySelector(`.total-person-hours[data-person-id="${person.id}"]`);
                const currentTotalHours = parseFloat(totalHoursSpan.textContent) || 0;
                const annualLimit = person.annualHourLimit;

                if (currentTotalHours > annualLimit) {
                    const reductionFactor = annualLimit / currentTotalHours;
                    document.querySelectorAll(`.project-hour-input[data-person-id="${person.id}"]`).forEach(input => {
                        const newHours = parseFloat(input.value) * reductionFactor;
                        input.value = newHours.toFixed(2);
                        input.dispatchEvent(new Event('change')); // Trigger change to update totals and status
                    });
                    optimized = true;
                }
            });

            // 优化设备工时
            mockEquipment.forEach(equipment => {
                const totalHoursSpan = document.querySelector(`.total-equipment-hours[data-equipment-id="${equipment.id}"]`);
                const currentTotalHours = parseFloat(totalHoursSpan.textContent) || 0;
                const annualLimit = equipment.annualHourLimit;

                if (currentTotalHours > annualLimit) {
                    const reductionFactor = annualLimit / currentTotalHours;
                    document.querySelectorAll(`.project-hour-input[data-equipment-id="${equipment.id}"]`).forEach(input => {
                        const newHours = parseFloat(input.value) * reductionFactor;
                        input.value = newHours.toFixed(2);
                        input.dispatchEvent(new Event('change')); // Trigger change to update totals and status
                    });
                    optimized = true;
                }
            });

            if (optimized) {
                // alert('已对超额工时进行了初步优化，请检查调整后的结果！'); // 移除提示框
            } else {
                // alert('当前没有需要优化的超额工时。'); // 移除提示框
            }
        }

    </script>
</body>
