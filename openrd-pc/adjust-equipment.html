<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备工时调整</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; padding: 24px; }
        .adjust-input { width: 80px; text-align: center; }
    </style>
</head>
<body>
    <!-- 操作栏 -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-4">
            <select class="px-4 py-2 border border-slate-200 rounded-lg text-sm">
                <option>2025年5月</option>
                <option>2025年4月</option>
            </select>
            <button class="bg-green-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-green-600 transition-colors">
                <i class="fa fa-save mr-2"></i> 保存调整
            </button>
            <button class="bg-amber-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-amber-600 transition-colors">
                <i class="fa fa-refresh mr-2"></i> 重置
            </button>
        </div>
        <div class="flex items-center space-x-2">
            <input type="text" placeholder="搜索设备..." class="px-4 py-2 border border-slate-200 rounded-lg text-sm w-64">
            <button class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg hover:bg-slate-200 transition-colors">
                <i class="fa fa-search"></i>
            </button>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="grid grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">本月设备工时</p>
            <p class="text-xl font-bold text-slate-800 mt-1">8,432小时</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">设备数量</p>
            <p class="text-xl font-bold text-green-600 mt-1">128台</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">设备费用</p>
            <p class="text-xl font-bold text-blue-600 mt-1">¥156,789</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">已调整记录</p>
            <p class="text-xl font-bold text-purple-600 mt-1">8条</p>
        </div>
    </div>

    <!-- 设备工时调整 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
            <h3 class="font-bold text-slate-800">设备工时调整</h3>
            <div class="flex items-center space-x-2">
                <button class="px-3 py-1 text-sm bg-blue-50 text-blue-600 rounded-lg">全部</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-50 rounded-lg">运行中</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-50 rounded-lg">空闲</button>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="bg-slate-50">
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">设备名称</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">设备编号</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">类型</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">状态</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">原始工时</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">调整工时</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">差异</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">项目绑定</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center">
                                    <i class="fa fa-server text-blue-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">CNC加工中心</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">EQ-001</td>
                        <td class="px-6 py-4 text-slate-600">加工设备</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-green-100 text-green-600 text-xs rounded-full">运行中</span>
                        </td>
                        <td class="px-6 py-4 text-slate-800">384小时</td>
                        <td class="px-6 py-4">
                            <input type="number" class="adjust-input px-2 py-1 border border-blue-300 rounded text-sm bg-blue-50" value="384">
                        </td>
                        <td class="px-6 py-4 text-slate-500">0</td>
                        <td class="px-6 py-4">
                            <select class="px-2 py-1 border border-slate-200 rounded text-xs">
                                <option>智能传感器研发</option>
                                <option>物联网平台开发</option>
                                <option>多个项目</option>
                            </select>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">绑定明细</button>
                        </td>
                    </tr>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-purple-100 rounded-lg flex items-center justify-center">
                                    <i class="fa fa-cog text-purple-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">3D打印机</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">EQ-023</td>
                        <td class="px-6 py-4 text-slate-600">打印设备</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-green-100 text-green-600 text-xs rounded-full">运行中</span>
                        </td>
                        <td class="px-6 py-4 text-slate-800">256小时</td>
                        <td class="px-6 py-4">
                            <input type="number" class="adjust-input px-2 py-1 border border-blue-300 rounded text-sm bg-blue-50" value="280">
                        </td>
                        <td class="px-6 py-4 text-green-600">+24</td>
                        <td class="px-6 py-4">
                            <select class="px-2 py-1 border border-slate-200 rounded text-xs">
                                <option>物联网平台开发</option>
                                <option>智能传感器研发</option>
                                <option>多个项目</option>
                            </select>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">绑定明细</button>
                        </td>
                    </tr>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-amber-100 rounded-lg flex items-center justify-center">
                                    <i class="fa fa-desktop text-amber-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">测试服务器</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">EQ-056</td>
                        <td class="px-6 py-4 text-slate-600">IT设备</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-amber-100 text-amber-600 text-xs rounded-full">空闲</span>
                        </td>
                        <td class="px-6 py-4 text-slate-800">128小时</td>
                        <td class="px-6 py-4">
                            <input type="number" class="adjust-input px-2 py-1 border border-red-300 rounded text-sm bg-red-50" value="96">
                        </td>
                        <td class="px-6 py-4 text-red-600">-32</td>
                        <td class="px-6 py-4">
                            <select class="px-2 py-1 border border-slate-200 rounded text-xs">
                                <option>新能源电池研发</option>
                                <option>智能传感器研发</option>
                                <option>多个项目</option>
                            </select>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">绑定明细</button>
                        </td>
                    </tr>
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-slate-100 rounded-lg flex items-center justify-center">
                                    <i class="fa fa-laptop text-slate-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">研发电脑-015</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">EQ-089</td>
                        <td class="px-6 py-4 text-slate-600">办公设备</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-slate-100 text-slate-600 text-xs rounded-full">离线</span>
                        </td>
                        <td class="px-6 py-4 text-slate-800">0小时</td>
                        <td class="px-6 py-4">
                            <input type="number" class="adjust-input px-2 py-1 border border-slate-200 rounded text-sm" value="0" disabled>
                        </td>
                        <td class="px-6 py-4 text-slate-500">0</td>
                        <td class="px-6 py-4 text-slate-400">-</td>
                        <td class="px-6 py-4">
                            <button class="text-slate-400 text-sm" disabled>绑定明细</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="p-4 border-t border-slate-100 flex items-center justify-between">
            <p class="text-sm text-slate-500">共 128 条记录</p>
            <div class="flex items-center space-x-2">
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">上一页</button>
                <button class="px-3 py-1 text-sm bg-blue-500 text-white rounded-lg">1</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">2</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">3</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">下一页</button>
            </div>
        </div>
    </div>
</body>
</html>
