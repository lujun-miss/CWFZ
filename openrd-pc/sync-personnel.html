<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员同步</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; padding: 24px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-active { background: #22c55e; }
        .status-inactive { background: #9ca3af; }
    </style>
</head>
<body>
    <!-- 操作栏 -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-4">
            <button class="bg-blue-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-blue-600 transition-colors">
                <i class="fa fa-refresh mr-2"></i> 同步数据
            </button>
            <button class="bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-lg flex items-center hover:bg-slate-50 transition-colors">
                <i class="fa fa-download mr-2"></i> 导出
            </button>
        </div>
        <div class="flex items-center space-x-2">
            <input type="text" placeholder="搜索人员..." class="px-4 py-2 border border-slate-200 rounded-lg text-sm w-64">
            <button class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg hover:bg-slate-200 transition-colors">
                <i class="fa fa-search"></i>
            </button>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="grid grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">总人数</p>
            <p class="text-xl font-bold text-slate-800 mt-1">256</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">研发人员</p>
            <p class="text-xl font-bold text-green-600 mt-1">156</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">本月新增</p>
            <p class="text-xl font-bold text-blue-600 mt-1">8</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">待审核</p>
            <p class="text-xl font-bold text-amber-600 mt-1">3</p>
        </div>
    </div>

    <!-- 人员列表 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
            <h3 class="font-bold text-slate-800">人员列表</h3>
            <div class="flex items-center space-x-2">
                <button class="px-3 py-1 text-sm bg-blue-50 text-blue-600 rounded-lg">全部</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-50 rounded-lg">研发人员</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-50 rounded-lg">非研发人员</button>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="bg-slate-50">
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">姓名</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">工号</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">部门</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">岗位</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">属性</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">状态</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">同步时间</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                                    <i class="fa fa-user text-blue-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">张三</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">300903</td>
                        <td class="px-6 py-4 text-slate-600">研发一部</td>
                        <td class="px-6 py-4 text-slate-600">高级工程师</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-green-100 text-green-600 text-xs rounded-full">研发人员</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="flex items-center space-x-1">
                                <span class="status-dot status-active"></span>
                                <span class="text-slate-600 text-sm">在职</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 text-slate-500 text-sm">2025-05-10 10:30</td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">编辑</button>
                        </td>
                    </tr>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-purple-100 rounded-full flex items-center justify-center">
                                    <i class="fa fa-user text-purple-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">李四</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">301354</td>
                        <td class="px-6 py-4 text-slate-600">研发二部</td>
                        <td class="px-6 py-4 text-slate-600">工程师</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-green-100 text-green-600 text-xs rounded-full">研发人员</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="flex items-center space-x-1">
                                <span class="status-dot status-active"></span>
                                <span class="text-slate-600 text-sm">在职</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 text-slate-500 text-sm">2025-05-10 10:30</td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">编辑</button>
                        </td>
                    </tr>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-amber-100 rounded-full flex items-center justify-center">
                                    <i class="fa fa-user text-amber-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">王五</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">302456</td>
                        <td class="px-6 py-4 text-slate-600">财务部</td>
                        <td class="px-6 py-4 text-slate-600">会计</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-slate-100 text-slate-600 text-xs rounded-full">非研发人员</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="flex items-center space-x-1">
                                <span class="status-dot status-active"></span>
                                <span class="text-slate-600 text-sm">在职</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 text-slate-500 text-sm">2025-05-10 10:30</td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">编辑</button>
                        </td>
                    </tr>
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center">
                                    <i class="fa fa-user text-red-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">赵六</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">303678</td>
                        <td class="px-6 py-4 text-slate-600">研发一部</td>
                        <td class="px-6 py-4 text-slate-600">测试工程师</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-green-100 text-green-600 text-xs rounded-full">研发人员</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="flex items-center space-x-1">
                                <span class="status-dot status-inactive"></span>
                                <span class="text-slate-600 text-sm">离职</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 text-slate-500 text-sm">2025-05-08 14:20</td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">编辑</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="p-4 border-t border-slate-100 flex items-center justify-between">
            <p class="text-sm text-slate-500">共 256 条记录</p>
            <div class="flex items-center space-x-2">
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">上一页</button>
                <button class="px-3 py-1 text-sm bg-blue-500 text-white rounded-lg">1</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">2</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">3</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">下一页</button>
            </div>
        </div>
    </div>
</body>
</html>
