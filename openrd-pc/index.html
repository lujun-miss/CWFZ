<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>openRD研发费用管理服务系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .sidebar-item { cursor: pointer; transition: all 0.3s; }
        .sidebar-item:hover { background: rgba(37, 99, 235, 0.1); color: #2563eb; }
        .sidebar-item.active { background: #2563eb; color: #fff; }
        iframe { width: 100%; height: calc(100vh - 64px); border: none; }
        .main-container { height: calc(100vh - 64px); }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-slate-50">
    <!-- 侧边栏 -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
        <!-- Logo区域 -->
        <div class="p-6 border-b border-slate-200">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fa fa-flask text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800">openRD</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest">研发费用管理系统</p>
                </div>
            </div>
        </div>

        <!-- 导航菜单 -->
        <nav class="flex-1 p-4 overflow-y-auto">
            <!-- 首页 -->
            <div class="sidebar-item active flex items-center px-4 py-3 rounded-xl text-sm font-medium" onclick="loadPage('home.html', this)">
                <i class="fa fa-home w-5 mr-3"></i>
                <span>首页仪表盘</span>
            </div>

            <!-- 基础数据同步 -->
            <div class="mt-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-4 mb-2">基础数据同步</p>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('sync-personnel.html', this)">
                    <i class="fa fa-users w-5 mr-3 text-blue-500"></i>
                    <span>人员同步</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('sync-attendance.html', this)">
                    <i class="fa fa-clock-o w-5 mr-3 text-green-500"></i>
                    <span>考勤同步</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('sync-work-hour.html', this)">
                    <i class="fa fa-calendar-check-o w-5 mr-3 text-teal-500"></i>
                    <span>打卡工时同步</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('sync-equipment.html', this)">
                    <i class="fa fa-server w-5 mr-3 text-purple-500"></i>
                    <span>设备同步</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('sync-project.html', this)">
                    <i class="fa fa-folder w-5 mr-3 text-orange-500"></i>
                    <span>项目同步</span>
                </div>
            </div>

            <!-- 费用调整 -->
            <div class="mt-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-4 mb-2">费用调整</p>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('adjust-labor.html', this)">
                    <i class="fa fa-user-circle w-5 mr-3 text-cyan-500"></i>
                    <span>人工费用调整</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('adjust-material.html', this)">
                    <i class="fa fa-box w-5 mr-3 text-pink-500"></i>
                    <span>领料费用调整</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('adjust-equipment.html', this)">
                    <i class="fa fa-cog w-5 mr-3 text-indigo-500"></i>
                    <span>设备工时调整</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('adjust-other.html', this)">
                    <i class="fa fa-plus-circle w-5 mr-3 text-rose-500"></i>
                    <span>其他费用调整</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('adjust-cross-period.html', this)">
                    <i class="fa fa-refresh w-5 mr-3 text-amber-500"></i>
                    <span>跨期成本分摊</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('adjust-history-backfill.html', this)">
                    <i class="fa fa-history w-5 mr-3 text-rose-500"></i>
                    <span>历史费用补录</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('adjust-person-project-time.html', this)">
                    <i class="fa fa-sitemap w-5 mr-3 text-indigo-500"></i>
                    <span>人员项目时间关联</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('rnd-cost-planning.html', this)">
                    <i class="fa fa-money w-5 mr-3 text-blue-500"></i>
                    <span>研发费用目标规划</span>
                </div>
            </div>

            <!-- 费用归集 -->
            <div class="mt-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-4 mb-2">费用归集</p>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('allocate-cost.html', this)">
                    <i class="fa fa-calculator w-5 mr-3 text-emerald-500"></i>
                    <span>八大费用归集</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('allocate-oneclick.html', this)">
                    <i class="fa fa-magic w-5 mr-3 text-violet-500"></i>
                    <span>一键重新归集</span>
                </div>
            </div>



            <!-- 口径管理 -->
            <div class="mt-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-4 mb-2">口径管理</p>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('caliber-template.html', this)">
                    <i class="fa fa-file-text-o w-5 mr-3 text-blue-500"></i>
                    <span>预置口径模板</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('caliber-custom.html', this)">
                    <i class="fa fa-sliders w-5 mr-3 text-green-500"></i>
                    <span>自定义口径</span>
                </div>
            </div>

            <!-- 报表中心 -->
            <div class="mt-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-4 mb-2">报表中心</p>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('report-detail.html', this)">
                    <i class="fa fa-list w-5 mr-3 text-orange-500"></i>
                    <span>费用明细表</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('report-compare.html', this)">
                    <i class="fa fa-bar-chart w-5 mr-3 text-purple-500"></i>
                    <span>多口径对比报表</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('report-audit.html', this)">
                    <i class="fa fa-file-pdf-o w-5 mr-3 text-red-500"></i>
                    <span>审计报告</span>
                </div>
            </div>

            <!-- 系统设置 -->
            <div class="mt-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-4 mb-2">系统设置</p>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('settings-sync.html', this)">
                    <i class="fa fa-refresh w-5 mr-3 text-cyan-500"></i>
                    <span>同步设置</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('settings-config.html', this)">
                    <i class="fa fa-wrench w-5 mr-3 text-purple-500"></i>
                    <span>系统配置</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('settings-allocation.html', this)">
                    <i class="fa fa-sliders w-5 mr-3 text-green-500"></i>
                    <span>分摊规则配置</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('settings-log.html', this)">
                    <i class="fa fa-file-text-o w-5 mr-3 text-amber-500"></i>
                    <span>日志管理</span>
                </div>
                <div class="sidebar-item flex items-center px-4 py-3 rounded-xl text-sm font-medium text-slate-600" onclick="loadPage('settings-backup.html', this)">
                    <i class="fa fa-database w-5 mr-3 text-indigo-500"></i>
                    <span>数据备份</span>
                </div>
            </div>
        </nav>

        <!-- 用户信息 -->
        <div class="p-4 border-t border-slate-200">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center text-white text-xs">
                    <i class="fa fa-user"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-800">张主管</p>
                    <p class="text-[10px] text-slate-400">财务管理员</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <div class="flex-1 flex flex-col">
        <!-- 顶部导航 -->
        <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between">
            <div>
                <h2 id="pageTitle" class="text-lg font-bold text-slate-800">首页仪表盘</h2>
            </div>
            <div class="flex items-center space-x-4">
                <button class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                    <i class="fa fa-bell text-slate-500"></i>
                </button>
                <button class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                    <i class="fa fa-search text-slate-500"></i>
                </button>
            </div>
        </header>

        <!-- 内容区域 -->
        <main class="main-container overflow-hidden">
            <iframe id="mainFrame" src="home.html"></iframe>
        </main>
    </div>

    <script>
        function loadPage(url, el) {
            document.getElementById('mainFrame').src = url;
            const title = el.querySelector('span').innerText;
            document.getElementById('pageTitle').innerText = title;
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('active');
            });
            el.classList.add('active');
        }
    </script>
</body>
</html>
