<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人工费用调整</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; padding: 24px; }
        .adjust-input { width: 80px; text-align: center; }
    </style>
</head>
<body>
    <!-- 操作栏 -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-4">
            <select class="px-4 py-2 border border-slate-200 rounded-lg text-sm">
                <option>2025年5月</option>
                <option>2025年4月</option>
            </select>
            <button class="bg-green-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-green-600 transition-colors">
                <i class="fa fa-save mr-2"></i> 保存调整
            </button>
            <button class="bg-amber-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-amber-600 transition-colors">
                <i class="fa fa-refresh mr-2"></i> 重置
            </button>
        </div>
        <div class="flex items-center space-x-2">
            <input type="text" placeholder="搜索员工..." class="px-4 py-2 border border-slate-200 rounded-lg text-sm w-64">
            <button class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg hover:bg-slate-200 transition-colors">
                <i class="fa fa-search"></i>
            </button>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="grid grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">本月人工费用</p>
            <p class="text-xl font-bold text-slate-800 mt-1">¥1,234,567</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">研发人员数</p>
            <p class="text-xl font-bold text-green-600 mt-1">156人</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">总工时</p>
            <p class="text-xl font-bold text-blue-600 mt-1">24,960小时</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-100">
            <p class="text-slate-400 text-sm">已调整记录</p>
            <p class="text-xl font-bold text-purple-600 mt-1">23条</p>
        </div>
    </div>

    <!-- 人员工时调整 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
            <h3 class="font-bold text-slate-800">人员工时分配调整</h3>
            <div class="flex items-center space-x-2">
                <button class="px-3 py-1 text-sm bg-blue-50 text-blue-600 rounded-lg">全部</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-50 rounded-lg">已调整</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-50 rounded-lg">未调整</button>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="bg-slate-50">
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">姓名</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">工号</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">部门</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">原始工时</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">调整工时</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">差异</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">项目分配</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                                    <i class="fa fa-user text-blue-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">张三</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">300903</td>
                        <td class="px-6 py-4 text-slate-600">研发一部</td>
                        <td class="px-6 py-4 text-slate-800">160小时</td>
                        <td class="px-6 py-4">
                            <input type="number" class="adjust-input px-2 py-1 border border-blue-300 rounded text-sm bg-blue-50" value="160">
                        </td>
                        <td class="px-6 py-4 text-slate-500">0</td>
                        <td class="px-6 py-4">
                            <select class="px-2 py-1 border border-slate-200 rounded text-xs">
                                <option>智能传感器研发(100%)</option>
                                <option>物联网平台开发(100%)</option>
                                <option>多个项目分配</option>
                            </select>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">分配明细</button>
                        </td>
                    </tr>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-purple-100 rounded-full flex items-center justify-center">
                                    <i class="fa fa-user text-purple-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">李四</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">301354</td>
                        <td class="px-6 py-4 text-slate-600">研发二部</td>
                        <td class="px-6 py-4 text-slate-800">154小时</td>
                        <td class="px-6 py-4">
                            <input type="number" class="adjust-input px-2 py-1 border border-blue-300 rounded text-sm bg-blue-50" value="160">
                        </td>
                        <td class="px-6 py-4 text-green-600">+6</td>
                        <td class="px-6 py-4">
                            <select class="px-2 py-1 border border-slate-200 rounded text-xs">
                                <option>物联网平台开发(100%)</option>
                                <option>智能传感器研发(100%)</option>
                                <option>多个项目分配</option>
                            </select>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">分配明细</button>
                        </td>
                    </tr>
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-amber-100 rounded-full flex items-center justify-center">
                                    <i class="fa fa-user text-amber-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">王五</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">302456</td>
                        <td class="px-6 py-4 text-slate-600">研发一部</td>
                        <td class="px-6 py-4 text-slate-800">168小时</td>
                        <td class="px-6 py-4">
                            <input type="number" class="adjust-input px-2 py-1 border border-red-300 rounded text-sm bg-red-50" value="158">
                        </td>
                        <td class="px-6 py-4 text-red-600">-10</td>
                        <td class="px-6 py-4">
                            <select class="px-2 py-1 border border-slate-200 rounded text-xs">
                                <option>智能传感器研发(60%)+物联网(40%)</option>
                                <option>智能传感器研发(100%)</option>
                                <option>物联网平台开发(100%)</option>
                            </select>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">分配明细</button>
                        </td>
                    </tr>
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center">
                                    <i class="fa fa-user text-green-500"></i>
                                </div>
                                <span class="font-medium text-slate-800">赵六</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-600">303678</td>
                        <td class="px-6 py-4 text-slate-600">研发二部</td>
                        <td class="px-6 py-4 text-slate-800">140小时</td>
                        <td class="px-6 py-4">
                            <input type="number" class="adjust-input px-2 py-1 border border-blue-300 rounded text-sm bg-blue-50" value="140">
                        </td>
                        <td class="px-6 py-4 text-slate-500">0</td>
                        <td class="px-6 py-4">
                            <select class="px-2 py-1 border border-slate-200 rounded text-xs">
                                <option>新能源电池研发(100%)</option>
                                <option>智能传感器研发(100%)</option>
                                <option>多个项目分配</option>
                            </select>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-500 hover:text-blue-700 text-sm">分配明细</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="p-4 border-t border-slate-100 flex items-center justify-between">
            <p class="text-sm text-slate-500">共 156 条记录</p>
            <div class="flex items-center space-x-2">
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">上一页</button>
                <button class="px-3 py-1 text-sm bg-blue-500 text-white rounded-lg">1</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">2</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">3</button>
                <button class="px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">下一页</button>
            </div>
        </div>
    </div>
</body>
</html>
