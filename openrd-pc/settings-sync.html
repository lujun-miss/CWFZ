<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同步设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; padding: 24px; }
        .btn-action { position: relative; overflow: hidden; transition: all 0.2s; }
        .btn-action:active { transform: scale(0.98); }
        .btn-action.loading { pointer-events: none; opacity: 0.7; }
        .btn-action.loading::after { content: ''; position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .card-hover { transition: all 0.3s; cursor: pointer; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .checkbox-custom { width: 18px; height: 18px; border: 2px solid #cbd5e1; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .checkbox-custom.checked { background: #3b82f6; border-color: #3b82f6; }
        .checkbox-custom.checked::after { content: ''; width: 8px; height: 4px; border-left: 2px solid white; border-bottom: 2px solid white; transform: rotate(-45deg); }
        .sync-item { transition: all 0.2s; }
        .sync-item:hover { transform: scale(1.02); }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; color: white; font-size: 14px; z-index: 9999; transform: translateX(120%); transition: transform 0.3s ease; display: flex; align-items: center; }
        .toast.show { transform: translateX(0); }
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9998; opacity: 0; visibility: hidden; transition: all 0.3s; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal { background: white; border-radius: 16px; padding: 32px; width: 400px; transform: scale(0.9); transition: transform 0.3s; }
        .modal-overlay.show .modal { transform: scale(1); }
        .modal-title { font-size: 18px; font-weight: bold; color: #1e293b; margin-bottom: 20px; }
        .modal-body { margin-bottom: 24px; }
        .modal-btn-group { display: flex; justify-content: flex-end; gap: 12px; }
        .btn-modal-cancel { padding: 8px 20px; border: 1px solid #e2e8f0; border-radius: 8px; color: #64748b; cursor: pointer; }
        .btn-modal-confirm { padding: 8px 20px; background: #3b82f6; color: white; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title" id="modalTitle">确认操作</div>
            <div class="modal-body" id="modalBody">确定要执行此操作吗？</div>
            <div class="modal-btn-group">
                <button class="btn-modal-cancel" onclick="closeModal()">取消</button>
                <button class="btn-modal-confirm" id="modalConfirm">确定</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="syncModalOverlay">
        <div class="modal" style="width: 500px;">
            <div class="modal-title">立即同步</div>
            <div class="modal-body">
                <div class="text-slate-600 mb-4">正在执行数据同步，请稍候...</div>
                <div class="space-y-3">
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-slate-500">人员数据同步</span>
                        <span id="syncStep1" class="text-blue-500"><i class="fa fa-spinner fa-spin"></i></span>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-slate-500">考勤数据同步</span>
                        <span id="syncStep2" class="text-slate-400">-</span>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-slate-500">设备数据同步</span>
                        <span id="syncStep3" class="text-slate-400">-</span>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-slate-500">项目数据同步</span>
                        <span id="syncStep4" class="text-slate-400">-</span>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-slate-500">数据校验</span>
                        <span id="syncStep5" class="text-slate-400">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-4">
            <button class="btn-action bg-blue-500 text-white px-4 py-2 rounded-lg flex items-center" onclick="saveConfig()">
                <i class="fa fa-save mr-2"></i> 保存配置
            </button>
            <button class="btn-action bg-green-500 text-white px-4 py-2 rounded-lg flex items-center" onclick="startSync()">
                <i class="fa fa-refresh mr-2"></i> 立即同步
            </button>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-6 mb-6">
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 card-hover">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa fa-database mr-2 text-blue-500"></i> 对内系统数据源
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-500 mb-2">系统地址</label>
                    <input type="text" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="http://192.168.1.100:8080/api">
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">API Token</label>
                    <input type="text" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="***token***">
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">连接状态</label>
                    <div class="flex items-center space-x-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        <span class="text-green-600 text-sm">已连接</span>
                    </div>
                </div>
                <button class="btn-action w-full bg-slate-100 text-slate-600 py-2 rounded-lg hover:bg-slate-200 transition-colors" onclick="testConnection()">
                    <i class="fa fa-wifi mr-2"></i> 测试连接
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 card-hover">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa fa-sliders mr-2 text-green-500"></i> 同步规则设置
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-500 mb-2">同步频率</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>实时同步</option>
                        <option>每30分钟</option>
                        <option>每小时</option>
                        <option>每天</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">同步方向</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>单向同步（对内→对外）</option>
                        <option>双向同步</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">冲突处理策略</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>保留对外系统数据</option>
                        <option>覆盖对外系统数据</option>
                        <option>手动处理冲突</option>
                    </select>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="checkbox-custom checked" onclick="toggleSyncDelete()"></div>
                    <label class="text-sm text-slate-600">同步删除操作</label>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
        <div class="p-4 border-b border-slate-100">
            <h3 class="font-bold text-slate-800 flex items-center">
                <i class="fa fa-list-check mr-2 text-purple-500"></i> 同步项目配置
            </h3>
        </div>
        <div class="p-4">
            <div class="grid grid-cols-4 gap-4">
                <div class="sync-item flex items-center space-x-3 p-3 bg-blue-50 rounded-lg cursor-pointer" onclick="toggleSyncItem(this)">
                    <div class="checkbox-custom checked"></div>
                    <div>
                        <p class="text-sm font-medium text-blue-800">人员数据</p>
                        <p class="text-xs text-blue-600">包含员工信息</p>
                    </div>
                </div>
                <div class="sync-item flex items-center space-x-3 p-3 bg-green-50 rounded-lg cursor-pointer" onclick="toggleSyncItem(this)">
                    <div class="checkbox-custom checked"></div>
                    <div>
                        <p class="text-sm font-medium text-green-800">考勤数据</p>
                        <p class="text-xs text-green-600">包含打卡记录</p>
                    </div>
                </div>
                <div class="sync-item flex items-center space-x-3 p-3 bg-purple-50 rounded-lg cursor-pointer" onclick="toggleSyncItem(this)">
                    <div class="checkbox-custom checked"></div>
                    <div>
                        <p class="text-sm font-medium text-purple-800">设备数据</p>
                        <p class="text-xs text-purple-600">包含设备信息</p>
                    </div>
                </div>
                <div class="sync-item flex items-center space-x-3 p-3 bg-orange-50 rounded-lg cursor-pointer" onclick="toggleSyncItem(this)">
                    <div class="checkbox-custom checked"></div>
                    <div>
                        <p class="text-sm font-medium text-orange-800">项目数据</p>
                        <p class="text-xs text-orange-600">包含项目信息</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast toast-${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function showModal(title, body, onConfirm) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').textContent = body;
            document.getElementById('modalOverlay').classList.add('show');
            document.getElementById('modalConfirm').onclick = () => {
                onConfirm();
                closeModal();
            };
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function saveConfig() {
            const btn = event.currentTarget;
            btn.classList.add('loading');
            setTimeout(() => {
                btn.classList.remove('loading');
                showToast('配置保存成功', 'success');
            }, 1000);
        }

        function startSync() {
            document.getElementById('syncModalOverlay').classList.add('show');
            
            const steps = ['syncStep1', 'syncStep2', 'syncStep3', 'syncStep4', 'syncStep5'];
            let current = 0;
            
            const interval = setInterval(() => {
                if (current >= steps.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('syncModalOverlay').classList.remove('show');
                        showToast('数据同步完成', 'success');
                    }, 500);
                    return;
                }
                
                document.getElementById(steps[current]).innerHTML = '<i class="fa fa-check text-green-500"></i>';
                
                if (current + 1 < steps.length) {
                    document.getElementById(steps[current + 1]).innerHTML = '<i class="fa fa-spinner fa-spin text-blue-500"></i>';
                }
                
                current++;
            }, 500);
        }

        function testConnection() {
            const btn = event.currentTarget;
            btn.classList.add('loading');
            setTimeout(() => {
                btn.classList.remove('loading');
                showToast('连接测试成功', 'success');
            }, 1500);
        }

        function toggleSyncDelete() {
            const checkbox = document.querySelector('.checkbox-custom');
            checkbox.classList.toggle('checked');
            showToast(checkbox.classList.contains('checked') ? '已开启同步删除' : '已关闭同步删除', 'info');
        }

        function toggleSyncItem(el) {
            const checkbox = el.querySelector('.checkbox-custom');
            checkbox.classList.toggle('checked');
            const name = el.querySelector('.text-sm').textContent;
            showToast(checkbox.classList.contains('checked') ? `${name}已启用` : `${name}已禁用`, 'info');
        }
    </script>
</body>
</html>
