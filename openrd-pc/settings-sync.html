<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同步设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; padding: 24px; }
    </style>
</head>
<body>
    <!-- 操作栏 -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-4">
            <button class="bg-blue-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-blue-600 transition-colors">
                <i class="fa fa-save mr-2"></i> 保存配置
            </button>
            <button class="bg-green-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-green-600 transition-colors">
                <i class="fa fa-refresh mr-2"></i> 立即同步
            </button>
        </div>
    </div>

    <!-- 同步配置卡片 -->
    <div class="grid grid-cols-2 gap-6 mb-6">
        <!-- 数据源配置 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa fa-database mr-2 text-blue-500"></i> 对内系统数据源
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-500 mb-2">系统地址</label>
                    <input type="text" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm" value="http://192.168.1.100:8080/api">
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">API Token</label>
                    <input type="text" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm" value="***token***">
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">连接状态</label>
                    <div class="flex items-center space-x-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        <span class="text-green-600 text-sm">已连接</span>
                    </div>
                </div>
                <button class="w-full bg-slate-100 text-slate-600 py-2 rounded-lg hover:bg-slate-200 transition-colors">
                    测试连接
                </button>
            </div>
        </div>

        <!-- 同步规则 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa fa-sliders mr-2 text-green-500"></i> 同步规则设置
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-500 mb-2">同步频率</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                        <option>实时同步</option>
                        <option>每30分钟</option>
                        <option>每小时</option>
                        <option>每天</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">同步方向</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                        <option>单向同步（对内→对外）</option>
                        <option>双向同步</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">冲突处理策略</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                        <option>保留对外系统数据</option>
                        <option>覆盖对外系统数据</option>
                        <option>手动处理冲突</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="sync-delete" class="w-4 h-4 text-blue-500 rounded">
                    <label for="sync-delete" class="text-sm text-slate-600">同步删除操作</label>
                </div>
            </div>
        </div>
    </div>

    <!-- 同步项目配置 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
        <div class="p-4 border-b border-slate-100">
            <h3 class="font-bold text-slate-800 flex items-center">
                <i class="fa fa-list-check mr-2 text-purple-500"></i> 同步项目配置
            </h3>
        </div>
        <div class="p-4">
            <div class="grid grid-cols-4 gap-4">
                <div class="flex items-center space-x-3 p-3 bg-blue-50 rounded-lg">
                    <input type="checkbox" checked class="w-4 h-4 text-blue-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-blue-800">人员数据</p>
                        <p class="text-xs text-blue-600">包含员工信息</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-green-50 rounded-lg">
                    <input type="checkbox" checked class="w-4 h-4 text-green-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-green-800">考勤数据</p>
                        <p class="text-xs text-green-600">包含打卡记录</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-purple-50 rounded-lg">
                    <input type="checkbox" checked class="w-4 h-4 text-purple-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-purple-800">设备数据</p>
                        <p class="text-xs text-purple-600">包含设备信息</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-orange-50 rounded-lg">
                    <input type="checkbox" checked class="w-4 h-4 text-orange-500 rounded">
                    <div>
                        <p class="text-sm font-medium text-orange-800">项目数据</p>
                        <p class="text-xs text-orange-600">包含项目信息</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
