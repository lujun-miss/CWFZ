<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; padding: 24px; }
    </style>
</head>
<body>
    <!-- 操作栏 -->
    <div class="flex items-center justify-end mb-6">
        <button class="bg-blue-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-blue-600 transition-colors">
            <i class="fa fa-save mr-2"></i> 保存配置
        </button>
    </div>

    <!-- 配置卡片 -->
    <div class="grid grid-cols-2 gap-6 mb-6">
        <!-- 数据同步配置 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa fa-refresh mr-2 text-blue-500"></i> 数据同步配置
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-500 mb-2">同步频率</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                        <option>实时同步</option>
                        <option>每小时同步</option>
                        <option>每天同步</option>
                        <option>手动同步</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">同步时间</label>
                    <input type="time" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm" value="02:00">
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="sync-all" checked class="w-4 h-4 text-blue-500 rounded">
                    <label for="sync-all" class="text-sm text-slate-600">启用自动同步</label>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="sync-notify" checked class="w-4 h-4 text-blue-500 rounded">
                    <label for="sync-notify" class="text-sm text-slate-600">同步完成通知</label>
                </div>
            </div>
        </div>

        <!-- 费用归集配置 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa fa-calculator mr-2 text-green-500"></i> 费用归集配置
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-500 mb-2">默认口径</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                        <option>高新技术企业认定口径</option>
                        <option>研发费用加计扣除口径</option>
                        <option>IPO审计口径</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">跨期分摊规则</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                        <option>按工时比例分摊</option>
                        <option>按人员比例分摊</option>
                        <option>按项目阶段分摊</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="auto-allocate" checked class="w-4 h-4 text-green-500 rounded">
                    <label for="auto-allocate" class="text-sm text-slate-600">自动归集费用</label>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="adjust-trace" checked class="w-4 h-4 text-green-500 rounded">
                    <label for="adjust-trace" class="text-sm text-slate-600">记录调整痕迹</label>
                </div>
            </div>
        </div>
    </div>

    <!-- 其他配置 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
        <div class="p-4 border-b border-slate-100">
            <h3 class="font-bold text-slate-800 flex items-center">
                <i class="fa fa-wrench mr-2 text-purple-500"></i> 其他配置
            </h3>
        </div>
        <div class="p-6">
            <div class="grid grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm text-slate-500 mb-2">系统主题</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                        <option>亮色主题</option>
                        <option>暗色主题</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">语言设置</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                        <option>简体中文</option>
                        <option>English</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-2">日期格式</label>
                    <select class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm">
                        <option>YYYY-MM-DD</option>
                        <option>DD/MM/YYYY</option>
                        <option>MM/DD/YYYY</option>
                    </select>
                </div>
            </div>
            <div class="mt-6 pt-6 border-t border-slate-100">
                <h4 class="font-medium text-slate-700 mb-4">通知设置</h4>
                <div class="grid grid-cols-3 gap-4">
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="notify-email" checked class="w-4 h-4 text-blue-500 rounded">
                        <label for="notify-email" class="text-sm text-slate-600">邮件通知</label>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="notify-sms" class="w-4 h-4 text-blue-500 rounded">
                        <label for="notify-sms" class="text-sm text-slate-600">短信通知</label>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="notify-system" checked class="w-4 h-4 text-blue-500 rounded">
                        <label for="notify-system" class="text-sm text-slate-600">系统通知</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
