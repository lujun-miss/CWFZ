<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>领料单导入与分配 - 研知π</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        accent: '#6366f1',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        info: '#3b82f6',
                        light: '#f3f4f6',
                        dark: '#1f2937'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-item-active {
                @apply bg-primary text-white;
            }
            .nav-item-hover {
                @apply hover:bg-blue-100 transition-colors duration-200;
            }
        }
    </style>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .btn-primary {
            @apply bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-600 transition-colors;
        }
        .btn-secondary {
            @apply bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition-colors;
        }
        .btn-success {
            @apply bg-secondary text-white px-4 py-2 rounded-md hover:bg-green-600 transition-colors;
        }
        .parent-iframe .left-sidebar,
        .parent-iframe .page-header,
        .parent-iframe header {
            display: none !important;
        }
        .parent-iframe body {
            padding: 0 !important;
            background-color: transparent !important;
        }
    </style>
</head>
<body class="bg-gray-50 p-6">
    <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-semibold text-gray-800">领料单导入与分配</h2>
                <p class="text-sm text-gray-500 mt-1">导入原始领料单，自动识别研发物料并分配到对应项目</p>
            </div>
            <button class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition-colors" onclick="goBack()">
                <i class="fa fa-arrow-left mr-1"></i>返回
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2">
                <div class="bg-gray-50 rounded-lg p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-medium text-gray-800">步骤1：导入原始领料单</h3>
                        <div class="flex items-center space-x-2">
                            <button class="bg-primary text-white px-3 py-1 rounded text-sm hover:bg-blue-600" onclick="document.getElementById('importFile').click()">
                                <i class="fa fa-upload mr-1"></i>选择文件
                            </button>
                            <button class="bg-secondary text-white px-3 py-1 rounded text-sm hover:bg-green-600" onclick="loadSampleData()">
                                <i class="fa fa-file-text-o mr-1"></i>加载示例数据
                            </button>
                        </div>
                        <input type="file" id="importFile" class="hidden" accept=".xlsx,.xls" onchange="handleFileSelect(event)">
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-100">
                                <tr>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"><input type="checkbox" onchange="toggleSelectAll(this)"></th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">物料编码</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">物料名称</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">规格型号</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">单位</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">数量</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">单价</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">是否研发</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">分配项目</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">领用单价</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">备注</th>
                                </tr>
                            </thead>
                            <tbody id="importTableBody">
                                <tr class="text-center">
                                    <td colspan="11" class="py-8 text-gray-400">
                                        <i class="fa fa-upload text-4xl mb-2"></i>
                                        <p>点击上方按钮导入Excel文件或加载示例数据</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-4 p-3 bg-blue-50 border border-blue-100 rounded-md">
                        <div class="flex items-start">
                            <i class="fa fa-info-circle text-blue-600 mt-0.5 mr-2"></i>
                            <div class="text-xs text-blue-700">
                                <p><strong>说明：</strong>原始领料单可能包含多个项目的物料，系统会自动识别研发物料（绿色标记），非研发物料默认不选中。可勾选需要的物料并分配到对应项目。</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-end space-x-2">
                    <button class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300" onclick="clearAll()">
                        <i class="fa fa-trash mr-1"></i>清空数据
                    </button>
                    <button class="bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-600" onclick="batchAssignProject()">
                        <i class="fa fa-users mr-1"></i>批量分配项目
                    </button>
                    <button class="bg-secondary text-white px-4 py-2 rounded-md hover:bg-green-600" onclick="generateRequisitions()">
                        <i class="fa fa-file-text-o mr-1"></i>生成领料单
                    </button>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-gray-50 rounded-lg p-6">
                    <h3 class="text-lg font-medium text-gray-800 mb-4">步骤2：项目分配概览</h3>
                    <div id="projectOverview">
                        <p class="text-sm text-gray-500 text-center py-4">导入数据后，将按项目分组显示分配情况</p>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-lg p-6">
                    <h3 class="text-lg font-medium text-gray-800 mb-4">批量分配</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">选择项目</label>
                            <select id="batchProject" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                                <option value="">请选择项目</option>
                                <option value="proj1">智能传感器研发</option>
                                <option value="proj2">工业机器人控制系统</option>
                                <option value="proj3">新能源材料研究</option>
                            </select>
                        </div>
                        <button class="w-full bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-600 transition-colors" onclick="batchAssignProject()">
                            将选中物料分配到此项目
                        </button>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-lg p-6">
                    <h3 class="text-lg font-medium text-gray-800 mb-4">统计信息</h3>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-600">总物料数：</span>
                            <span class="font-medium" id="totalCount">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">研发物料数：</span>
                            <span class="font-medium text-green-600" id="rdCount">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">已分配项目：</span>
                            <span class="font-medium text-primary" id="assignedCount">0</span>
                        </div>
                        <div class="flex justify-between text-lg pt-2 border-t">
                            <span class="text-gray-800 font-medium">总金额：</span>
                            <span class="font-bold text-primary" id="totalAmount">¥0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="resultModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 class="text-lg font-medium text-gray-800">生成结果</h3>
                <button class="text-gray-400 hover:text-gray-600" onclick="closeResultModal()">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="p-6">
                <div id="resultContent"></div>
                <div class="flex justify-end space-x-2 mt-4">
                    <button class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300" onclick="closeResultModal()">关闭</button>
                    <button class="bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-600" onclick="closeResultModal(); goBack();">返回列表</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (window.self !== window.parent) {
            document.body.classList.add('parent-iframe');
        }

        function goBack() {
            if (window.self !== window.parent) {
                window.location.href = 'project-material-content.html';
            } else {
                window.location.href = 'project-material.html';
            }
        }

        function loadSampleData() {
            var sampleData = [
                { code: 'TL001', name: '天然橡胶', spec: 'SBR-1502', unit: 'kg', quantity: 500, price: 18.50, isRd: true },
                { code: 'TL002', name: '合成橡胶', spec: 'BR-9000', unit: 'kg', quantity: 300, price: 22.30, isRd: true },
                { code: 'TL003', name: '炭黑', spec: 'N330', unit: 'kg', quantity: 200, price: 8.50, isRd: true },
                { code: 'TL004', name: '钢丝', spec: '1.5mm', unit: 'kg', quantity: 150, price: 5.20, isRd: false },
                { code: 'TL005', name: '助剂A', spec: 'ZA-2', unit: 'kg', quantity: 50, price: 120.00, isRd: true },
                { code: 'TL006', name: '包装材料', spec: '纸箱', unit: '个', quantity: 100, price: 5.00, isRd: false },
                { code: 'TL007', name: '硫化剂', spec: 'DCP', unit: 'kg', quantity: 30, price: 85.00, isRd: true },
                { code: 'TL008', name: '防老剂', spec: 'RD', unit: 'kg', quantity: 25, price: 150.00, isRd: true },
                { code: 'TL009', name: '补强剂', spec: 'Si-69', unit: 'kg', quantity: 40, price: 200.00, isRd: true },
                { code: 'TL010', name: '耐磨剂', spec: 'HM-100', unit: 'kg', quantity: 35, price: 180.00, isRd: true },
            ];
            renderImportTable(sampleData);
        }

        function handleFileSelect(event) {
            var file = event.target.files[0];
            if (!file) return;
            loadSampleData();
        }

        function renderImportTable(data) {
            var html = '';
            data.forEach(function(item, index) {
                var rowClass = item.isRd ? '' : 'bg-gray-50 opacity-60';
                var rdIcon = item.isRd 
                    ? '<span class="text-green-600"><i class="fa fa-check-circle"></i></span>' 
                    : '<span class="text-gray-400"><i class="fa fa-times-circle"></i></span>';
                
                html += '<tr class="' + rowClass + '">' +
                    '<td class="px-4 py-3"><input type="checkbox" class="import-checkbox" ' + (item.isRd ? 'checked' : '') + '></td>' +
                    '<td class="px-4 py-3 text-sm">' + item.code + '</td>' +
                    '<td class="px-4 py-3 text-sm">' + item.name + '</td>' +
                    '<td class="px-4 py-3 text-sm">' + item.spec + '</td>' +
                    '<td class="px-4 py-3 text-sm">' + item.unit + '</td>' +
                    '<td class="px-4 py-3 text-sm">' + item.quantity + '</td>' +
                    '<td class="px-4 py-3 text-sm">¥' + item.price + '</td>' +
                    '<td class="px-4 py-3 text-sm text-center">' + rdIcon + '</td>' +
                    '<td class="px-4 py-3">' +
                    '<select class="w-full border border-gray-300 rounded px-2 py-1 text-sm project-select">' +
                    '<option value="">请选择</option>' +
                    '<option value="proj1">智能传感器研发</option>' +
                    '<option value="proj2">工业机器人控制系统</option>' +
                    '<option value="proj3">新能源材料研究</option>' +
                    '</select></td>' +
                    '<td class="px-4 py-3">' +
                    '<input type="number" class="w-full border border-gray-300 rounded px-2 py-1 text-sm" value="' + item.price + '" onchange="updateRowAmount(this)">' +
                    '</td>' +
                    '<td class="px-4 py-3">' +
                    '<input type="text" class="w-full border border-gray-300 rounded px-2 py-1 text-sm" placeholder="备注" onchange="updateTotals()">' +
                    '</td></tr>';
            });
            document.getElementById('importTableBody').innerHTML = html;
            updateTotals();
        }

        function toggleSelectAll(checkbox) {
            var checkboxes = document.querySelectorAll('.import-checkbox');
            checkboxes.forEach(function(cb) { cb.checked = checkbox.checked; });
            updateTotals();
        }

        function batchAssignProject() {
            var project = document.getElementById('batchProject').value;
            if (!project) {
                alert('请先选择要分配的项目');
                return;
            }
            var checkboxes = document.querySelectorAll('.import-checkbox:checked');
            checkboxes.forEach(function(cb) {
                var row = cb.parentElement.parentElement;
                row.querySelector('.project-select').value = project;
            });
            updateTotals();
            alert('已批量分配项目');
        }

        function updateRowAmount(input) {
            updateTotals();
        }

        function updateTotals() {
            var rows = document.querySelectorAll('#importTableBody tr');
            var totalCount = rows.length;
            var rdCount = 0;
            var assignedCount = 0;
            var totalAmount = 0;

            rows.forEach(function(row) {
                var isChecked = row.querySelector('.import-checkbox').checked;
                var isRd = !row.classList.contains('bg-gray-50');
                var project = row.querySelector('.project-select').value;
                var quantity = parseFloat(row.querySelector('td:nth-child(6)').textContent) || 0;
                var price = parseFloat(row.querySelector('td:nth-child(10) input').value) || 0;
                
                if (isRd) rdCount++;
                if (project) assignedCount++;
                if (isChecked) totalAmount += quantity * price;
            });

            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('rdCount').textContent = rdCount;
            document.getElementById('assignedCount').textContent = assignedCount;
            document.getElementById('totalAmount').textContent = '¥' + totalAmount.toFixed(2);

            updateProjectOverview();
        }

        function updateProjectOverview() {
            var projectData = {
                'proj1': { name: '智能传感器研发', count: 0, amount: 0 },
                'proj2': { name: '工业机器人控制系统', count: 0, amount: 0 },
                'proj3': { name: '新能源材料研究', count: 0, amount: 0 },
            };

            var rows = document.querySelectorAll('#importTableBody tr');
            rows.forEach(function(row) {
                var isChecked = row.querySelector('.import-checkbox').checked;
                var project = row.querySelector('.project-select').value;
                if (isChecked && project && projectData[project]) {
                    var quantity = parseFloat(row.querySelector('td:nth-child(6)').textContent) || 0;
                    var price = parseFloat(row.querySelector('td:nth-child(10) input').value) || 0;
                    projectData[project].count++;
                    projectData[project].amount += quantity * price;
                }
            });

            var html = '<div class="space-y-3">';
            Object.values(projectData).forEach(function(p) {
                if (p.count > 0) {
                    html += '<div class="flex justify-between items-center p-3 bg-white rounded border border-gray-200">';
                    html += '<div><p class="font-medium text-gray-800">' + p.name + '</p>';
                    html += '<p class="text-xs text-gray-500">' + p.count + ' 项物料</p></div>';
                    html += '<span class="font-bold text-primary">¥' + p.amount.toFixed(2) + '</span></div>';
                }
            });
            
            if (html === '<div class="space-y-3">') {
                html += '<p class="text-sm text-gray-500 text-center py-4">导入数据后，将按项目分组显示分配情况</p>';
            }
            html += '</div>';
            document.getElementById('projectOverview').innerHTML = html;
        }

        function generateRequisitions() {
            var projectData = {
                'proj1': { name: '智能传感器研发', items: [] },
                'proj2': { name: '工业机器人控制系统', items: [] },
                'proj3': { name: '新能源材料研究', items: [] },
            };

            var rows = document.querySelectorAll('#importTableBody tr');
            rows.forEach(function(row) {
                var isChecked = row.querySelector('.import-checkbox').checked;
                var project = row.querySelector('.project-select').value;
                if (isChecked && project && projectData[project]) {
                    projectData[project].items.push({
                        code: row.querySelector('td:nth-child(2)').textContent,
                        name: row.querySelector('td:nth-child(3)').textContent,
                        spec: row.querySelector('td:nth-child(4)').textContent,
                        unit: row.querySelector('td:nth-child(5)').textContent,
                        quantity: parseFloat(row.querySelector('td:nth-child(6)').textContent) || 0,
                        price: parseFloat(row.querySelector('td:nth-child(10) input').value) || 0,
                        remark: row.querySelector('td:nth-child(11) input').value || '',
                    });
                }
            });

            var resultHtml = '';
            var totalGenerated = 0;
            
            Object.values(projectData).forEach(function(p) {
                if (p.items.length > 0) {
                    totalGenerated++;
                    var totalAmount = p.items.reduce(function(sum, item) { return sum + item.quantity * item.price; }, 0);
                    resultHtml += '<div class="mb-4 p-4 bg-gray-50 rounded border border-gray-200">';
                    resultHtml += '<h4 class="font-medium text-gray-800 mb-2">' + p.name + '</h4>';
                    resultHtml += '<p class="text-sm text-gray-500 mb-2">共 ' + p.items.length + ' 项物料，金额 ¥' + totalAmount.toFixed(2) + '</p>';
                    resultHtml += '<div class="text-xs text-gray-400">领料单号：LLD-' + new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0') + String(new Date().getDate()).padStart(2,'0') + '-' + String(totalGenerated).padStart(3,'0') + '</div></div>';
                }
            });

            if (totalGenerated === 0) {
                resultHtml = '<p class="text-center text-gray-500 py-4">未选择任何物料或未分配项目</p>';
            } else {
                resultHtml = '<p class="text-sm text-gray-600 mb-4">成功生成 ' + totalGenerated + ' 张领料单：</p>' + resultHtml;
            }

            document.getElementById('resultContent').innerHTML = resultHtml;
            document.getElementById('resultModal').classList.remove('hidden');
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        function clearAll() {
            if (confirm('确定要清空所有数据吗？')) {
                document.getElementById('importTableBody').innerHTML = '<tr class="text-center"><td colspan="11" class="py-8 text-gray-400"><i class="fa fa-upload text-4xl mb-2"></i><p>点击上方按钮导入Excel文件或加载示例数据</p></td></tr>';
                updateTotals();
            }
        }
    </script>
</body>
</html>
